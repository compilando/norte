# Linker lld para el target host (mucho más rápido linkando los muchos binarios
# de test del workspace que el `ld` por defecto). Solo el target de Linux x86_64:
# el target wasm32-wasip2 de los guests de plugin usa su propio linker y NO debe
# recibir este flag. `ld.lld` viene con el toolchain LLVM del sistema.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Windows: the C runtime linked in, not taken from `vcruntime140.dll`. A clean
# Windows does not have that DLL (it comes with the Visual C++ redistributable
# or Visual Studio), and `ntc.exe` and `norte.exe` died on start with
# 0xC0000135 there — so did the window's daemon. The build VM has Visual
# Studio and never saw it. `package.ps1` refuses a binary that imports it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Sin caché incremental. Ocupaba 54 G de los 288 G del árbol y no compra nada
# aquí: el bucle real es `just t <crate>` y el gate, ambos corridas completas
# donde incremental sólo añade escritura a disco y peor codegen. `just lint` ya
# lo apagaba a mano (CARGO_INCREMENTAL=0); esto lo hace para todas las recetas.
# No invalida artefactos existentes: no entra en el hash de metadatos.
[build]
incremental = false
