# Workspace norte — ver ARCHITECTURE.md para el mapa y docs/adr/0003 para lints/estructura.

[workspace]
resolver = "3"
members = [
    "crates/norte-proto",
    "crates/norte-vfs",
    "crates/norte-vfs-local",
    "crates/norte-vfs-sftp",
    "crates/norte-vfs-object",
    "crates/norte-vfs-archive",
    "crates/norte-connect",
    "crates/norte-config",
    "crates/norte-testkit",
    "crates/norte-core",
    "crates/norte-index",
    "crates/norte-compare",
    "crates/norte-sync",
    "crates/norte-cli",
    "crates/norte-tui",
    "crates/norte-frontend",
    "crates/norte-help",
    "crates/norte-encoding",
    "crates/norte-theme",
    "crates/norte-i18n",
    "crates/norte-plugin-host",
    "crates/norte-mcp",
    "crates/norte-ai",
    # M5: miembro del workspace para que `dist` lo vea como un binario más y
    # para que haya UN lockfile. FUERA de `default-members` (abajo): las deps
    # de GPU no deben entrar en un `cargo build`/`cargo test` sin `-p`, que es
    # lo que hacía valiosa la exclusión anterior. Su gate propio sigue siendo
    # `just gui-ci`.
    "crates/norte-gui",
]

# Lo que se construye SIN `-p`: todo menos la GUI. `just ci` cuesta lo mismo
# que antes de que la GUI entrase al workspace.
default-members = [
    "crates/norte-proto",
    "crates/norte-vfs",
    "crates/norte-vfs-local",
    "crates/norte-vfs-sftp",
    "crates/norte-vfs-object",
    "crates/norte-vfs-archive",
    "crates/norte-connect",
    "crates/norte-config",
    "crates/norte-testkit",
    "crates/norte-core",
    "crates/norte-index",
    "crates/norte-compare",
    "crates/norte-sync",
    "crates/norte-cli",
    "crates/norte-tui",
    "crates/norte-frontend",
    "crates/norte-help",
    "crates/norte-encoding",
    "crates/norte-theme",
    "crates/norte-i18n",
    "crates/norte-plugin-host",
    "crates/norte-mcp",
    "crates/norte-ai",
]
# Los guests WASM de ejemplo (M4-P2) NO son miembros del workspace: compilan a
# wasm32-wasip2 con su propio perfil, no comparten el lockfile del host.
exclude = ["crates/norte-plugin-host/examples-wasm"]

# Dev/test: debuginfo SOLO de tablas de líneas (backtraces + nº de línea, que es
# lo que este proyecto depura vía `tracing`; no gdb con inspección de variables).
# El perfil de desarrollo se afina por DISCO, no por velocidad de ejecución: el
# `target/` de este árbol llegó a 288 G en seis días, y 184 GiB de eso eran 2075
# ejecutables de test de ~265 MB cada uno. En un binario medido, `.debug_*` sumaba
# 114 MB de los 266 — es decir, la MISMA debuginfo de las dependencias copiada
# dentro de cada uno de los 2075. `line-tables-only` no bastaba: `.debug_line`
# (42 MB) y `.debug_str` (37 MB) SON el grueso.
#
# `profile.test` hereda de aquí, así que esto gobierna los binarios de nextest.
[profile.dev]
# Nuestras crates conservan tablas de líneas: sin ellas, el backtrace de un test
# en rojo no dice en qué línea. Es lo único que necesitamos depurar a diario.
debug = "line-tables-only"
# ...pero FUERA del ejecutable, en ficheros objeto aparte que los 2075 binarios
# COMPARTEN en vez de duplicar. El backtrace sigue resolviendo (el debugger los
# encuentra por ruta). Este es el cambio que rompe la multiplicación.
split-debuginfo = "unpacked"

# Las dependencias no llevan debuginfo NINGUNA. Son el 90% del código enlazado
# (el árbol de wasmtime y el de opendal son el grueso) y nadie depura dentro de
# ellas; los nombres de función siguen en la tabla de símbolos, sólo se pierde
# el número de línea de frames que no son nuestros. Además acelera su codegen.
# Para depurar dentro de una dep concreta: sube `debug` para ESA dep aquí.
[profile.dev.package."*"]
debug = 0

[profile.release]
# Binario de distribución: LTO fino + una unidad de codegen (mejor optimización)
# + strip de símbolos. Recortan ~2-3× el tamaño sobre el release por defecto.
# opt-level 3 se conserva: el arranque frío <50 ms del TUI es presupuesto de la
# spec §12. `panic` se queda en UNWIND (default) A PROPÓSITO: el core supervisa
# los panics de tasks (spec §17.7, `Internal{panic:true}`) con catch_unwind —
# `abort` lo rompería.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.package]
version = "0.3.0-alpha.2"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/compilando/norte"
authors = ["The norte Authors"]

[workspace.dependencies]
# Crates internos
norte-proto = { path = "crates/norte-proto", version = "0.3.0-alpha.2" }
norte-vfs = { path = "crates/norte-vfs", version = "0.3.0-alpha.2" }
norte-vfs-local = { path = "crates/norte-vfs-local", version = "0.3.0-alpha.2" }
norte-vfs-sftp = { path = "crates/norte-vfs-sftp", version = "0.3.0-alpha.2" }
norte-vfs-object = { path = "crates/norte-vfs-object", version = "0.3.0-alpha.2" }
norte-vfs-archive = { path = "crates/norte-vfs-archive", version = "0.3.0-alpha.2" }
norte-connect = { path = "crates/norte-connect", version = "0.3.0-alpha.2" }
norte-testkit = { path = "crates/norte-testkit", version = "0.3.0-alpha.2" }
norte-core = { path = "crates/norte-core", version = "0.3.0-alpha.2" }
norte-index = { path = "crates/norte-index", version = "0.3.0-alpha.2" }
norte-compare = { path = "crates/norte-compare", version = "0.3.0-alpha.2" }
norte-sync = { path = "crates/norte-sync", version = "0.3.0-alpha.2" }
norte-tui = { path = "crates/norte-tui", version = "0.3.0-alpha.2" }
norte-config = { path = "crates/norte-config", version = "0.3.0-alpha.2" }
norte-frontend = { path = "crates/norte-frontend", version = "0.3.0-alpha.2" }
norte-help = { path = "crates/norte-help", version = "0.3.0-alpha.2" }
norte-encoding = { path = "crates/norte-encoding", version = "0.3.0-alpha.2" }
norte-i18n = { path = "crates/norte-i18n", version = "0.3.0-alpha.2" }
norte-theme = { path = "crates/norte-theme", version = "0.3.0-alpha.2" }
norte-plugin-host = { path = "crates/norte-plugin-host", version = "0.3.0-alpha.2" }
norte-mcp = { path = "crates/norte-mcp", version = "0.3.0-alpha.2" }
norte-ai = { path = "crates/norte-ai", version = "0.3.0-alpha.2" }

# Externos: versiones centralizadas; cada crate opta por las que necesita
# con justificación en la PR que las introduce (regla 8 de CLAUDE.md).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Provider SFTP (spec §3, ADR 0013): russh (SSH async Rust puro; alternativa
# ssh2/libssh2 = binding a C con API bloqueante, rompe la regla 2) +
# russh-sftp (cliente Y servidor sobre stream crudo, base del test in-process
# sin Docker). Superficie de deps grande (aws-lc-rs) → cargo-deny vigilante.
russh = "0.62"
russh-sftp = "2.3"
# Provider FTP (fase 5bis, ADR 0014): suppaftp, cliente FTP/FTPS async (fork
# mantenido de rust-ftp), feature async sobre tokio. MLSD (RFC 3659) + REST
# (resume). Alternativa evaluada: async-ftp (sin mantener). El servidor de
# test in-process usa libunftp (dev-dep del crate).
suppaftp = "10"
# Provider de object storage (fase 7, ADR 0016): opendal, capa multi-backend
# de la ASF (S3 primero; GCS/Azure = activar features sin tocar código, spec
# §3). default-features=false + services-s3: solo el backend S3 y el
# transporte reqwest/rustls (aws-lc-rs, la MISMA pila cripto que russh/
# suppaftp). Alternativa evaluada (ADR 0016 A): aws-sdk-s3 (S3-only, stack
# smithy igual de grande, sin camino GCS/Azure) y firma sigv4 a mano
# (reqsign/rusty-s3 — deuda de mantenimiento permanente). Dep GRANDE:
# transitivas reqwest/reqsign/quick-xml bajo cargo-deny.
# Cliente HTTP directo de norte-ai (ADR 0031): MISMA versión (0.13) y MISMO
# backend cripto (aws-lc-rs) que la reqwest transitiva de opendal — una sola
# reqwest y un solo CryptoProvider de rustls en el árbol. La feature `rustls`
# de reqwest 0.13 tira de aws-lc-rs; con `rustls-tls` de 0.12 se colaba `ring`
# como segundo provider y rustls no podía autodetectar el default (rompía los
# tests FTPS de norte-connect por unificación de features del workspace).
# Sin defaults: sin cookies/proxy del sistema/compresión.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
opendal = { version = "0.58", default-features = false, features = ["services-s3", "http-transport-reqwest", "executors-tokio"] }
sha2 = "0.10"
# Anclas HMAC del head del journal (M3-5, ADR 0025): hermana RustCrypto de
# sha2 (ya presente), sin transitivas nuevas. Alternativa evaluada: firmar
# con ed25519 — dep pesada sin ganancia en un daemon mono-usuario.
hmac = "0.12"
# Generación de la clave de anclaje (M3-5): entropía del OS, YA en el árbol
# como transitiva (0.3.x); explícita solo en norte-connect.
getrandom = "0.3"
# Journal transaccional (M3-1, ADR 0020): SQLite WAL, async, runtime queries.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
# Provider archive (fase 8, ADR 0018): `tar` battle-tested y puro Rust
# (ustar/GNU/pax; alternativa hand-rolled = deuda de seguridad permanente).
tar = { version = "0.4", default-features = false }
# zip: dep RETIRADA en #59 (ADR 0030) — el crate indexaba el central
# directory por el nombre DECODIFICADO (colapso lossy H1) y un extra 0x7075
# inválido mataba el archivo entero (H3); norte-vfs-archive parsea el CD
# crudo él mismo (zip_cd.rs) y lee stored/deflate vía flate2.
# tar.gz/tgz (#55, ADR 0028): dep DIRECTA de norte-vfs-archive para el
# `MultiGzDecoder` del índice secuencial de `tar+gz` — ya transitiva vía
# `zip` (deflate-flate2-zlib-rs) con el MISMO backend zlib-rs; explícita
# aquí para no arrastrar el backend `rust_backend`/miniz_oxide por defecto.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Fase 6 (ADR 0015, connections/secretos): keyring del OS (Secret Service/
# Keychain/Credential Manager, el estándar cross-platform); age (fichero
# cifrado de secretos headless, auditado); zeroize (borrar secretos de memoria,
# spec §265). Solo en norte-connect (AGPL). cargo-deny vigilante.
# keyring 3 (no 4): v4 exige registro explícito de store; v3 tiene el
# `Entry::new(service, user)` simple. default-features=false: el crate elige
# los backends (los defaults arrastran el async zbus, no usado).
keyring = { version = "3", default-features = false }
# age 0.11 (no 0.12), y el motivo CAMBIÓ (revisado 2026-08-07, #41).
#
# Ya no es el proc-macro: i18n-embed-fl 0.10.1 migró a `proc-macro-error3`, así
# que age 0.12 sí quitaría RUSTSEC-2026-0173. Lo que queda es el precio: 0.12
# mete hpke, ml-kem, p256 y sha3 como dependencias NO opcionales —un árbol
# post-cuántico y de ECDH entero— y aquí age solo se usa para cifrar un fichero
# de secretos con passphrase (scrypt). Cambiar un proc-macro de build-time sin
# mantener por cuatro crates de criptografía dentro del binario que se
# distribuye no es un buen trato, y menos con la release congelada.
#
# Tampoco hay atajo: `i18n-embed-fl` es dependencia REQUERIDA de age en 0.11 y
# en 0.12, sin feature que la apague.
age = "0.11"
zeroize = "1"
# Solo dev (norte-connect): generación de claves ed25519 efímeras en tests
# (host keys / client keys del servidor SSH in-process). Misma major que la
# que russh usa internamente.
rand = "0.10"
# FTPS (fase 6d, ADR 0015 F): tokio-rustls construye el TlsConnector que
# suppaftp envuelve (misma versión que usa suppaftp; re-exporta rustls).
tokio-rustls = "0.26"
# Raíces CA de Mozilla compiladas: deterministas y sin depender del store del
# OS (la CA corporativa/self-signed entra por `extra_root_ca` en PEM).
webpki-roots = "1"
# Feature `pem` para parsear la CA extra (CertificateDer::pem_file_iter).
# Ya estaba en el árbol (transitiva de rustls); solo se hace directa.
rustls-pki-types = "1"
# Solo dev (norte-connect): certificado self-signed efímero del servidor FTPS
# de test (libunftp exige cert+key en PEM). default-features=false: los
# defaults arrastran ring — aws_lc_rs mantiene UNA sola pila cripto (russh/
# rustls/suppaftp ya usan aws-lc-rs).
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
thiserror = "2"
base64 = "0.22"
bitflags = { version = "2", features = ["serde"] }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", default-features = false }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
# Sink de tracing + bridge log→tracing (feature default `tracing-log`): captura
# el `log` de suppaftp para poder CAPARLO (issue #43, regla 10). env-filter para
# RUST_LOG. Solo lo usan los binarios (cli/daemon), no las libs de wire.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
# Frontend TUI (decisión cerrada en plan-m1: widgets de librería, no a mano).
# ratatui: estándar de facto, MIT, mantenimiento activo, Table/List/Gauge de
# serie. crossterm: backend de terminal 3-OS, MIT (event-stream para el loop
# async del TUI).
ratatui = "0.30"
crossterm = "0.29"
# keymap.toml y (fase 6) el resto de la config: formato mandado por la spec
# §13. toml-rs, MIT/Apache, el estándar del ecosistema.
toml = "0.9"
toml_edit = "0.25"
# Hot-reload de config (spec §13, ADR 0007): watcher multiplataforma;
# alternativa evaluada = solo polling (peor latencia y más syscalls; el
# poll queda como respaldo). CC0-1.0 (excepción acotada en deny.toml).
notify = "8"
# JSON Schema de la config (spec §13) desde los MISMOS structs serde que
# parsean: un golden test impide que diverjan. MIT.
schemars = "1"
# Viewer (spec §6, fase 7): detección BOM→chardetng→NUL y decodificación.
# Los DOS estándar de facto (Gecko); superficie grande → aislados en
# norte-encoding (MIT/Apache) según el plan. Alternativa evaluada:
# chardet portado (peor acierto) o solo UTF-8 (inaceptable, spec §6).
chardetng = "1"
encoding_rs = "0.8"
# Papelera nativa 3-OS (ADR 0009: freedesktop/Recycle Bin/NSFileManager;
# alternativa evaluada: implementación propia — 3 integraciones de
# plataforma para reinventar esto). MIT; os_limited::restore = base de M3.
trash = "5"
# i18n de los frontends (convención de CLAUDE.md: strings de UI por
# Fluent, issue #1). fluent-rs = la referencia del formato (Mozilla),
# Apache/MIT. Alternativa evaluada: gettext (formato peor para plurales
# y args) o mapas a mano (sin plurales ni fallback por locale).
fluent = "0.17"
fluent-syntax = "0.12"
unic-langid = "0.9"
# Solo norte-vfs-local (regla 5): syscalls de rename no-replace que std no
# expone — renameat2/renamex_np (libc, la misma que ya usa std) y MoveFileExW
# sin REPLACE_EXISTING (windows-sys, el binding oficial de Microsoft).
libc = "0.2"
windows-sys = "0.61"
# norte-core::volumes (plan 2026-08-10, Linux `statvfs`): `libc::statvfs` would
# need `unsafe` FFI, which regla 5 forbids outside norte-vfs-local. rustix
# wraps the same syscall safely (`rustix::fs::statvfs` takes any `path::Arg`,
# including a raw-bytes `&OsStr` via `OsStr::from_bytes` — no UTF-8 required,
# no unsafe). It is already in the dependency graph at this exact version
# (transitive of wasmtime-wasi via norte-plugin-host, and of crossterm via
# norte-tui — see `cargo tree -i rustix`): this adds one direct edge and the
# `fs` feature, not a new crate to compile. bytecodealliance-maintained,
# Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT.
rustix = { version = "1", features = ["fs"] }
# testkit (simular APFS/HFS+) y vfs-local (etiquetar colisiones por
# normalización, issue #8): NFC real, no un fold casero. unicode-rs,
# MIT/Apache; transitivas: solo tinyvec.
unicode-normalization = "0.1"
# Matchers de fs.search (M4 live search): familia ripgrep, MIT/Apache,
# mantenidas por BurntSushi, YA transitivas en el árbol → pasan a directas.
# regex: matcher de nombre/contenido con .size_limit anti-ReDoS (la bomba se
# rechaza al compilar, jamás cuelga). globset: glob de nombre (la lib de
# ripgrep; un glob a mano = bugs de escape/clase). memchr: memmem para la
# aguja multi-encoding de contenido (SIMD, búsqueda bytes-contra-bytes).
regex = "1"
globset = "0.4"
memchr = "2"

# Solo dev
proptest = "1"
tempfile = "3"
# Servidor FTP in-process para los tests del provider (fase 5bis, ADR 0014):
# libunftp (servidor FTP async tokio) + unftp-sbe-fs (backend de FS) montan un
# servidor real en 127.0.0.1:puerto-efímero sobre un tempdir, sin Docker. Solo
# dev; el nightly usa un servidor real por testcontainers.
libunftp = "0.23"
unftp-sbe-fs = "0.4"
# Servidor S3 in-process para los tests del provider object (fase 7, ADR 0016
# J): s3s (framework de servicio S3) + s3s-fs (backend de FS) sirven la API S3
# real en 127.0.0.1:puerto-efímero sobre un tempdir, sin Docker — el patrón
# libunftp/russh-server. s3s-fs es EXPERIMENTAL: el spike de 7b midió su
# fidelidad (multipart/if_not_exists/delimiter fieles; markers de dir vacío y
# nombres >255 bytes NO) → el contrato corre sobre services-fs de opendal y la
# suite S3-específica sobre s3s-fs (tests/common). Nightly = MinIO real.
s3s = "0.14"
s3s-fs = "0.14"
# Glue HTTP del servidor s3s in-process (hyper 1 ya está en el árbol vía
# reqwest/libunftp; hyper-util aporta el serve_connection con TokioIo).
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
assert_cmd = "2"
# Fase 10 (calidad, spec §12): snapshots del TUI y benchmarks de los
# presupuestos (cold start <50 ms; 100k listado <200 ms a primer render).
insta = "1"
criterion = { version = "0.8", default-features = false }
# Scripting Lua embebido en el TUI (M4, ADR 0026): mlua con Lua 5.4 VENDORIZADO
# (C propio, sin depender del liblua del sistema) + `async` (corrutinas
# polleadas inline en el loop del TUI, los futures de mlua son !Send) +
# `serialize` (paso de tablas Lua <-> serde para la API `norte.*`). Alternativa
# evaluada: crate `norte-lua` aparte (circularidad con tipos del App hoy) y
# Lua en el core (contradice spec §7.2, scripting de usuario en el daemon).
mlua = { version = "0.10", features = ["lua54", "vendored", "async", "serialize"] }

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Única excepción global a pedantic: el patrón norte-vfs::provider::Provider
# la dispara constantemente y no aporta.
module_name_repetitions = "allow"
