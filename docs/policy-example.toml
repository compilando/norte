# Starting policy for agent clients (specification section 10, ADR 0024).
# Copy this file to your configuration directory as `policy.toml`; the daemon
# loads it at startup. Without a policy file, an agent is denied even inside a
# granted scope. A useful minimal policy asks for every operation.
#
# Rules are evaluated in order and the first path match wins. When an operation
# has several paths, the most restrictive result applies. Rules apply only to
# agents inside an already granted scope; access outside that scope is always
# denied. Human (`User`) clients are not sandboxed by these rules.

# Ask a person to approve every attempted agent operation in the TUI.
[[rule]]
action = "ask"

# More specific examples belong before the catch-all rule above. Move the
# catch-all to the end, then uncomment and adjust the rules you need.
#
# [[rule]]                     # Allow copies within one project
# op = "copy"
# path_prefix = "file:///home/your-user/projects/x"
# action = "allow"
#
# [[rule]]                     # Never let agents delete
# op = "delete"
# actor = "agent"
# action = "deny"
#
# [[rule]]                     # Deny all agent operations over SFTP
# scheme = "sftp"
# actor = "agent"
# action = "deny"
