[package]
name = "norte-term"
description = "PURE terminal grid: a pty's bytes parsed into cells, cursor and attributes. No pty, no toolkit and no theme"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The escapes' STATE MACHINE, and ONLY that (rule 8).
#
# **Benefit**: recognizing CSI, OSC, DCS and UTF-8 boundaries is the part
# with the truly rare edge cases, and the one that should not be written by
# hand. The GRID is ours: it is where the foreign content's masking and the
# hostile corpus's tests live, so it is best not to inherit it.
#
# **Size**: adds ONE crate to the tree. `vte` pulls in `arrayvec` and
# `memchr`, and both were already in the lock. With the default features
# (`std` only): the high-level ANSI handler (`ansi`) stays out and with it
# `log`, `bitflags` and `cursor-icon`; `Perform` is implemented by hand here.
#
# **Maintenance**: it is alacritty's, and it is the parser alacritty itself
# ships. License `Apache-2.0 OR MIT`, same as ours.
#
# **Alternatives**: `vt100` (0.16.2, MIT) is THIS `vte` plus a grid, i.e.
# three crates to hand us exactly what T1 delivers — and its upstream is
# stalled: there are four published forks (`panoptes-vt100`,
# `term-wm-vt100`, `atuin-vt100`, a `-patch4`), so a bug there would mean
# maintaining someone else's grid. `alacritty_terminal` is 28 crates and
# brings selection, search and damage tracking nobody asked for, under a
# plain Apache license. `termwiz` (wezterm's, the same project as
# `portable-pty`) is 98 crates: what is shared with what is already here is
# the pty, not its dependencies.
vte = "0.15"
# A wide character takes up TWO cells, and the grid has to know it or the
# rest of the line comes out shifted. Same tool and same version
# `norte-frontend` and `norte-tui` already use to measure text.
unicode-width = "0.2"

# A live shell behind the grid, for whoever wants a terminal pane (`pty`
# feature, OFF by default: whoever only parses bytes compiles none of this
# and the crate stays what its front cover says).
#
# Was already in the tree via ADR 0084 —the terminal's subshell— so no new
# edge comes in. It lives here and not in every frontend because both need
# it with the same pty, the same reader thread and the same delicate part:
# answering terminal queries before anything else.
portable-pty = { version = "0.9", optional = true }

[features]
pty = ["dep:portable-pty"]

[dev-dependencies]
# The CANONICAL hostile corpus, which is what the plan asked for this phase
# and what a hand-written list here does not give: a new fixture enters the
# corpus and tests everyone who uses it, this grid included. A program
# inside the pane is foreign content, just like a filename.
norte-testkit.workspace = true
# The bytes NOBODY would write by hand: an emulator is fed whatever another
# program spits out, so what needs testing is that no sequence crashes it,
# not the fifteen we can think of.
proptest.workspace = true

[lints]
workspace = true
