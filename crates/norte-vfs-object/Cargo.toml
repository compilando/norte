[package]
name = "norte-vfs-object"
description = "VFS provider over object storage (opendal: S3 first)"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
# The Operator arrives INJECTED already configured (bucket/region/credentials
# in norte-connect, phase 7d — ADR 0016 B); the provider never sees the secret.
opendal.workspace = true
tracing.workspace = true
# `rt` only: the sink's Drop aborts the orphaned multipart best-effort via
# Handle::try_current().spawn() — the abort is a network call, not a
# synchronous unlink like local's.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
# SHA-256 for partial_digest's contractual test (#35).
sha2.workspace = true
# services-fs: the CONTRACT's harness (the same provider logic without
# HTTP; the 7b spike measured that s3s-fs loses empty-dir markers and long
# names). Not services-memory: no atomic_write_dir nor POSIX fs semantics.
hyper-util.workspace = true
norte-testkit.workspace = true
opendal = { workspace = true, features = ["services-fs"] }
s3s.workspace = true
s3s-fs.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[features]
# NIGHTLY integration test against a REAL S3 server (MinIO) via
# testcontainers (ADR 0016 J, spec §12). Outside the PR gate: requires
# Docker — run by the nightly workflow, not `just ci`.
it-s3 = ["dep:testcontainers"]

[dependencies.testcontainers]
version = "0.27"
optional = true

# The `reals3` test only compiles with the `it-s3` feature (nightly).
[[test]]
name = "reals3"
required-features = ["it-s3"]

[lints]
workspace = true
