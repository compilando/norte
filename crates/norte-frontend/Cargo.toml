[package]
name = "norte-frontend"
description = "Lógica de presentación PURA compartida por los frontends (TUI/GUI): saneado de nombres hostiles y orden de listado. Sin dependencias de UI."
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
norte-config.workspace = true
norte-proto.workspace = true
norte-encoding.workspace = true
norte-theme.workspace = true
unicode-normalization.workspace = true
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = ["derive"], optional = true }
thiserror.workspace = true
toml.workspace = true
# `SettingsState`/`PendingWrite` (S4 hoist, `settings.rs`): `toml_edit::Value`
# is `norte_config::persist_set`'s typed value — the settings editor builds
# it directly so BOTH frontends write the exact same wire shape without a
# round-trip through a generic string.
toml_edit.workspace = true
# Settings registry (S2, `settings.rs`): cada `SettingDef` resuelve un par de
# claves Fluent (`setting-<id>-name`/`-desc`) — el mismo crate que YA usan
# ambos frontends para localizar el resto de la UI, aquí en su capa
# compartida en vez de duplicado. In-workspace, sin coste de build nuevo
# fuera de compilar un crate que ya se compilaba de todas formas.
norte-i18n.workspace = true
# H3b: the help corpus and its model. The dependency runs frontend → help and
# never the other way (`norte_help::resolve`'s rustdoc says why): a
# `norte-help` that knew about a frontend could only ever serve one of the
# three. Already in the graph as a workspace crate — nothing new enters.
norte-help.workspace = true
# Glob de nombre para marcar por patrón (#103): la MISMA lib que usa
# norte-core en fs.search, así que el patrón que el usuario aprende en la
# búsqueda vale aquí. Ya está en el grafo (workspace dep), no entra nada nuevo.
globset.workspace = true
# Motor Unicode para el patrón de marcado (#110): el regex byte-mode de
# globset se recompila char-wise (`?` = un carácter, no un byte). Ya está
# en el grafo (workspace dep de norte-core), no entra nada nuevo.
regex.workspace = true
# Ancho de CELDA para la elipsis media (`middle_ellipsis`, hoisted del TUI por
# el audit M4-IA-2 H1): CJK/emoji ocupan 2 columnas y presupuestar por chars
# desborda el ancho → el frontend re-trunca por la derecha comiéndose la cola
# (#79). Herramienta estándar (la usa la propia ratatui, misma versión ya en el
# árbol vía norte-tui), MIT/Apache, mantenida — no entra nada nuevo al grafo.
unicode-width = "0.2"
# Shell integration (`shell.rs`, S2 `--pick`): `vpath_to_native` is the ONE
# function that turns a `file://` VPath into the bytes a shell-side tool can
# open, and it already lives here (rule 1: no frontend may re-derive native
# path rules from the wire form). The alternative is duplicating the local
# scheme's authority/segment rules a second time in this crate, which is
# exactly the drift `norte-vfs-local` exists to prevent. Already in the
# workspace graph (every provider that composes over local goes through it);
# nothing new enters the dependency tree.
norte-vfs-local.workspace = true
# Vigilancia de los dirs visibles (#106), compartida por los dos frontends: la
# TUI la estrenó y la GUI la necesita igual, y duplicarla sería duplicar también
# el pitfall de inotify que ya está resuelto una vez aquí. `notify` ya es
# dependencia del workspace (la usa `norte-config` para recargar la config) y
# `tokio` ya estaba en el grafo de este crate por `norte-vfs-local`: las dos son
# una ARISTA nueva, no código nuevo que entre al árbol (regla 8).
notify.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }

[dev-dependencies]
norte-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[features]
# Generación de los JSON Schema publicados (golden test de docs/schema);
# fuera del binario final (ADR 0007) — mismo patrón que norte-tui.
schema = ["dep:schemars"]

[lints]
workspace = true
