[package]
name = "norte-frontend"
description = "Lógica de presentación PURA compartida por los frontends (TUI/GUI): saneado de nombres hostiles y orden de listado. Sin dependencias de UI."
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
norte-config.workspace = true
norte-proto.workspace = true
norte-encoding.workspace = true
norte-theme.workspace = true
unicode-normalization.workspace = true
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = ["derive"], optional = true }
thiserror.workspace = true
toml.workspace = true
# `SettingsState`/`PendingWrite` (S4 hoist, `settings.rs`): `toml_edit::Value`
# is `norte_config::persist_set`'s typed value — the settings editor builds
# it directly so BOTH frontends write the exact same wire shape without a
# round-trip through a generic string.
toml_edit.workspace = true
# Settings registry (S2, `settings.rs`): cada `SettingDef` resuelve un par de
# claves Fluent (`setting-<id>-name`/`-desc`) — el mismo crate que YA usan
# ambos frontends para localizar el resto de la UI, aquí en su capa
# compartida en vez de duplicado. In-workspace, sin coste de build nuevo
# fuera de compilar un crate que ya se compilaba de todas formas.
norte-i18n.workspace = true
# Glob de nombre para marcar por patrón (#103): la MISMA lib que usa
# norte-core en fs.search, así que el patrón que el usuario aprende en la
# búsqueda vale aquí. Ya está en el grafo (workspace dep), no entra nada nuevo.
globset.workspace = true
# Motor Unicode para el patrón de marcado (#110): el regex byte-mode de
# globset se recompila char-wise (`?` = un carácter, no un byte). Ya está
# en el grafo (workspace dep de norte-core), no entra nada nuevo.
regex.workspace = true

[dev-dependencies]
norte-testkit.workspace = true
tempfile.workspace = true

[features]
# Generación de los JSON Schema publicados (golden test de docs/schema);
# fuera del binario final (ADR 0007) — mismo patrón que norte-tui.
schema = ["dep:schemars"]

[lints]
workspace = true
