[package]
name = "norte-frontend"
description = "PURE presentation logic shared by the frontends (TUI/GUI): hostile-name sanitizing and listing order. No UI dependencies."
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
norte-config.workspace = true
norte-proto.workspace = true
norte-encoding.workspace = true
norte-theme.workspace = true
unicode-normalization.workspace = true
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = ["derive"], optional = true }
thiserror.workspace = true
# `secret::TypedSecret` (#327): a half-typed password's buffer is overwritten
# with zeros when dropped. It was already in the graph via norte-tui; what
# this move does is keep the window from inheriting a second copy without the
# guarantee. It is a security type, and there cannot be two of those.
zeroize.workspace = true
# `Params` (`layout::tree`): a pane's OPAQUE bag. It is `serde_json::Map`
# because L2's session blob travels over JSON-RPC and the layout file uses
# the SAME format (ADR 0058 D4) — a single value model for both. Already in
# the graph via norte-proto: nothing new enters the build.
serde_json.workspace = true
toml.workspace = true
# `SettingsState`/`PendingWrite` (S4 hoist, `settings.rs`): `toml_edit::Value`
# is `norte_config::persist_set`'s typed value — the settings editor builds
# it directly so BOTH frontends write the exact same wire shape without a
# round-trip through a generic string.
toml_edit.workspace = true
# Settings registry (S2, `settings.rs`): every `SettingDef` resolves a pair of
# Fluent keys (`setting-<id>-name`/`-desc`) — the same crate BOTH frontends
# already use to localize the rest of the UI, here in their shared layer
# instead of duplicated. In-workspace, no new build cost beyond compiling a
# crate that was already being compiled anyway.
norte-i18n.workspace = true
# The LOCAL time of `TimeFormat::Smart` (spec 2026-09-10): see the
# justification in the workspace's `Cargo.toml`.
jiff.workspace = true
# H3b: the help corpus and its model. The dependency runs frontend → help and
# never the other way (`norte_help::resolve`'s rustdoc says why): a
# `norte-help` that knew about a frontend could only ever serve one of the
# three. Already in the graph as a workspace crate — nothing new enters.
norte-help.workspace = true
# Name glob for marking by pattern (#103): the SAME lib norte-core uses in
# fs.search, so the pattern the user learns in search also works here.
# Already in the graph (workspace dep), nothing new enters.
globset.workspace = true
# Unicode engine for the marking pattern (#110): globset's byte-mode regex
# gets recompiled char-wise (`?` = one character, not one byte). Already
# in the graph (norte-core's workspace dep), nothing new enters.
regex.workspace = true
# CELL width for the middle ellipsis (`middle_ellipsis`, hoisted from the TUI
# by audit M4-IA-2 H1): CJK/emoji take up 2 columns and budgeting by chars
# overflows the width → the frontend re-truncates from the right, eating the
# tail (#79). Standard tool (used by ratatui itself, same version already in
# the tree via norte-tui), MIT/Apache, maintained — nothing new enters the graph.
unicode-width = "0.2"
# Shell integration (`shell.rs`, S2 `--pick`): `vpath_to_native` is the ONE
# function that turns a `file://` VPath into the bytes a shell-side tool can
# open (rule 1: no frontend may re-derive native path rules from the wire
# form). It used to live in `norte-vfs-local`, and depending on that crate
# pulled the one crate allowed `unsafe` — with `openat2` and `ConfinedRoot`
# inside — into every frontend for a string conversion. It now lives in
# `norte-vfs`, which is the trait crate and touches no disk (#254).
norte-vfs.workspace = true
# OSC 52 (#286): the only way to copy to the clipboard from a terminal over
# SSH is to send the EMULATOR the sequence with the text in base64. Already a
# workspace dependency (proto, client, mcp): nothing new enters.
base64.workspace = true
# Watching the visible dirs (#106), shared by both frontends: the TUI
# pioneered it and the GUI needs it just the same, and duplicating it would
# also duplicate the inotify pitfall already solved once here. `notify` is
# already a workspace dependency (`norte-config` uses it to reload config)
# and `tokio` was already in this crate's graph via `norte-vfs-local`: both
# are a new EDGE, not new code entering the tree (rule 8).
notify.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }

[dev-dependencies]
norte-testkit.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[features]
# Generates the published JSON Schemas (docs/schema golden test); out of the
# final binary (ADR 0007) — same pattern as norte-tui.
schema = ["dep:schemars"]

[lints]
workspace = true
