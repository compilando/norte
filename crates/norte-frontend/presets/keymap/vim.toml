# Preset vim-like. Prefix-free (ADR 0006): sin pares tipo `d`/`d d` — los
# modos visual/normal de la spec llegarán como CONTEXTOS, no timeouts.

[global]
keymap = [
    { on = ["q"], run = "app.quit" },
    { on = ["ctrl+c"], run = "app.quit" },
    { on = ["tab"], run = "pane.switch" },
    { on = ["f1"], run = "app.help" },
    { on = ["f9"], run = "app.theme" },
    { on = ["f12"], run = "app.extensions" },
    { on = ["?"], run = "app.help" },
    { on = ["ctrl+p"], run = "app.palette" },
    # `:` libre en [global]/[pane] (H1 T4): la palette es el análogo del
    # command-line mode de vim — muscle memory obvia.
    { on = [":"], run = "app.palette" },
]

[pane]
keymap = [
    { on = ["k"], run = "cursor.up" },
    { on = ["j"], run = "cursor.down" },
    { on = ["up"], run = "cursor.up" },
    { on = ["down"], run = "cursor.down" },
    { on = ["ctrl+u"], run = "cursor.page-up" },
    { on = ["ctrl+d"], run = "cursor.page-down" },
    { on = ["g", "g"], run = "cursor.top" },
    { on = ["G"], run = "cursor.bottom" },
    { on = ["l"], run = "nav.enter" },
    { on = ["enter"], run = "nav.enter" },
    { on = ["h"], run = "nav.parent" },
    { on = ["backspace"], run = "nav.parent" },
    { on = ["f5"], run = "pane.copy" },
    { on = ["f6"], run = "pane.move" },
    { on = ["f8"], run = "pane.delete" },
    { on = ["shift+f8"], run = "pane.delete-permanent" },
    { on = ["ctrl+k"], run = "task.cancel" },
    { on = ["f3"], run = "pane.view" },
    { on = ["/"], run = "pane.quick-search" },
    { on = ["alt+down"], run = "pane.history" },
    { on = ["alt+f7"], run = "pane.search" },
    { on = ["alt+e"], run = "pane.names-encoding" },
    # ctrl+d ya es cursor.page-down (vim half-page) en este preset — colisión;
    # ctrl+b (libre aquí) para pane.hotlist. Anotado en la spec (navTC T3/T6).
    { on = ["ctrl+b"], run = "pane.hotlist" },
]

[viewer]
keymap = [
    { on = ["q"], run = "viewer.close" },
    { on = ["esc"], run = "viewer.close" },
    { on = ["f3"], run = "viewer.close" },
    { on = ["f10"], run = "viewer.close" },
    { on = ["up"], run = "viewer.up" },
    { on = ["down"], run = "viewer.down" },
    { on = ["pgup"], run = "viewer.page-up" },
    { on = ["pgdn"], run = "viewer.page-down" },
    { on = ["home"], run = "viewer.top" },
    { on = ["end"], run = "viewer.bottom" },
    { on = ["e"], run = "viewer.encoding" },
    { on = ["E"], run = "viewer.encoding-auto" },
    { on = ["x"], run = "viewer.hex" },
    { on = ["k"], run = "viewer.up" },
    { on = ["j"], run = "viewer.down" },
    { on = ["g", "g"], run = "viewer.top" },
    { on = ["G"], run = "viewer.bottom" },
]

[dialog]
keymap = [
    { on = ["enter"], run = "dialog.confirm" },
    { on = ["y"], run = "dialog.approve" },
    { on = ["n"], run = "dialog.deny" },
    { on = ["esc"], run = "dialog.cancel" },
    { on = ["o"], run = "dialog.overwrite" },
    { on = ["s"], run = "dialog.skip" },
    { on = ["r"], run = "dialog.rename" },
    { on = ["w"], run = "dialog.newer" },
    { on = ["up"], run = "dialog.up" },
    { on = ["down"], run = "dialog.down" },
    { on = ["pgup"], run = "dialog.page-up" },
    { on = ["pgdn"], run = "dialog.page-down" },
    { on = ["a"], run = "dialog.add" },
    { on = ["e"], run = "dialog.toggle-enabled" },
    { on = ["d"], run = "dialog.remove" },
    { on = ["k"], run = "dialog.up" },
    { on = ["j"], run = "dialog.down" },
]
