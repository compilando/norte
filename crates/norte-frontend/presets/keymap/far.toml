# Far Manager — transcribed 2026-08-09 from far-funccmd.txt and
# far-panelcmd.txt (both split by topic out of FarGroup/FarManager's own
# FarEng.hlf.m4, the source Far's own help is compiled from).
#
# Divergences from the original: panel cursor movement (arrows, PgUp/PgDn,
# Home/End) is not itemized in either source — both documents describe only
# what Far adds on top of the console default, the same gap TC's and
# Krusader's own sources left — so it is bound the same minimal way. No bare
# letter is ever bound: Far's own "Fast find" (quicksearch by typing the
# first letters of a name, @PanelList) claims an unmodified letter, so
# binding one here would shadow it. F8, Shift+F8 and Shift+Del all bind
# `pane.delete`: far-funccmd.txt lists the three together on ONE "Delete"
# line under the single @DeleteFile topic, differing only in whether the
# whole panel selection or just the file under the cursor is affected — a
# selection-scope nuance `pane.delete` does not model, not three different
# commands. Alt+Del ("Wipe" — overwrite-then-rename secure erase) is the key
# that matches `pane.delete-permanent`'s semantics, not Shift+F8. Ctrl+A is
# Far's own "Set file attributes" dialog, and since #314 it binds `pane.chmod`,
# which is what that dialog DOES; it used to land on `pane.properties` because
# norte could only look. Far has no documented select-all key in these two
# sources, so
# `mark.all`/`mark.clear` are simply unbound here rather than approximated
# onto Ctrl+A. Shift+F5 ("Copy" the file under the cursor,
# ignoring the selection) is the same in-place variant TC and Krusader both
# omitted at their own Shift+F5/Shift+F7 — omitted here for the same reason.
# Shift+F6 was omitted with it and should not have been (#228): Far's own
# "Rename or move" IS what norte calls `pane.rename`, it is the chord
# `total-commander.toml` already gives that command, and without it the
# preset had no rename key at all.
# Shift+Gray+ and Shift+Gray- (select-all-files / deselect-all-files) cannot
# be expressed at all: `parse_chord` rejects `shift+<char>` for ANY
# single-character key, not only letters, and `+`/`-`/`*` are single-character
# keys — they join the omitted list below, not approximated onto `mark.all`.
#
# `pane.compare-dirs` is deliberately UNBOUND here. Far's own "Compare
# folders" lives on the F9 pull-down (Commands menu) with no chord of its
# own, and Shift+F2 — the default the other presets take from Total
# Commander — is already Far's "Unpack files". Inventing a chord for a
# preset whose whole point is fidelity would be worse than the reference
# sheet listing it unbound, which is what happens instead.
# `pane.sync-dirs` is unbound for the same reason and a stronger one: Far
# has no folder synchroniser in the shipped product at all (Advanced Compare
# is a plugin), so there is no key to transcribe.
# `pane.mirror` and `pane.pull` are unbound too, and this is the third shape
# of the same decision (#228): they are norte's own panel gestures — send the
# other panel to this path, and bring its path here — and neither
# far-funccmd.txt nor far-panelcmd.txt names anything that does either. What
# Far has in that neighbourhood is Ctrl+U, which SWAPS the two panels, and
# that is already bound to `pane.swap`.
#
# Omitted families (norte has no concept): the pull-down menu bar (F9) and
# its "select last menu item" (Shift+F10); the user menu (F2); the plugin
# commands menu (F11) and plugin configuration (Alt+Shift+F9); internal/
# external viewer and editor toggles (Alt+F3, Alt+F4— norte has one viewer
# and one editor, no alternate to switch to); printing (Alt+F5); NTFS
# hard-link creation (Alt+F6); command-line history (Alt+F8) and file
# view/edit history (Alt+F11), distinct from the folder history at Alt+F12,
# which IS bound to `pane.history`; console window resize (Alt+F9); find
# folder (Alt+F10), a narrower relative of find file already bound at
# Alt+F7; in-place copy/rename variants ignoring selection (Shift+F5,
# Shift+F6); execute-in-separate-window and execute-as-administrator
# (Shift+Enter, Ctrl+Alt+Enter); jumping to the filesystem root (Ctrl+\\, no
# such concept, matching TC/Krusader); Ctrl+Shift+PgDn's "always open
# archive regardless of association" nuance, redundant with the Ctrl+PgDn
# already bound; numbered folder shortcuts (Ctrl+Shift+0..9 assign,
# RightCtrl+0..9 jump) — a slot system distinct from the hotlist list
# dialog, and RightCtrl cannot be expressed as a modifier anyway;
# Ctrl+1..Ctrl+0 view modes (documented family, rule 3); the info panel
# (Ctrl+L) and the quick view panel (Ctrl+Q); Ctrl+Alt+Shift held-to-peek
# panels, inactive-panel-only hide (Ctrl+P), single left/right panel hide
# (Ctrl+F1/F2), panel height/width resizing and its restore-defaults
# variants (Ctrl+Up/Down, Ctrl+Shift+Up/Down, Ctrl+Left/Right,
# Ctrl+Numpad5, Ctrl+Alt+Numpad5); the function-key bar and status-line
# toggles (Ctrl+B, Ctrl+Shift+B) and the byte/suffix size-display toggle
# (Ctrl+Shift+S); long/short filename display toggle (Ctrl+N); extension-
# and name-scoped selection variants (Ctrl+Gray+/-/*, Alt+Gray+/-/*) and
# restore-previous-selection (Ctrl+M); select-all-files/deselect-all-files
# (Shift+Gray+, Shift+Gray-, see divergences above); long-name scrolling
# (Alt+Left/Right, Alt+Home/End); clipboard name/path copy variants other
# than the one bound (Ctrl+Ins, Ctrl+Shift+Ins, Ctrl+Alt+Ins, Ctrl+Shift+C,
# Ctrl+Shift+X — Alt+Shift+Ins "copy full names" is the one bound, to
# `pane.copy-path`); apply-command-to-selection (Ctrl+G) and describe/
# comment files (Ctrl+Z); sort criteria the catalogue doesn't distinguish
# from the one `pane.sort-time` flavor already bound (creation time
# Ctrl+F8, access time Ctrl+F9, description Ctrl+F10, owner Ctrl+F11), plus
# unsorted (Ctrl+F7), group-sorting (Shift+F11) and selected-first
# (Shift+F12); the archive management submenu (Shift+F3) — several
# operations behind one menu, not a single action; save configuration
# (Shift+F9).
#
# `layout.flip` (ADR 0138) is unbound in all seven presets on purpose: Far
# has no such action to transcribe, and it lives on the `[/]` layout button,
# the Panels menu and the palette.

# `pane.compare-files` (#312) se queda SIN ATAR aquí, por la misma regla que
# deja fuera a `pane.compare-dirs`: la fuente de este preset no le atribuye
# acorde, y un preset cuyo objetivo es la fidelidad no inventa uno. Los tres
# presets nativos lo llevan en `alt+C`.

# La historia (spec 2026-09-15). Far no tiene atrás/adelante: sus Alt+←/→
# desplazan los nombres largos, así que `nav.back`/`nav.forward` se quedan sin
# tecla. Su historia de carpetas es la lista de Alt+F12, atada arriba, y las
# teclas de ESA lista (Del quita, Shift+Del vacía) son las que norte usa en el
# diálogo. `Ins` (bloquear una entrada) no se copia: una entrada que sobrevive
# a todo es un favorito, y norte ya los tiene. El punto de salto, los populares
# y la historia de un lado no están en la fuente: menú Ir y paleta.
#
# `app.goto` («ir a cualquier sitio», fase 6) sigue ese mismo criterio y se
# queda sin atar: es una pantalla propia de norte —historia, populares,
# favoritos, conexiones, comandos y una ruta tecleada, todo en una lista— y
# Far no tiene una sola tecla que haga eso. `ctrl+g` está libre en los siete
# presets y lo llevan orthodox, cua y vim. Aquí se llega por el menú Ir
# (F9), donde está el primero, y por la paleta.

dialog_from = "orthodox"

[global]
keymap = [
    { on = ["tab"], run = "pane.switch" },
    { on = ["f1"], run = "app.help" },
    { on = ["f10"], run = "app.quit" },
    { on = ["ctrl+o"], run = "app.toggle-panels" },
    # Las superficies PROPIAS de norte, que este gestor no tenía y por
    # tanto no hay nada que transcribir: ajustes, extensiones y paleta.
    # Sin ellas la configuración no se alcanza desde el teclado, que es
    # lo que pasaba hasta ahora en este preset. F11/F12 están libres
    # aquí y son lo que usan orthodox/vim/cua; para la paleta, ctrl+p
    # (libre en Far).
    { on = ["f11"], run = "app.settings" },
    { on = ["f12"], run = "app.extensions" },
    # El tema, en `alt+9`. F9 está libre aquí pero es el MENÚ en FAR, y
    # robársela pelearía con la memoria muscular de quien eligió este preset.
    # Ver la nota larga en krusader.toml.
    { on = ["alt+9"], run = "app.theme" },
    { on = ["ctrl+p"], run = "app.palette" },
    # F9 is the menu bar in FAR (attested: "F9 — Show menu"); alt+m stays as
    # the shared chord every preset carries (spec 2026-09-10).
    { on = ["f9"], run = "app.menu" },
    { on = ["alt+m"], run = "app.menu" },
    { on = ["alt+b"], run = "layout.places" },
    { on = ["alt+q"], run = "layout.preview" },
    # El anillo de paneles y el panel de procesos. Ver la nota larga en
    # orthodox.toml: son superficies propias de norte y no hay nada que
    # transcribir de FAR sobre ellas.
    { on = ["alt+o"], run = "layout.focus-next" },
    { on = ["alt+O"], run = "layout.focus-prev" },
    { on = ["alt+j"], run = "layout.processes" },
    # El registro (#323): no lo atestigua far, se ata igual porque es de norte
    # y `alt+l` está libre. Ver el bloque de divergencias de la cabecera.
    { on = ["alt+l"], run = "layout.log" },
    # El mapa de disco (fase 4). FAR no tiene un panel así y no atestigua
    # acorde alguno, así que esto no es una transcripción: `alt+z` es la única
    # letra libre en los siete presets. Ver orthodox.toml.
    { on = ["alt+z"], run = "layout.disk-map" },
    # El resto de la familia `layout.*`, con los mismos acordes que en los
    # otros seis presets: ver la nota larga en `orthodox.toml`.
    { on = ["alt+x"], run = "layout.close-slot" },
    { on = ["alt+["], run = "layout.shrink" },
    { on = ["alt+]"], run = "layout.grow" },
    { on = ["alt+="], run = "layout.equalize" },
    { on = ["alt+g"], run = "layout.set-target" },
]

[pane]
keymap = [
    # Far no tiene navegación sincronizada, así que no hay acorde que
    # transcribir: va el nuestro, igual en los siete (ver `orthodox`).
    { on = ["ctrl+e"], run = "pane.sync-nav" },
    { on = ["up"], run = "cursor.up" },
    { on = ["down"], run = "cursor.down" },
    { on = ["pgup"], run = "cursor.page-up" },
    { on = ["pgdn"], run = "cursor.page-down" },
    { on = ["home"], run = "cursor.top" },
    { on = ["end"], run = "cursor.bottom" },
    { on = ["enter"], run = "nav.enter" },
    { on = ["ctrl+pgdn"], run = "nav.enter" },
    { on = ["ctrl+pgup"], run = "nav.parent" },
    # F3 also computes/shows folder sizes when the cursor is on a folder —
    # native dual behaviour of one key, not a second binding.
    { on = ["f3"], run = "pane.view" },
    # F4 on a folder opens the change-attributes dialog instead of the
    # editor — same one-key-two-meanings shape as F3 above, still the
    # closest catalogue command for the file case.
    { on = ["f4"], run = "pane.edit" },
    { on = ["f5"], run = "pane.copy" },
    { on = ["f6"], run = "pane.move" },
    # Shift+F6 is Far's own "Rename or move the file under the cursor", and it
    # is the same chord `total-commander.toml` gives `pane.rename` — because it
    # is the same key in the original. It was omitted here as an "in-place
    # variant ignoring the selection", lumped in with Shift+F5; that reading
    # fits Shift+F5 (which really would only duplicate `pane.copy`) and not
    # this one: renaming in place is a command of its own in norte, and
    # without this it had no key in the whole preset (#228).
    { on = ["shift+f6"], run = "pane.rename" },
    { on = ["f7"], run = "pane.mkdir" },
    { on = ["f8"], run = "pane.delete" },
    { on = ["shift+f8"], run = "pane.delete" },
    { on = ["shift+delete"], run = "pane.delete" },
    { on = ["alt+delete"], run = "pane.delete-permanent" },
    { on = ["alt+f1"], run = "pane.select-drive-left" },
    { on = ["alt+f2"], run = "pane.select-drive-right" },
    { on = ["alt+f7"], run = "pane.search" },
    { on = ["alt+f12"], run = "pane.history" },
    { on = ["shift+f1"], run = "pane.pack" },
    { on = ["shift+f2"], run = "pane.unpack" },
    { on = ["shift+f4"], run = "pane.edit-new" },
    # #314: `Ctrl+A` es «Set file attributes» en far-panelcmd.txt, y ahora hay
    # un comando que hace ESO. Aterrizaba en `pane.properties` porque norte
    # solo sabía mirar; enseñar los permisos donde la fuente dice «cambiarlos»
    # era la aproximación que este preset tenía y que ya no hace falta.
    { on = ["ctrl+a"], run = "pane.chmod" },
    # Y `pane.properties` se queda SIN ATAR aquí: FAR no tiene un cuadro de
    # «propiedades» aparte del de atributos, así que darle una tecla sería
    # inventarle una función a un preset que existe para no inventar. La hoja
    # de referencia imprime `—`, que es la verdad.
    { on = ["ctrl+u"], run = "pane.swap" },
    { on = ["ctrl+r"], run = "pane.refresh" },
    { on = ["ctrl+t"], run = "pane.tree" },
    { on = ["ctrl+h"], run = "pane.toggle-hidden" },
    { on = ["ctrl+f3"], run = "pane.sort-name" },
    { on = ["ctrl+f4"], run = "pane.sort-ext" },
    { on = ["ctrl+f5"], run = "pane.sort-time" },
    { on = ["ctrl+f6"], run = "pane.sort-size" },
    { on = ["ctrl+f12"], run = "pane.sort-menu" },
    { on = ["insert"], run = "mark.toggle" },
    { on = ["plus"], run = "mark.pattern-add" },
    { on = ["-"], run = "mark.pattern-remove" },
    # Marcar MOVIÉNDOSE. La fuente lo atestigua en prosa («para deseleccionar,
    # mantén Shift y muévete en la dirección contraria») pero no lo itemiza en
    # su tabla de teclas, igual que el movimiento del cursor del panel: se ata
    # como lo ata orthodox. Que el tramo lo decida la fila del CURSOR es justo
    # lo que hace cierta esa frase.
    { on = ["shift+down"], run = "mark.toggle" },
    { on = ["shift+up"], run = "mark.toggle-up" },
    { on = ["shift+pgdn"], run = "mark.toggle-page-down" },
    { on = ["shift+pgup"], run = "mark.toggle-page-up" },
    { on = ["shift+home"], run = "mark.to-top" },
    { on = ["shift+end"], run = "mark.to-bottom" },
    { on = ["*"], run = "mark.invert" },
    # #313: `Ctrl+M` es «restore previous selection» en far-panelcmd.txt, y
    # estaba en la lista de omisiones de arriba por no haber comando al que
    # atarlo. Las variantes por extensión y por nombre (`Ctrl+Gray+/-`,
    # `Alt+Gray+/-`) siguen omitidas: la fuente las agrupa en una línea y no
    # dice cuál de los dos modificadores es la EXTENSIÓN, y elegir uno a ojo
    # marcaría un conjunto distinto del que el lector espera.
    { on = ["ctrl+m"], run = "mark.restore" },
    { on = ["alt+shift+insert"], run = "pane.copy-path" },
    # `alt+t`/`alt+w` y no `ctrl+T`/`ctrl+W`: la mayúscula es el shift en la
    # gramática y NO en el cable — un terminal manda el mismo byte que para la
    # minúscula, y `ctrl+t` aquí es `pane.tree`. Las pestañas estaban
    # anunciadas y no se abrían. Ver la nota larga en krusader.toml.
    { on = ["alt+t"], run = "pane.tab-new" },
    { on = ["alt+w"], run = "pane.tab-close" },
    { on = ["alt+n"], run = "pane.tab-next" },
    { on = ["alt+p"], run = "pane.tab-prev" },
    # Las sumas (#311). Krusader las tiene en su menú File y ninguno de los
    # cuatro importados les da acorde, así que la tecla se ELIGE: `alt+k`
    # calcula y `alt+K` comprueba — libre en los siete, y la mayúscula
    # para la variante, como `alt+o`/`alt+O` en el anillo de paneles.
    { on = ["alt+k"], run = "pane.checksum" },
    { on = ["alt+K"], run = "pane.checksum-verify" },
    { on = ["alt+h"], run = "layout.split-h" },
    { on = ["alt+v"], run = "layout.split-v" },
]

[viewer]
keymap = [
    { on = ["esc"], run = "viewer.close" },
    { on = ["f3"], run = "viewer.close" },
    { on = ["f10"], run = "viewer.close" },
    { on = ["up"], run = "viewer.up" },
    { on = ["down"], run = "viewer.down" },
    { on = ["pgup"], run = "viewer.page-up" },
    { on = ["pgdn"], run = "viewer.page-down" },
    { on = ["home"], run = "viewer.top" },
    { on = ["end"], run = "viewer.bottom" },
    { on = ["left"], run = "viewer.left" },
    { on = ["right"], run = "viewer.right" },
    # Superficie propia de norte: Far no atesta un zoom en su visor, así que
    # estas tres son elección nuestra y van igual en los siete presets (ver
    # `orthodox.toml`).
    { on = ["f5"], run = "viewer.zoom-out" },
    { on = ["f6"], run = "viewer.zoom-in" },
    { on = ["f7"], run = "viewer.zoom-fit" },
    { on = ["f8"], run = "viewer.prev" },
    { on = ["f9"], run = "viewer.next" },
]
