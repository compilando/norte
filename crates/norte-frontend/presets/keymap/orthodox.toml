# Preset orthodox (mc clásico) — el default del producto (decisión 2026-07-10).
# Tab entre panes es sagrado (spec §12). F5/F6/F7/F8 llegan con la fase 5.

[global]
keymap = [
    { on = ["q"], run = "app.quit" },
    { on = ["f10"], run = "app.quit" },
    { on = ["ctrl+c"], run = "app.quit" },
    { on = ["tab"], run = "pane.switch" },
    { on = ["f1"], run = "app.help" },
    { on = ["f9"], run = "app.theme" },
    { on = ["f12"], run = "app.extensions" },
]

[pane]
keymap = [
    { on = ["up"], run = "cursor.up" },
    { on = ["down"], run = "cursor.down" },
    { on = ["pgup"], run = "cursor.page-up" },
    { on = ["pgdn"], run = "cursor.page-down" },
    { on = ["home"], run = "cursor.top" },
    { on = ["end"], run = "cursor.bottom" },
    { on = ["enter"], run = "nav.enter" },
    { on = ["backspace"], run = "nav.parent" },
    { on = ["f5"], run = "pane.copy" },
    { on = ["f6"], run = "pane.move" },
    { on = ["f8"], run = "pane.delete" },
    { on = ["shift+f8"], run = "pane.delete-permanent" },
    { on = ["ctrl+k"], run = "task.cancel" },
    { on = ["f3"], run = "pane.view" },
    { on = ["f4"], run = "pane.open" },
    { on = ["/"], run = "pane.quick-search" },
    { on = ["alt+down"], run = "pane.history" },
    { on = ["alt+f7"], run = "pane.search" },
    { on = ["alt+e"], run = "pane.names-encoding" },
    { on = ["ctrl+d"], run = "pane.hotlist" },
]

[viewer]
keymap = [
    { on = ["q"], run = "viewer.close" },
    { on = ["esc"], run = "viewer.close" },
    { on = ["f3"], run = "viewer.close" },
    { on = ["f10"], run = "viewer.close" },
    { on = ["up"], run = "viewer.up" },
    { on = ["down"], run = "viewer.down" },
    { on = ["pgup"], run = "viewer.page-up" },
    { on = ["pgdn"], run = "viewer.page-down" },
    { on = ["home"], run = "viewer.top" },
    { on = ["end"], run = "viewer.bottom" },
    { on = ["e"], run = "viewer.encoding" },
    { on = ["E"], run = "viewer.encoding-auto" },
    { on = ["x"], run = "viewer.hex" },
]
