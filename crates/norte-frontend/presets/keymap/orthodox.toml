# Preset orthodox (mc clásico) — el default del producto (decisión 2026-07-10).
# Tab entre panes es sagrado (spec §12). F5/F6/F7/F8 llegan con la fase 5.
#
# `layout.flip` (ADR 0138) va sin tecla a propósito, como en los siete: vive
# en el botón `[/]` de la barra de disposición, el menú Paneles y la paleta.

[global]
keymap = [
    { on = ["q"], run = "app.quit" },
    { on = ["f10"], run = "app.quit" },
    { on = ["ctrl+c"], run = "app.quit" },
    { on = ["tab"], run = "pane.switch" },
    { on = ["f1"], run = "app.help" },
    # F9 abre el MENÚ, como en mc, far y Norton Commander (spec 2026-09-10):
    # es memoria muscular de toda la familia. El tema pasa a alt+9, donde ya
    # estaba en los cuatro presets importados.
    { on = ["f9"], run = "app.menu" },
    { on = ["alt+9"], run = "app.theme" },
    { on = ["f11"], run = "app.settings" },
    { on = ["f12"], run = "app.extensions" },
    { on = ["ctrl+p"], run = "app.palette" },
    # Al lado de la paleta porque es su hermana: la paleta pregunta «qué
    # hago», ésta «a dónde voy» —y también qué hago, porque los comandos son
    # una de sus secciones—.
    { on = ["ctrl+g"], run = "app.goto" },
    { on = ["alt+m"], run = "app.menu" },
    { on = ["alt+b"], run = "layout.places" },
    { on = ["alt+q"], run = "layout.preview" },
    # Los paneles laterales tenían tecla para ABRIRSE y ninguna para
    # recorrerse: `tab` alterna los dos listados y nada más, así que con el
    # sidebar y el visor en pantalla había que acordarse de la tecla de cada
    # uno para moverse entre ellos. `alt+o` pasa al SIGUIENTE panel del anillo
    # —los listados y todo panel que sepa quedarse el teclado, en el orden en
    # que están en pantalla— y `alt+O` al anterior. Es el «otro» del `C-x o`
    # de Emacs; aquí no hay nada que transcribir de ningún gestor de
    # referencia, porque ninguno tenía paneles laterales que enfocar.
    { on = ["alt+o"], run = "layout.focus-next" },
    { on = ["alt+O"], run = "layout.focus-prev" },
    # Y el panel de procesos no tenía tecla en NINGUNO de los siete: al único
    # sitio que dice qué está copiando norte se llegaba solo por el menú.
    # `alt+j` de «jobs».
    { on = ["alt+j"], run = "layout.processes" },
    # El registro (#323). `alt+l` de «log», libre en los siete presets.
    { on = ["alt+l"], run = "layout.log" },
    # El mapa de disco (fase 4). `alt+z` era la ÚNICA letra libre en los siete
    # presets: de la `a` a la `y` no queda ninguna sin atar en alguno. El
    # mnemónico es malo y se asume — una tecla rara se aprende, una que hace
    # dos cosas distintas según el preset, no.
    { on = ["alt+z"], run = "layout.disk-map" },
    # El panel de terminal (#362). `ctrl+alt+s`, de «shell», y NO `ctrl+alt+t`,
    # que es la letra obvia y está libre en los siete: lo secuestra el
    # escritorio —GNOME y KDE lo atan de fábrica a «abrir un terminal»—, así
    # que norte no lo vería nunca. Un binding que existe, que la hoja de
    # referencia imprime y que no hace nada es justo lo que #250 arregló.
    # `alt+<letra>` tampoco era opción: ese espacio lo agotó el mapa de disco.
    #
    # Es el panel que más se queda el teclado —los demás consumen comandos, y
    # éste consume bytes—, así que sin tecla no se entra y sobre todo no se
    # sale. El segundo toque devuelve el foco y deja el shell VIVO; cerrarlo es
    # `layout.close-slot`.
    { on = ["ctrl+alt+s"], run = "layout.terminal" },
    # El resto de la familia `layout.*`, que estaba SIN TECLA en los siete
    # presets: cerrar un hueco, cambiarle el ancho, igualarlos y designar el
    # destino. Se llegaba solo por el menú o la paleta, y el menú los pintaba
    # con `—`. Designar el destino además hacía falta para poder usar los
    # gestos de panel con tres o más (ADR 0058 D7): la barra decía «designa
    # antes un destino» y no había tecla con la que hacerlo.
    #
    # Ninguno de los siete gestores originales tenía estos conceptos, así que
    # no hay nada que transcribir y la tecla se elige a mano — igual que
    # `alt+j` de arriba. Van en `[global]` y no en `[pane]` a propósito: los
    # paneles laterales los aceptan en su allowlist, y ahí solo llega lo que
    # `[global]` mezcla en la pantalla de diálogo.
    #
    # `alt+x` cierra, los corchetes estrechan y ensanchan, `alt+=` iguala. Los
    # cinco acordes están libres en los SIETE presets, así que la familia se
    # escribe igual en todos: una tecla de disposición no debería cambiar
    # porque cambies de preset.
    { on = ["alt+x"], run = "layout.close-slot" },
    { on = ["alt+["], run = "layout.shrink" },
    { on = ["alt+]"], run = "layout.grow" },
    { on = ["alt+="], run = "layout.equalize" },
    # Y el destino. `alt+g` no tiene mnemónico y no lo finge: las letras con
    # uno (`d` de destino, `t` de target) ya están cogidas en otros presets, y
    # lo que importa es que sea la MISMA en los siete.
    { on = ["alt+g"], run = "layout.set-target" },
]

[pane]
keymap = [
    # Navegación SINCRONIZADA: mientras está puesta, cada `cd` del panel con
    # foco lo repite el otro. Ninguno de los cuatro gestores importados
    # atestigua un acorde para esto —Krusader lo lleva en un botón, y Far,
    # Norton y Total Commander no lo tienen—, así que la elección es nuestra y
    # va IGUAL en los siete, como el zoom del visor. `ctrl+e` porque está
    # libre en los siete y es entregable en cualquier terminal.
    { on = ["ctrl+e"], run = "pane.sync-nav" },
    { on = ["up"], run = "cursor.up" },
    { on = ["down"], run = "cursor.down" },
    { on = ["pgup"], run = "cursor.page-up" },
    { on = ["pgdn"], run = "cursor.page-down" },
    { on = ["home"], run = "cursor.top" },
    { on = ["end"], run = "cursor.bottom" },
    { on = ["enter"], run = "nav.enter" },
    { on = ["backspace"], run = "nav.parent" },
    { on = ["alt+left"], run = "nav.back" },
    { on = ["alt+right"], run = "nav.forward" },
    # mc: `Alt+Y` es atrás en la historia de directorios, y ESE se ata. Su
    # pareja `Alt+U` (adelante) no: aquí `alt+u` es `pane.pull` desde julio y
    # un lector de norte ya lo tiene en los dedos; adelante sigue en
    # `alt+right`. El punto de salto y los populares no tienen tecla en mc:
    # están en el menú Ir y en la paleta, igual que la historia de un lado.
    { on = ["alt+y"], run = "nav.back" },
    { on = ["alt+i"], run = "pane.mirror" },
    { on = ["alt+u"], run = "pane.pull" },
    { on = ["ctrl+u"], run = "pane.swap" },
    { on = ["f5"], run = "pane.copy" },
    { on = ["f6"], run = "pane.move" },
    { on = ["f7"], run = "pane.mkdir" },
    { on = ["shift+f6"], run = "pane.rename" },
    # El lote por plantilla (#310). Sin tecla atestiguada aquí —TC lo pone
    # en `ctrl+m` y Krusader en `shift+f2`, y los dos presets la llevan—,
    # así que se elige: `alt+r` de «rename», libre en los siete.
    { on = ["alt+r"], run = "pane.rename-batch" },
    { on = ["f8"], run = "pane.delete" },
    { on = ["shift+f8"], run = "pane.delete-permanent" },
    { on = ["ctrl+k"], run = "task.cancel" },
    { on = ["ctrl+alt+k"], run = "task.pause" },
    { on = ["ctrl+alt+r"], run = "task.retry" },
    { on = ["ctrl+alt+q"], run = "task.queue" },
    { on = ["ctrl+alt+up"], run = "task.up" },
    { on = ["ctrl+alt+down"], run = "task.down" },
    { on = ["f3"], run = "pane.view" },
    # F4 EDITA (#133), que es lo que hace en los cuatro managers que este
    # preset recoge y lo que un lector espera de la tecla. Abrir con el
    # programa del sistema —lo que hacía F4 antes— se queda en `alt+f4`: sigue
    # a una tecla de distancia y ya no ocupa la que todo el mundo usa para
    # editar.
    { on = ["f4"], run = "pane.edit" },
    { on = ["shift+f4"], run = "pane.edit-new" },
    { on = ["alt+f4"], run = "pane.open" },
    # #138: el orden por tecla, con los chords de Far/TC (Ctrl+F3..F6). El menú
    # de orden es el diálogo de columnas, que ya tiene el suyo en `alt+c`.
    { on = ["ctrl+f3"], run = "pane.sort-name" },
    { on = ["ctrl+f4"], run = "pane.sort-ext" },
    { on = ["ctrl+f5"], run = "pane.sort-time" },
    { on = ["ctrl+f6"], run = "pane.sort-size" },
    # #139: propiedades y recuento, con los chords de TC/Krusader.
    { on = ["alt+enter"], run = "pane.properties" },
    { on = ["ctrl+l"], run = "pane.dir-size" },
    # #136: el árbol de directorios. Far usa Ctrl+T; aquí `alt+t`, porque
    # Ctrl+T en este preset ya es una pestaña nueva.
    { on = ["alt+t"], run = "pane.tree" },
    # #140: abrir una conexión guardada y cerrarla. Ctrl+N es el de TC y
    # Krusader; el cierre no tiene chord común entre managers, así que va con
    # el mismo modificador que el resto de esta familia.
    { on = ["ctrl+n"], run = "pane.connect" },
    # `alt+d`, y no `alt+n`: ese ya era de `pane.tab-next` unas líneas más
    # abajo, y un acorde atado dos veces en la misma sección no da dos
    # comandos — da uno, y el otro se queda SIN TECLA sin decirlo (salía como
    # `—` en el menú, en la paleta y en la hoja de atajos). `alt+d` estaba
    # libre aquí y es el que `krusader` ya usa para desconectar. Hay test.
    { on = ["alt+d"], run = "pane.disconnect" },
    { on = ["/"], run = "pane.quick-search" },
    { on = ["alt+down"], run = "pane.history" },
    # mc abre la misma lista con `Alt+Shift+H`.
    { on = ["alt+H"], run = "pane.history" },
    { on = ["alt+f7"], run = "pane.search" },
    # Total Commander's key for it, adopted as the product default: mc's own
    # "Compare directories" lives in a pull-down menu with no chord to copy.
    { on = ["shift+f2"], run = "pane.compare-dirs" },
    # Krusader's "Synchronize Folders" chord, adopted as the product default
    # for the sync half — it is the only reference manager that gives the
    # feature a chord at all. Deliberately NOT a modified function key: under
    # tmux none of them reaches the app (#159), and this repo has already
    # shipped one documented dead shortcut.
    # #312: comparar DOS FICHEROS, que es otra pregunta que comparar dos
    # árboles. `alt+C` porque `alt+c` ya es el diálogo de columnas y la
    # mayúscula es la variante, como en las sumas. NO es una tecla de
    # función con modificador, por lo mismo que `ctrl+y`: bajo tmux no
    # llegan (#159).
    { on = ["alt+C"], run = "pane.compare-files" },
    { on = ["ctrl+y"], run = "pane.sync-dirs" },
    { on = ["alt+e"], run = "pane.names-encoding" },
    { on = ["ctrl+r"], run = "pane.refresh" },
    { on = ["ctrl+h"], run = "pane.toggle-hidden" },
    { on = ["alt+."], run = "pane.toggle-hidden" },
    { on = ["alt+c"], run = "pane.columns" },
    { on = ["ctrl+d"], run = "pane.hotlist" },
    { on = ["insert"], run = "mark.toggle" },
    { on = ["space"], run = "mark.toggle" },
    { on = ["ctrl+a"], run = "mark.all" },
    # #314: cambiar los permisos POSIX. `alt+A` porque `ctrl+a` es marcar
    # todo en este preset y la mayúscula queda para la variante, como en
    # las sumas; en FAR sí hay acorde atestiguado y allí es el suyo.
    { on = ["alt+A"], run = "pane.chmod" },
    # `alt+a` y no `ctrl+A`: la mayúscula ES el shift en la gramática de
    # acordes, pero un terminal manda el MISMO byte para Ctrl+A y Ctrl+Shift+A,
    # así que el binding existía y la tecla no hacía nada. Hay test.
    { on = ["alt+a"], run = "mark.clear" },
    { on = ["*"], run = "mark.invert" },
    # #313: los tres huecos de la familia Gray de Total Commander, que norte
    # no tenía. `alt+plus`/`alt+-` son los acordes que TC atestigua para la
    # selección por EXTENSIÓN; ficheros/carpetas y restaurar son mayúsculas
    # de su inicial, porque las de TC (`Shift+Gray+`, `NUM/`) no se pueden
    # escribir en esta gramática o ya significan otra cosa aquí.
    { on = ["alt+plus"], run = "mark.extension-add" },
    { on = ["alt+-"], run = "mark.extension-remove" },
    # Minúscula: `alt+f` estaba libre, y una mayúscula bajo Alt es pedir Shift
    # sin decirlo. Las otras cuatro (`alt+C/A/D/R`) siguen con Shift porque su
    # minúscula está ocupada, y la etiqueta lo dice ahora (`Alt+Shift+C`).
    { on = ["alt+f"], run = "mark.files" },
    { on = ["alt+D"], run = "mark.dirs" },
    { on = ["alt+R"], run = "mark.restore" },
    { on = ["plus"], run = "mark.pattern-add" },
    { on = ["-"], run = "mark.pattern-remove" },
    # Marcar MOVIÉNDOSE: la otra mitad de la familia. `space`/`insert` marcan
    # BAJANDO y no había nada para subir ni para un tramo. Los seis van aquí
    # —el preset de la casa— y los cuatro importados los toman de aquí, que es
    # la regla que ya siguen las flechas y PgUp/PgDn: sus fuentes no itemizan
    # el movimiento del cursor del panel.
    { on = ["shift+down"], run = "mark.toggle" },
    { on = ["shift+up"], run = "mark.toggle-up" },
    { on = ["shift+pgdn"], run = "mark.toggle-page-down" },
    { on = ["shift+pgup"], run = "mark.toggle-page-up" },
    { on = ["shift+home"], run = "mark.to-top" },
    { on = ["shift+end"], run = "mark.to-bottom" },
    { on = ["ctrl+t"], run = "pane.tab-new" },
    { on = ["ctrl+w"], run = "pane.tab-close" },
    { on = ["alt+n"], run = "pane.tab-next" },
    { on = ["alt+p"], run = "pane.tab-prev" },
    # Las sumas (#311). Krusader las tiene en su menú File y ninguno de los
    # cuatro importados les da acorde, así que la tecla se ELIGE: `alt+k`
    # calcula y `alt+K` comprueba — libre en los siete, y la mayúscula
    # para la variante, como `alt+o`/`alt+O` en el anillo de paneles.
    { on = ["alt+k"], run = "pane.checksum" },
    { on = ["alt+K"], run = "pane.checksum-verify" },
    { on = ["alt+h"], run = "layout.split-h" },
    { on = ["alt+v"], run = "layout.split-v" },
]

[viewer]
keymap = [
    { on = ["q"], run = "viewer.close" },
    { on = ["esc"], run = "viewer.close" },
    { on = ["f3"], run = "viewer.close" },
    { on = ["f10"], run = "viewer.close" },
    { on = ["up"], run = "viewer.up" },
    { on = ["down"], run = "viewer.down" },
    { on = ["pgup"], run = "viewer.page-up" },
    { on = ["pgdn"], run = "viewer.page-down" },
    { on = ["home"], run = "viewer.top" },
    { on = ["end"], run = "viewer.bottom" },
    { on = ["left"], run = "viewer.left" },
    { on = ["right"], run = "viewer.right" },
    { on = ["e"], run = "viewer.encoding" },
    { on = ["E"], run = "viewer.encoding-auto" },
    { on = ["x"], run = "viewer.hex" },
    # El zoom de una imagen. Teclas de función porque son las que la barra
    # del visor NOMBRA: un zoom que no se ve en ningún sitio es un zoom que
    # nadie encuentra. Ningún gestor de referencia atesta estas tres, así
    # que la elección es nuestra y va igual en los siete presets.
    { on = ["f5"], run = "viewer.zoom-out" },
    { on = ["f6"], run = "viewer.zoom-in" },
    { on = ["f7"], run = "viewer.zoom-fit" },
    # Las hermanas del listado, por lo mismo que el zoom: teclas de función
    # porque son las que la barra del visor NOMBRA. Van igual en los siete.
    #
    # DIVERGENCIA consciente: `f9` es `app.menu` en global, así que dentro del
    # visor el menú deja de abrirse con esa tecla y se abre con `alt+m`, que ya
    # lo abre en los siete. Se acepta porque el menú es de la APLICACIÓN y el
    # visor es una pantalla propia —sus teclas son suyas mientras dura—,
    # mientras que pasar de foto es justo lo que se quiere hacer ahí.
    { on = ["f8"], run = "viewer.prev" },
    { on = ["f9"], run = "viewer.next" },
]

[dialog]
keymap = [
    { on = ["enter"], run = "dialog.confirm" },
    { on = ["y"], run = "dialog.approve" },
    { on = ["n"], run = "dialog.deny" },
    { on = ["esc"], run = "dialog.cancel" },
    { on = ["o"], run = "dialog.overwrite" },
    { on = ["s"], run = "dialog.skip" },
    { on = ["r"], run = "dialog.rename" },
    { on = ["w"], run = "dialog.newer" },
    { on = ["up"], run = "dialog.up" },
    { on = ["down"], run = "dialog.down" },
    { on = ["pgup"], run = "dialog.page-up" },
    { on = ["pgdn"], run = "dialog.page-down" },
    { on = ["home"], run = "dialog.top" },
    { on = ["end"], run = "dialog.bottom" },
    { on = ["["], run = "dialog.section-prev" },
    { on = ["]"], run = "dialog.section-next" },
    { on = ["a"], run = "dialog.add" },
    { on = ["e"], run = "dialog.toggle-enabled" },
    { on = ["space"], run = "dialog.toggle-enabled" },
    { on = ["d"], run = "dialog.remove" },
    { on = ["shift+up"], run = "dialog.move-up" },
    { on = ["shift+down"], run = "dialog.move-down" },
    { on = ["K"], run = "dialog.move-up" },
    { on = ["J"], run = "dialog.move-down" },
    { on = ["ctrl+s"], run = "dialog.sort" },
    { on = ["f"], run = "dialog.cycle-format" },
    { on = ["tab"], run = "dialog.pane" },
    { on = ["backspace"], run = "dialog.back" },
    { on = ["/"], run = "dialog.filter" },
    # Las listas de historia (spec 2026-09-15 D2), con las teclas de la lista
    # de Far —la única fuente que las itemiza— donde un terminal las entrega:
    # `Del` quita y `Shift+Del` vacía. Abrir en el OTRO panel es
    # `Ctrl+Shift+Enter` en Far, y ningún terminal lo distingue de Enter:
    # `alt+enter` sí llega.
    { on = ["delete"], run = "dialog.remove" },
    { on = ["shift+delete"], run = "dialog.clear" },
    { on = ["alt+enter"], run = "dialog.confirm-other" },
]
