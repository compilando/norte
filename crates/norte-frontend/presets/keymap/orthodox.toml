# Orthodox preset (classic mc) — the product's default (decision 2026-07-10).
# Tab between panes is sacred (spec §12). F5/F6/F7/F8 arrive with phase 5.
#
# `layout.flip` (ADR 0138) deliberately ships with no key, as in all seven: it
# lives on the `[/]` button of the layout bar, the Panes menu and the palette.

[global]
keymap = [
    { on = ["q"], run = "app.quit" },
    { on = ["f10"], run = "app.quit" },
    { on = ["ctrl+c"], run = "app.quit" },
    { on = ["tab"], run = "pane.switch" },
    { on = ["f1"], run = "app.help" },
    # F9 opens the MENU, as in mc, far and Norton Commander (spec 2026-09-10):
    # it is muscle memory across the whole family. The theme moves to alt+9,
    # where it already was in the four imported presets.
    { on = ["f9"], run = "app.menu" },
    { on = ["alt+9"], run = "app.theme" },
    { on = ["f11"], run = "app.settings" },
    { on = ["f12"], run = "app.extensions" },
    { on = ["ctrl+p"], run = "app.palette" },
    # Next to the palette because it is its sibling: the palette asks "what
    # do I do", this one "where do I go" —and also what to do, because
    # commands are one of its sections—.
    { on = ["ctrl+g"], run = "app.goto" },
    { on = ["alt+m"], run = "app.menu" },
    { on = ["alt+b"], run = "layout.places" },
    { on = ["alt+q"], run = "layout.preview" },
    # The side panels had a key to OPEN and none to cycle: `tab` toggles the
    # two listings and nothing else, so with the sidebar and the viewer on
    # screen you had to remember each one's own key to move between them.
    # `alt+o` moves to the NEXT panel of the ring —the listings and any panel
    # that can hold the keyboard, in the order they are on screen— and
    # `alt+O` to the previous one. It is Emacs's `C-x o`'s "other"; there is
    # nothing to transcribe here from any reference manager, because none of
    # them had side panels to focus.
    { on = ["alt+o"], run = "layout.focus-next" },
    { on = ["alt+O"], run = "layout.focus-prev" },
    # And the process panel had no key in ANY of the seven: the only place
    # that says what norte is copying was reached only through the menu.
    # `alt+j` for "jobs".
    { on = ["alt+j"], run = "layout.processes" },
    # The log (#323). `alt+l` for "log", free in all seven presets.
    { on = ["alt+l"], run = "layout.log" },
    # The disk map (phase 4). `alt+z` was the ONLY letter free across all
    # seven presets: from `a` to `y` none is left unbound in at least one of
    # them. The mnemonic is bad and that is accepted — a strange key is
    # learned, one that does two different things depending on the preset is
    # not.
    { on = ["alt+z"], run = "layout.disk-map" },
    # The terminal panel (#362). `ctrl+alt+s`, for "shell", and NOT
    # `ctrl+alt+t`, which is the obvious letter and is free in all seven: the
    # desktop hijacks it —GNOME and KDE bind it out of the box to "open a
    # terminal"—, so norte would never see it. A binding that exists, that
    # the reference sheet prints and that does nothing is exactly what #250
    # fixed. `alt+<letter>` was not an option either: that space was used up
    # by the disk map.
    #
    # It is the panel that holds the keyboard the most —the others consume
    # commands, and this one consumes bytes—, so with no key you cannot enter
    # it and, above all, cannot leave it. The second press returns focus and
    # leaves the shell ALIVE; closing it is `layout.close-slot`.
    { on = ["ctrl+alt+s"], run = "layout.terminal" },
    # The rest of the `layout.*` family, which had NO KEY across all seven
    # presets: closing a slot, resizing it, equalizing them and setting the
    # target. It was reached only through the menu or the palette, and the
    # menu painted them with `—`. Setting the target was also needed to use
    # the pane gestures with three or more (ADR 0058 D7): the bar said "set a
    # target first" and there was no key to do it with.
    #
    # None of the seven original managers had these concepts, so there is
    # nothing to transcribe and the key is chosen by hand — same as `alt+j`
    # above. They go in `[global]` and not in `[pane]` on purpose: the side
    # panels accept them in their allowlist, and there only what `[global]`
    # mixes into the dialog screen arrives.
    #
    # `alt+x` closes, the brackets shrink and grow, `alt+=` equalizes. All
    # five chords are free in all SEVEN presets, so the family is written the
    # same in every one: a layout key should not change just because you
    # switch presets.
    { on = ["alt+x"], run = "layout.close-slot" },
    { on = ["alt+["], run = "layout.shrink" },
    { on = ["alt+]"], run = "layout.grow" },
    { on = ["alt+="], run = "layout.equalize" },
    # And the target. `alt+g` has no mnemonic and does not fake one: the
    # letters that would have one (`d` for destination, `t` for target) are
    # already taken in other presets, and what matters is that it be the
    # SAME across all seven.
    { on = ["alt+g"], run = "layout.set-target" },
]

[pane]
keymap = [
    # SYNCHRONIZED navigation: while it is on, every `cd` in the focused pane
    # is repeated by the other one. None of the four imported managers
    # attests a chord for this —Krusader carries it on a button, and Far,
    # Norton and Total Commander do not have it—, so the choice is ours and
    # is the SAME across all seven, like the viewer's zoom. `ctrl+e` because
    # it is free in all seven and deliverable in any terminal.
    { on = ["ctrl+e"], run = "pane.sync-nav" },
    { on = ["up"], run = "cursor.up" },
    { on = ["down"], run = "cursor.down" },
    { on = ["pgup"], run = "cursor.page-up" },
    { on = ["pgdn"], run = "cursor.page-down" },
    { on = ["home"], run = "cursor.top" },
    { on = ["end"], run = "cursor.bottom" },
    { on = ["enter"], run = "nav.enter" },
    { on = ["backspace"], run = "nav.parent" },
    { on = ["alt+left"], run = "nav.back" },
    { on = ["alt+right"], run = "nav.forward" },
    # mc: `Alt+Y` is back in the directory history, and THAT one is bound.
    # Its partner `Alt+U` (forward) is not: here `alt+u` has been
    # `pane.pull` since July and a norte reader already has it in their
    # fingers; forward stays on `alt+right`. The jump point and the
    # favourites have no key in mc: they are in the Go menu and the palette,
    # same as one side's history.
    { on = ["alt+y"], run = "nav.back" },
    { on = ["alt+i"], run = "pane.mirror" },
    { on = ["alt+u"], run = "pane.pull" },
    { on = ["ctrl+u"], run = "pane.swap" },
    { on = ["f5"], run = "pane.copy" },
    { on = ["f6"], run = "pane.move" },
    { on = ["f7"], run = "pane.mkdir" },
    { on = ["shift+f6"], run = "pane.rename" },
    # Template batch rename (#310). No attested key here —TC puts it on
    # `ctrl+m` and Krusader on `shift+f2`, and both presets carry it—, so
    # one is chosen: `alt+r` for "rename", free in all seven.
    { on = ["alt+r"], run = "pane.rename-batch" },
    { on = ["f8"], run = "pane.delete" },
    { on = ["shift+f8"], run = "pane.delete-permanent" },
    { on = ["ctrl+k"], run = "task.cancel" },
    { on = ["ctrl+alt+k"], run = "task.pause" },
    { on = ["ctrl+alt+r"], run = "task.retry" },
    { on = ["ctrl+alt+q"], run = "task.queue" },
    { on = ["ctrl+alt+up"], run = "task.up" },
    { on = ["ctrl+alt+down"], run = "task.down" },
    { on = ["f3"], run = "pane.view" },
    # F4 EDITS (#133), which is what it does in the four managers this
    # preset draws from and what a reader expects from the key. Opening with
    # the system's program —what F4 used to do— stays on `alt+f4`: still one
    # key away and no longer occupying the one everyone uses to edit.
    { on = ["f4"], run = "pane.edit" },
    { on = ["shift+f4"], run = "pane.edit-new" },
    { on = ["alt+f4"], run = "pane.open" },
    # #138: sort by key, with Far/TC's chords (Ctrl+F3..F6). The sort menu
    # is the columns dialog, which already has its own on `alt+c`.
    { on = ["ctrl+f3"], run = "pane.sort-name" },
    { on = ["ctrl+f4"], run = "pane.sort-ext" },
    { on = ["ctrl+f5"], run = "pane.sort-time" },
    { on = ["ctrl+f6"], run = "pane.sort-size" },
    # #139: properties and dir-size, with TC/Krusader's chords.
    { on = ["alt+enter"], run = "pane.properties" },
    { on = ["ctrl+l"], run = "pane.dir-size" },
    # #136: the directory tree. Far uses Ctrl+T; here `alt+t`, because
    # Ctrl+T in this preset is already a new tab.
    { on = ["alt+t"], run = "pane.tree" },
    # #140: opening a saved connection and closing it. Ctrl+N is TC's and
    # Krusader's; closing has no chord common between managers, so it goes
    # with the same modifier as the rest of this family.
    { on = ["ctrl+n"], run = "pane.connect" },
    # `alt+d`, and not `alt+n`: that one already belonged to `pane.tab-next`
    # a few lines below, and a chord bound twice in the same section does
    # not give two commands — it gives one, and the other is silently left
    # WITHOUT A KEY (it showed as `—` in the menu, the palette and the
    # shortcut sheet). `alt+d` was free here and is the one `krusader`
    # already uses to disconnect. There is a test.
    { on = ["alt+d"], run = "pane.disconnect" },
    { on = ["/"], run = "pane.quick-search" },
    { on = ["alt+down"], run = "pane.history" },
    # mc opens the same list with `Alt+Shift+H`.
    { on = ["alt+H"], run = "pane.history" },
    { on = ["alt+f7"], run = "pane.search" },
    # Total Commander's key for it, adopted as the product default: mc's own
    # "Compare directories" lives in a pull-down menu with no chord to copy.
    { on = ["shift+f2"], run = "pane.compare-dirs" },
    # Krusader's "Synchronize Folders" chord, adopted as the product default
    # for the sync half — it is the only reference manager that gives the
    # feature a chord at all. Deliberately NOT a modified function key: under
    # tmux none of them reaches the app (#159), and this repo has already
    # shipped one documented dead shortcut.
    # #312: comparing TWO FILES, which is a different question than
    # comparing two trees. `alt+C` because `alt+c` is already the columns
    # dialog and the uppercase letter is the variant, as with the checksums.
    # NOT a function key with a modifier, for the same reason as `ctrl+y`:
    # they do not arrive under tmux (#159).
    { on = ["alt+C"], run = "pane.compare-files" },
    { on = ["ctrl+y"], run = "pane.sync-dirs" },
    { on = ["alt+e"], run = "pane.names-encoding" },
    { on = ["ctrl+r"], run = "pane.refresh" },
    { on = ["ctrl+h"], run = "pane.toggle-hidden" },
    { on = ["alt+."], run = "pane.toggle-hidden" },
    { on = ["alt+c"], run = "pane.columns" },
    { on = ["ctrl+d"], run = "pane.hotlist" },
    { on = ["insert"], run = "mark.toggle" },
    { on = ["space"], run = "mark.toggle" },
    { on = ["ctrl+a"], run = "mark.all" },
    # #314: change POSIX permissions. `alt+A` because `ctrl+a` is mark-all
    # in this preset and the uppercase letter is left for the variant, as
    # with the checksums; FAR does have an attested chord and there it is
    # its own.
    { on = ["alt+A"], run = "pane.chmod" },
    # `alt+a` and not `ctrl+A`: the uppercase letter IS the shift in the
    # chord grammar, but a terminal sends the SAME byte for Ctrl+A and
    # Ctrl+Shift+A, so the binding existed and the key did nothing. There is
    # a test.
    { on = ["alt+a"], run = "mark.clear" },
    { on = ["*"], run = "mark.invert" },
    # #313: the three gaps in Total Commander's Gray family, which norte did
    # not have. `alt+plus`/`alt+-` are the chords TC attests for selecting
    # by EXTENSION; files/dirs and restore are the uppercase of their
    # initial, because TC's (`Shift+Gray+`, `NUM/`) cannot be written in
    # this grammar or already mean something else here.
    { on = ["alt+plus"], run = "mark.extension-add" },
    { on = ["alt+-"], run = "mark.extension-remove" },
    # Lowercase: `alt+f` was free, and an uppercase letter under Alt asks
    # for Shift without saying so. The other four (`alt+C/A/D/R`) keep Shift
    # because their lowercase is taken, and the label now says so
    # (`Alt+Shift+C`).
    { on = ["alt+f"], run = "mark.files" },
    { on = ["alt+D"], run = "mark.dirs" },
    { on = ["alt+R"], run = "mark.restore" },
    { on = ["plus"], run = "mark.pattern-add" },
    { on = ["-"], run = "mark.pattern-remove" },
    # Marking WHILE MOVING: the other half of the family. `space`/`insert`
    # mark while GOING DOWN and there was nothing for going up nor for a
    # range. The six go here —the house preset— and the four imported ones
    # take them from here, which is the rule the arrows and PgUp/PgDn
    # already follow: their sources do not itemise the pane cursor's
    # movement.
    { on = ["shift+down"], run = "mark.toggle" },
    { on = ["shift+up"], run = "mark.toggle-up" },
    { on = ["shift+pgdn"], run = "mark.toggle-page-down" },
    { on = ["shift+pgup"], run = "mark.toggle-page-up" },
    { on = ["shift+home"], run = "mark.to-top" },
    { on = ["shift+end"], run = "mark.to-bottom" },
    { on = ["ctrl+t"], run = "pane.tab-new" },
    { on = ["ctrl+w"], run = "pane.tab-close" },
    { on = ["alt+n"], run = "pane.tab-next" },
    { on = ["alt+p"], run = "pane.tab-prev" },
    # Checksums (#311). Krusader has them in its File menu and none of the
    # four imported managers gives them a chord, so the key is CHOSEN:
    # `alt+k` computes and `alt+K` verifies — free in all seven, and the
    # uppercase letter for the variant, as with `alt+o`/`alt+O` in the pane
    # ring.
    { on = ["alt+k"], run = "pane.checksum" },
    { on = ["alt+K"], run = "pane.checksum-verify" },
    { on = ["alt+h"], run = "layout.split-h" },
    { on = ["alt+v"], run = "layout.split-v" },
]

[viewer]
keymap = [
    { on = ["q"], run = "viewer.close" },
    { on = ["esc"], run = "viewer.close" },
    { on = ["f3"], run = "viewer.close" },
    { on = ["f10"], run = "viewer.close" },
    { on = ["up"], run = "viewer.up" },
    { on = ["down"], run = "viewer.down" },
    { on = ["pgup"], run = "viewer.page-up" },
    { on = ["pgdn"], run = "viewer.page-down" },
    { on = ["home"], run = "viewer.top" },
    { on = ["end"], run = "viewer.bottom" },
    { on = ["left"], run = "viewer.left" },
    { on = ["right"], run = "viewer.right" },
    { on = ["e"], run = "viewer.encoding" },
    { on = ["E"], run = "viewer.encoding-auto" },
    { on = ["x"], run = "viewer.hex" },
    # An image's zoom. Function keys because they are what the viewer's
    # status bar NAMES: a zoom that shows nowhere is a zoom nobody finds. No
    # reference manager attests these three, so the choice is ours and is
    # the same across all seven presets.
    { on = ["f5"], run = "viewer.zoom-out" },
    { on = ["f6"], run = "viewer.zoom-in" },
    { on = ["f7"], run = "viewer.zoom-fit" },
    # The listing's siblings, for the same reason as zoom: function keys
    # because they are what the viewer's status bar NAMES. They are the same
    # across all seven.
    #
    # Deliberate DIVERGENCE: `f9` is `app.menu` in global, so inside the
    # viewer the menu stops opening with that key and opens with `alt+m`,
    # which already opens it in all seven. This is accepted because the menu
    # belongs to the APPLICATION and the viewer is a screen of its own —its
    # keys are its own while it lasts—, while flipping to the next photo is
    # exactly what one wants to do there.
    { on = ["f8"], run = "viewer.prev" },
    { on = ["f9"], run = "viewer.next" },
]

[dialog]
keymap = [
    { on = ["enter"], run = "dialog.confirm" },
    { on = ["y"], run = "dialog.approve" },
    { on = ["n"], run = "dialog.deny" },
    { on = ["esc"], run = "dialog.cancel" },
    { on = ["o"], run = "dialog.overwrite" },
    { on = ["s"], run = "dialog.skip" },
    { on = ["r"], run = "dialog.rename" },
    { on = ["w"], run = "dialog.newer" },
    { on = ["up"], run = "dialog.up" },
    { on = ["down"], run = "dialog.down" },
    { on = ["pgup"], run = "dialog.page-up" },
    { on = ["pgdn"], run = "dialog.page-down" },
    { on = ["home"], run = "dialog.top" },
    { on = ["end"], run = "dialog.bottom" },
    { on = ["["], run = "dialog.section-prev" },
    { on = ["]"], run = "dialog.section-next" },
    { on = ["a"], run = "dialog.add" },
    { on = ["e"], run = "dialog.toggle-enabled" },
    { on = ["space"], run = "dialog.toggle-enabled" },
    { on = ["d"], run = "dialog.remove" },
    { on = ["shift+up"], run = "dialog.move-up" },
    { on = ["shift+down"], run = "dialog.move-down" },
    { on = ["K"], run = "dialog.move-up" },
    { on = ["J"], run = "dialog.move-down" },
    { on = ["ctrl+s"], run = "dialog.sort" },
    { on = ["f"], run = "dialog.cycle-format" },
    { on = ["tab"], run = "dialog.pane" },
    { on = ["backspace"], run = "dialog.back" },
    { on = ["/"], run = "dialog.filter" },
    # The history lists (spec 2026-09-15 D2), with the keys from Far's list
    # —the only source that itemises them— where a terminal delivers them:
    # `Del` removes and `Shift+Del` clears. Opening in the OTHER pane is
    # `Ctrl+Shift+Enter` in Far, and no terminal tells it apart from Enter:
    # `alt+enter` does arrive.
    { on = ["delete"], run = "dialog.remove" },
    { on = ["shift+delete"], run = "dialog.clear" },
    { on = ["alt+enter"], run = "dialog.confirm-other" },
]
