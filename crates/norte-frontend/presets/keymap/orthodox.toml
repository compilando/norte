# Preset orthodox (mc clásico) — el default del producto (decisión 2026-07-10).
# Tab entre panes es sagrado (spec §12). F5/F6/F7/F8 llegan con la fase 5.

[global]
keymap = [
    { on = ["q"], run = "app.quit" },
    { on = ["f10"], run = "app.quit" },
    { on = ["ctrl+c"], run = "app.quit" },
    { on = ["tab"], run = "pane.switch" },
    { on = ["f1"], run = "app.help" },
    { on = ["f9"], run = "app.theme" },
    { on = ["f11"], run = "app.settings" },
    { on = ["f12"], run = "app.extensions" },
    { on = ["ctrl+p"], run = "app.palette" },
    { on = ["alt+m"], run = "app.menu" },
    { on = ["alt+b"], run = "layout.places" },
    { on = ["alt+q"], run = "layout.preview" },
]

[pane]
keymap = [
    { on = ["up"], run = "cursor.up" },
    { on = ["down"], run = "cursor.down" },
    { on = ["pgup"], run = "cursor.page-up" },
    { on = ["pgdn"], run = "cursor.page-down" },
    { on = ["home"], run = "cursor.top" },
    { on = ["end"], run = "cursor.bottom" },
    { on = ["enter"], run = "nav.enter" },
    { on = ["backspace"], run = "nav.parent" },
    { on = ["alt+left"], run = "nav.back" },
    { on = ["alt+right"], run = "nav.forward" },
    { on = ["alt+i"], run = "pane.mirror" },
    { on = ["alt+u"], run = "pane.pull" },
    { on = ["ctrl+u"], run = "pane.swap" },
    { on = ["f5"], run = "pane.copy" },
    { on = ["f6"], run = "pane.move" },
    { on = ["f7"], run = "pane.mkdir" },
    { on = ["shift+f6"], run = "pane.rename" },
    { on = ["f8"], run = "pane.delete" },
    { on = ["shift+f8"], run = "pane.delete-permanent" },
    { on = ["ctrl+k"], run = "task.cancel" },
    { on = ["f3"], run = "pane.view" },
    # F4 EDITA (#133), que es lo que hace en los cuatro managers que este
    # preset recoge y lo que un lector espera de la tecla. Abrir con el
    # programa del sistema —lo que hacía F4 antes— se queda en `alt+f4`: sigue
    # a una tecla de distancia y ya no ocupa la que todo el mundo usa para
    # editar.
    { on = ["f4"], run = "pane.edit" },
    { on = ["shift+f4"], run = "pane.edit-new" },
    { on = ["alt+f4"], run = "pane.open" },
    # #138: el orden por tecla, con los chords de Far/TC (Ctrl+F3..F6). El menú
    # de orden es el diálogo de columnas, que ya tiene el suyo en `alt+c`.
    { on = ["ctrl+f3"], run = "pane.sort-name" },
    { on = ["ctrl+f4"], run = "pane.sort-ext" },
    { on = ["ctrl+f5"], run = "pane.sort-time" },
    { on = ["ctrl+f6"], run = "pane.sort-size" },
    # #139: propiedades y recuento, con los chords de TC/Krusader.
    { on = ["alt+enter"], run = "pane.properties" },
    { on = ["ctrl+l"], run = "pane.dir-size" },
    # #136: el árbol de directorios. Far usa Ctrl+T; aquí `alt+t`, porque
    # Ctrl+T en este preset ya es una pestaña nueva.
    { on = ["alt+t"], run = "pane.tree" },
    # #140: abrir una conexión guardada y cerrarla. Ctrl+N es el de TC y
    # Krusader; el cierre no tiene chord común entre managers, así que va con
    # el mismo modificador que el resto de esta familia.
    { on = ["ctrl+n"], run = "pane.connect" },
    { on = ["alt+n"], run = "pane.disconnect" },
    { on = ["/"], run = "pane.quick-search" },
    { on = ["alt+down"], run = "pane.history" },
    { on = ["alt+f7"], run = "pane.search" },
    # Total Commander's key for it, adopted as the product default: mc's own
    # "Compare directories" lives in a pull-down menu with no chord to copy.
    { on = ["shift+f2"], run = "pane.compare-dirs" },
    # Krusader's "Synchronize Folders" chord, adopted as the product default
    # for the sync half — it is the only reference manager that gives the
    # feature a chord at all. Deliberately NOT a modified function key: under
    # tmux none of them reaches the app (#159), and this repo has already
    # shipped one documented dead shortcut.
    { on = ["ctrl+y"], run = "pane.sync-dirs" },
    { on = ["alt+e"], run = "pane.names-encoding" },
    { on = ["ctrl+r"], run = "pane.refresh" },
    { on = ["ctrl+h"], run = "pane.toggle-hidden" },
    { on = ["alt+."], run = "pane.toggle-hidden" },
    { on = ["alt+c"], run = "pane.columns" },
    { on = ["ctrl+d"], run = "pane.hotlist" },
    { on = ["insert"], run = "mark.toggle" },
    { on = ["space"], run = "mark.toggle" },
    { on = ["ctrl+a"], run = "mark.all" },
    # `alt+a` y no `ctrl+A`: la mayúscula ES el shift en la gramática de
    # acordes, pero un terminal manda el MISMO byte para Ctrl+A y Ctrl+Shift+A,
    # así que el binding existía y la tecla no hacía nada. Hay test.
    { on = ["alt+a"], run = "mark.clear" },
    { on = ["*"], run = "mark.invert" },
    { on = ["plus"], run = "mark.pattern-add" },
    { on = ["-"], run = "mark.pattern-remove" },
    { on = ["ctrl+t"], run = "pane.tab-new" },
    { on = ["ctrl+w"], run = "pane.tab-close" },
    { on = ["alt+n"], run = "pane.tab-next" },
    { on = ["alt+p"], run = "pane.tab-prev" },
    { on = ["alt+h"], run = "layout.split-h" },
    { on = ["alt+v"], run = "layout.split-v" },
]

[viewer]
keymap = [
    { on = ["q"], run = "viewer.close" },
    { on = ["esc"], run = "viewer.close" },
    { on = ["f3"], run = "viewer.close" },
    { on = ["f10"], run = "viewer.close" },
    { on = ["up"], run = "viewer.up" },
    { on = ["down"], run = "viewer.down" },
    { on = ["pgup"], run = "viewer.page-up" },
    { on = ["pgdn"], run = "viewer.page-down" },
    { on = ["home"], run = "viewer.top" },
    { on = ["end"], run = "viewer.bottom" },
    { on = ["e"], run = "viewer.encoding" },
    { on = ["E"], run = "viewer.encoding-auto" },
    { on = ["x"], run = "viewer.hex" },
]

[dialog]
keymap = [
    { on = ["enter"], run = "dialog.confirm" },
    { on = ["y"], run = "dialog.approve" },
    { on = ["n"], run = "dialog.deny" },
    { on = ["esc"], run = "dialog.cancel" },
    { on = ["o"], run = "dialog.overwrite" },
    { on = ["s"], run = "dialog.skip" },
    { on = ["r"], run = "dialog.rename" },
    { on = ["w"], run = "dialog.newer" },
    { on = ["up"], run = "dialog.up" },
    { on = ["down"], run = "dialog.down" },
    { on = ["pgup"], run = "dialog.page-up" },
    { on = ["pgdn"], run = "dialog.page-down" },
    { on = ["a"], run = "dialog.add" },
    { on = ["e"], run = "dialog.toggle-enabled" },
    { on = ["space"], run = "dialog.toggle-enabled" },
    { on = ["d"], run = "dialog.remove" },
    { on = ["shift+up"], run = "dialog.move-up" },
    { on = ["shift+down"], run = "dialog.move-down" },
    { on = ["K"], run = "dialog.move-up" },
    { on = ["J"], run = "dialog.move-down" },
    { on = ["ctrl+s"], run = "dialog.sort" },
    { on = ["f"], run = "dialog.cycle-format" },
    { on = ["tab"], run = "dialog.pane" },
    { on = ["backspace"], run = "dialog.back" },
    { on = ["/"], run = "dialog.filter" },
]
