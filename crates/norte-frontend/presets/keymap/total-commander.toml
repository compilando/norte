# Total Commander 11.58 — transcribed 2026-08-09 from tc-11.58-KEYBOARD.TXT
# (the installer's own KEYBOARD.TXT).
#
# Divergences from the original: panel cursor movement (arrows, PgUp/PgDn,
# Home/End) is not itemized in the source — it is the Windows default and the
# file only documents what TC adds on top of it — so it is bound the same way
# orthodox binds it. TC's own Lister (F3) has no documented key list either
# (this file is the *outer* program's shortcuts); its close/movement keys
# mirror the same minimal convention. No bare letter is ever bound: TC
# redirects an unbound letter straight to the command line (see the source's
# own "Letter -> Redirected to command line" line), so binding one here would
# steal a keystroke TC gives to something else.
#
# `pane.mirror` is deliberately UNBOUND here (#228). The attested family in
# that neighbourhood sends the OTHER panel to the directory of the entry under
# the cursor — the direction already bound at Ctrl+I as `pane.pull` — and
# nothing in the source sends the other panel to THIS panel's path, which is
# what mirror means. Krusader's Alt+Shift+O ("Sync panels", the Equals Button)
# is that command and is bound in its own preset; borrowing it into this one
# would put a Krusader chord in a Total Commander transcription.
#
# F9 ("Activate left/right menu" in the source) IS bound, to `app.menu`, since
# norte grew a menu bar (spec 2026-09-10); the source's left/right distinction
# has no counterpart — one menu bar, one key.
#
# Omitted families (norte has no concept): the rest of the menu bar keys (F10
# non-Alt+F4, Shift+F10); button bars and breadcrumb bars (Alt+F11/F12, Alt+Shift+F11/12);
# window minimize (Shift+Esc); clipboard file/text ops (Ctrl+C/X/V, and the
# same inside the command line); the alternate/Lister viewer variants
# (Alt+F3, Alt+Shift+F3, Alt+Shift+F7 "find in separate process"); in-place
# copy/rename and shortcut-creation variants (Shift+F5, Shift+Ctrl+F5,
# Shift+F7); panel view-mode switches (Ctrl+F1/F2/F7/F10/F11/F12,
# Ctrl+Shift+F1/F2/F8, "Unsorted"); the directory-tree popup dialog
# (Alt+F10, a second presentation of the same tree Ctrl+F8 already opens);
# command-line history and in-line editing (Alt+F8, and the whole
# "Command Line: Keys" section — history, cut/copy/paste, word-delete);
# file comments (Ctrl+Z); directory-branch flattening (Ctrl+B,
# Ctrl+Shift+B); the open-tabs list menu (Ctrl+Shift+A); the Multi-Rename
# Tool (Ctrl+M, a batch feature with no single-file analogue); FTP
# transfer-mode and new-connection dialogs (Ctrl+Shift+M, Ctrl+N — Ctrl+F
# already covers connect); printing (Ctrl+F9); extension-based and
# files-vs-folders selection nuances (Alt+NUM+/-, Shift+NUM+/-/*,
# Ctrl+Shift+NUM+/-, NUM/ "restore selection"); jumping to the filesystem
# root (Ctrl+< / Ctrl+\, no such concept exists); target-window navigation
# (Ctrl+Left/Right); per-letter quicksearch (AltGr+Letter / Ctrl+Alt+Letter
# — not one chord, cannot be expressed).
#
# `layout.flip` (ADR 0138) is unbound in all seven presets on purpose: the
# transcribed KEYBOARD.TXT itemises no such action, and it lives on the
# `[/]` layout button, the Panels menu and the palette.

# `pane.compare-files` (#312) se queda SIN ATAR aquí. Total Commander tiene la
# función («Compare files by content»), pero `tc-11.58-KEYBOARD.TXT` —la fuente
# de este fichero— no le da acorde, y este preset solo transcribe lo que la
# fuente dice. Ver la nota equivalente en `krusader.toml`; los tres presets
# nativos lo llevan en `alt+C`.

# La historia (spec 2026-09-15): Alt+←/→ y Alt+↓ vienen de la fuente.
# `Alt+Shift+↓` —la misma lista sin quitar los directorios «de paso»— NO se
# ata: norte no quita ninguno, así que sería la misma lista con otra tecla. El
# punto de salto, los populares y la historia de un lado no tienen tecla en la
# fuente: están en el menú Ir y en la paleta.
#
# `app.goto` («ir a cualquier sitio», fase 6) se queda con ellas. Total
# Commander tiene piezas sueltas de lo que esa pantalla junta —`ctrl+d` para
# los favoritos, la historia en su propio desplegable— pero ninguna tecla
# que las junte, y atar `ctrl+g` a algo que la fuente no dice es lo que este
# fichero no hace. `ctrl+g` está libre en los siete presets y lo llevan
# orthodox, cua y vim; aquí, el menú Ir (F9), donde está el primero.

dialog_from = "orthodox"

[global]
keymap = [
    { on = ["tab"], run = "pane.switch" },
    { on = ["f1"], run = "app.help" },
    { on = ["alt+f4"], run = "app.quit" },
    # Las superficies PROPIAS de norte, que este gestor no tenía y por
    # tanto no hay nada que transcribir: ajustes, extensiones y paleta.
    # Sin ellas la configuración no se alcanza desde el teclado, que es
    # lo que pasaba hasta ahora en este preset. F11/F12 están libres
    # aquí y son lo que usan orthodox/vim/cua; para la paleta, ctrl+P (la P mayúscula ES el shift: la gramática
    # de acordes no combina shift con un carácter)
    # (Ctrl+P es `pane.copy-path` en Total Commander).
    { on = ["f11"], run = "app.settings" },
    { on = ["f12"], run = "app.extensions" },
    # El tema, en `alt+9`, el mismo que los otros tres presets importados.
    # Ver la nota larga en krusader.toml.
    { on = ["alt+9"], run = "app.theme" },
    # F9 = menu bar, attested ("Activate left/right menu"); see the header.
    { on = ["f9"], run = "app.menu" },
    # `alt+p` y no `ctrl+P`: la mayúscula es el shift en la gramática y NO en
    # el cable — mismo byte que `ctrl+p`, que aquí es `pane.copy-path`. Ver la
    # nota larga en krusader.toml. Hay test.
    { on = ["alt+p"], run = "app.palette" },
    { on = ["alt+m"], run = "app.menu" },
    { on = ["alt+b"], run = "layout.places" },
    { on = ["alt+q"], run = "layout.preview" },
    # El anillo de paneles y el panel de procesos. Ver la nota larga en
    # orthodox.toml: son superficies propias de norte y no hay nada que
    # transcribir de Total Commander sobre ellas.
    { on = ["alt+o"], run = "layout.focus-next" },
    { on = ["alt+O"], run = "layout.focus-prev" },
    { on = ["alt+j"], run = "layout.processes" },
    # El registro (#323): no lo atestigua TC, se ata igual porque es de norte
    # y `alt+l` está libre. Ver el bloque de divergencias de la cabecera.
    { on = ["alt+l"], run = "layout.log" },
    # El mapa de disco (fase 4). Total Commander no atestigua acorde para esto
    # —su equivalente más cercano es un diálogo, no un panel—, así que no se
    # transcribe: `alt+z`, la única letra libre en los siete. Ver orthodox.toml.
    { on = ["alt+z"], run = "layout.disk-map" },
    # El resto de la familia `layout.*`, con los mismos acordes que en los
    # otros seis presets: ver la nota larga en `orthodox.toml`.
    { on = ["alt+x"], run = "layout.close-slot" },
    { on = ["alt+["], run = "layout.shrink" },
    { on = ["alt+]"], run = "layout.grow" },
    { on = ["alt+="], run = "layout.equalize" },
    { on = ["alt+g"], run = "layout.set-target" },
]

[pane]
keymap = [
    { on = ["up"], run = "cursor.up" },
    { on = ["down"], run = "cursor.down" },
    { on = ["pgup"], run = "cursor.page-up" },
    { on = ["pgdn"], run = "cursor.page-down" },
    { on = ["home"], run = "cursor.top" },
    { on = ["end"], run = "cursor.bottom" },
    { on = ["enter"], run = "nav.enter" },
    { on = ["ctrl+pgdn"], run = "nav.enter" },
    { on = ["backspace"], run = "nav.parent" },
    { on = ["ctrl+pgup"], run = "nav.parent" },
    { on = ["alt+left"], run = "nav.back" },
    { on = ["alt+right"], run = "nav.forward" },
    { on = ["ctrl+i"], run = "pane.pull" },
    { on = ["f3"], run = "pane.view" },
    { on = ["f4"], run = "pane.edit" },
    { on = ["f5"], run = "pane.copy" },
    { on = ["f6"], run = "pane.move" },
    { on = ["f7"], run = "pane.mkdir" },
    { on = ["shift+f6"], run = "pane.rename" },
    # `Ctrl+M` es el Multi-Rename Tool de la fuente, que hasta ahora estaba en
    # la lista de omisiones de arriba por no haber a qué atarlo: norte no tenía
    # renombrado en lote por plantilla. Ahora sí (#310), así que la tecla
    # atestiguada vuelve a su comando.
    { on = ["ctrl+m"], run = "pane.rename-batch" },
    { on = ["f8"], run = "pane.delete" },
    { on = ["shift+f8"], run = "pane.delete-permanent" },
    { on = ["f2"], run = "pane.refresh" },
    { on = ["ctrl+r"], run = "pane.refresh" },
    { on = ["alt+f1"], run = "pane.select-drive-left" },
    { on = ["alt+f2"], run = "pane.select-drive-right" },
    { on = ["alt+f7"], run = "pane.search" },
    { on = ["alt+f5"], run = "pane.pack" },
    { on = ["alt+f6"], run = "pane.unpack" },
    { on = ["alt+shift+f9"], run = "pane.test-archive" },
    { on = ["ctrl+f8"], run = "pane.tree" },
    { on = ["alt+enter"], run = "pane.properties" },
    { on = ["ctrl+u"], run = "pane.swap" },
    { on = ["ctrl+l"], run = "pane.dir-size" },
    { on = ["ctrl+d"], run = "pane.hotlist" },
    { on = ["ctrl+f"], run = "pane.connect" },
    # `alt+f`: `ctrl+F` no llega (mismo byte que `ctrl+f`, que es `pane.connect`).
    { on = ["alt+f"], run = "pane.disconnect" },
    { on = ["ctrl+p"], run = "pane.copy-path" },
    { on = ["ctrl+s"], run = "pane.quick-search" },
    { on = ["ctrl+t"], run = "pane.tab-new" },
    { on = ["ctrl+w"], run = "pane.tab-close" },
    { on = ["ctrl+tab"], run = "pane.tab-next" },
    { on = ["ctrl+shift+tab"], run = "pane.tab-prev" },
    { on = ["shift+f1"], run = "pane.columns" },
    { on = ["shift+f2"], run = "pane.compare-dirs" },
    { on = ["ctrl+y"], run = "pane.sync-dirs" },
    { on = ["shift+f4"], run = "pane.edit-new" },
    { on = ["alt+down"], run = "pane.history" },
    { on = ["ctrl+f3"], run = "pane.sort-name" },
    { on = ["ctrl+f4"], run = "pane.sort-ext" },
    { on = ["ctrl+f5"], run = "pane.sort-time" },
    { on = ["ctrl+f6"], run = "pane.sort-size" },
    { on = ["insert"], run = "mark.toggle" },
    { on = ["space"], run = "mark.toggle" },
    { on = ["ctrl+a"], run = "mark.all" },
    { on = ["ctrl+-"], run = "mark.clear" },
    { on = ["plus"], run = "mark.pattern-add" },
    { on = ["-"], run = "mark.pattern-remove" },
    # Marcar MOVIÉNDOSE. `Shift`+flechas y `Shift`+página no están en
    # KEYBOARD.TXT —la fuente documenta lo que TC AÑADE sobre el
    # comportamiento de la lista de Windows, y esto es de la lista— así que se
    # atan como los ata orthodox, la misma divergencia ya anotada arriba para
    # las flechas, PgUp/PgDn e Inicio/Fin.
    { on = ["shift+down"], run = "mark.toggle" },
    { on = ["shift+up"], run = "mark.toggle-up" },
    { on = ["shift+pgdn"], run = "mark.toggle-page-down" },
    { on = ["shift+pgup"], run = "mark.toggle-page-up" },
    { on = ["shift+home"], run = "mark.to-top" },
    { on = ["shift+end"], run = "mark.to-bottom" },
    { on = ["*"], run = "mark.invert" },
    # #313: `Alt+NUM+`/`Alt+NUM-` de la fuente —la selección por EXTENSIÓN—,
    # que estaban en la lista de omisiones de arriba por no haber comando al
    # que atarlas. Ahora lo hay. `NUM/` («restore selection») es `/`: el
    # teclado numérico no se distingue en esta gramática, y `/` está libre en
    # este preset porque TC manda una letra suelta a la línea de comandos y no
    # a un quick search.
    { on = ["alt+plus"], run = "mark.extension-add" },
    { on = ["alt+-"], run = "mark.extension-remove" },
    { on = ["/"], run = "mark.restore" },
    # Las sumas (#311). Krusader las tiene en su menú File y ninguno de los
    # cuatro importados les da acorde, así que la tecla se ELIGE: `alt+k`
    # calcula y `alt+K` comprueba — libre en los siete, y la mayúscula
    # para la variante, como `alt+o`/`alt+O` en el anillo de paneles.
    { on = ["alt+k"], run = "pane.checksum" },
    { on = ["alt+K"], run = "pane.checksum-verify" },
    { on = ["alt+h"], run = "layout.split-h" },
    { on = ["alt+v"], run = "layout.split-v" },
]

[viewer]
keymap = [
    { on = ["esc"], run = "viewer.close" },
    { on = ["f3"], run = "viewer.close" },
    { on = ["up"], run = "viewer.up" },
    { on = ["down"], run = "viewer.down" },
    { on = ["pgup"], run = "viewer.page-up" },
    { on = ["pgdn"], run = "viewer.page-down" },
    { on = ["home"], run = "viewer.top" },
    { on = ["end"], run = "viewer.bottom" },
    { on = ["left"], run = "viewer.left" },
    { on = ["right"], run = "viewer.right" },
    # Superficie propia de norte: Total Commander no atesta un zoom en su
    # visor, así que estas tres son elección nuestra y van igual en los
    # siete presets (ver `orthodox.toml`).
    { on = ["f5"], run = "viewer.zoom-out" },
    { on = ["f6"], run = "viewer.zoom-in" },
    { on = ["f7"], run = "viewer.zoom-fit" },
]
