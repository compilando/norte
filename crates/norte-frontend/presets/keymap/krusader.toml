# Krusader — transcribed 2026-08-09 from krusader-keys.txt
# (docs.kde.org key_bindings.html rendered to text).
#
# Divergences from the original: panel cursor movement (arrows, PgUp/PgDn)
# is not itemized in the source beyond Home/End ("Other keys" table), which
# ARE documented explicitly — arrows/PgUp/PgDn follow the same default and
# are bound like orthodox's. Krusader's own viewer (KrViewer, opened by F3)
# is explicitly named but not detailed on this page ("Other Key-bindings ->
# KrViewer"); its close/movement keys mirror the same minimal convention as
# Total Commander's — including the HORIZONTAL pair (`left`/`right` ->
# viewer.left/right, added 2026-09-09): the source does not itemize them for
# KrViewer any more than it itemizes the vertical ones, and a viewer that does
# not wrap needs both axes or the right-hand half of a long line is nowhere.
# Same reasoning, same omission block, as the panel cursor keys above.
# No bare letter is ever bound: the source's own "Other
# keys" table reserves an unmodified letter for quicksearch/quickselect/
# quickfilter ("foo -> Quick search, quick select or quick filter"), so
# binding one here would shadow that.
#
# F9 stays `app.terminal`, as the source attests ("F9 -> Terminal"): the
# other six presets bind F9 to the menu (spec 2026-09-10), but a Krusader
# reader has F9 in the fingers as the terminal, and the menu keeps `alt+m`.
#
# Omitted families (norte has no concept): Alt+F1..F12 and Ctrl+F1..F12 /
# Ctrl+Shift+F1..F12 are explicitly "Standard (Plasma) key-bindings" per the
# source itself, not Krusader's — never Krusader's to bind (drive selection
# does have a key here, and it is Krusader's own: the per-side media list at
# Ctrl+Shift+Left/Right, bound below; MountMan, a different feature, stays
# omitted); the menu/context
# menu (Esc-loses-menu-focus, Menu key); view-mode switches (Alt+Shift+B/D
# "Brief/Detailed View", Shift+F10/F12); What's-this help (Shift+F1); the
# Multi-Rename tool (Shift+F2, Krename — a batch feature, see TC's Ctrl+M);
# viewing an entered URL (Shift+F3); queued copy/move (Shift+F5/F6); root-mode
# relaunch (Alt+Shift+K); panel profiles (Alt+Shift+L); the Queue Manager
# (Alt+Shift+Q); MountMan itself, the mount manager (Alt+/, Ctrl+M) — its
# per-side media LIST is bound below, at Ctrl+Shift+Left/Right, because norte
# grew that picker in #131; the User Menu (Alt+`); jumping to $HOME (Alt+Home); the
# Sidebar (Alt+Down); privileged edit-as-root (Ctrl+E, both listings);
# the QuickFilter/Quickselect bars, distinct from the Ctrl+F quicksearch bar
# already bound (Ctrl+I, Ctrl+Shift+S); setting the jump-back point
# (Ctrl+Shift+J — a ctrl+<UPPERCASE> no terminal delivers apart from Ctrl+J,
# so `nav.set-jump-point` lives in the Go menu and the palette); the Location
# Toolbar/address bar (Ctrl+L, a breadcrumb-bar concept); a folder-open
# file-picker dialog (Ctrl+O); an ambiguous "move to the lower part of the folder" distinct
# from End (Ctrl+PgDn); jumping to the filesystem root (Ctrl+Backspace); the
# media mount/unmount menu (Ctrl+Return); moving a tab to the other panel or
# reordering it, distinct from switching to it (Ctrl+Shift+O, Ctrl+Shift+
# PgUp/PgDn); swap-with-all-tabs, a variant of the plain swap already bound
# (Ctrl+Shift+U); an external "Locate" GUI launcher (Ctrl+Shift+L);
# disconnecting the embedded terminal from focus, a nuance of the Terminal
# already bound at F9 (Ctrl+Shift+Up/Down, Ctrl+Alt+E); mounting and
# symlink creation (Ctrl+Alt+M, Ctrl+Alt+S); panel layout/orientation and
# equal-sizing (Ctrl+Alt+R, Ctrl+Alt+=); duplicating or tab-scoped opening
# variants of the tab-new already bound (Ctrl+Alt+Shift+N, Ctrl+Alt+Enter);
# in-cmdline text insertion and its history list (Ctrl+/, Ctrl+Enter,
# Ctrl+Shift+Enter, the Up/Down-arrow "Command Line" and "Terminal emulator"
# tables); the Synchronizer tool's own screen, which norte does not model as
# a distinct context (Ctrl+W-inside-Synchronizer "reverse direction", Alt+
# Down/Up/Left/Right/Delete there); clipboard ops (Ctrl+Alt+C, Shift+Ins);
# external-app integration and per-file backup useractions (Meta+A, Meta+F5);
# the Meta+1..4 default sort useractions, which cannot be expressed — norte's
# chord grammar has no Super/Meta modifier token (only ctrl/alt/shift/cmd/
# mod), so `pane.sort-*` has no key at all in this preset; and the Plasma
# global "bring window to top" (Meta+K).
#
# `layout.flip` (ADR 0138) is unbound in all seven presets on purpose: the
# source does not attest it, and it lives on the `[/]` layout button, the
# Panels menu and the palette.

# `pane.compare-files` (#312) is left UNBOUND here, and in the other three
# imported presets, by the same rule that already leaves out
# `pane.compare-dirs` in `far.toml` and `norton.toml`: Krusader has the
# feature —"Compare by Content", in its File menu— and the source this file
# was transcribed from does not attribute a chord to it. Inventing one for a
# transcription is worse than a reference sheet that prints `—`, which at
# least tells the truth. The three native presets do carry it, on `alt+C`.
#
# `app.goto` ("go anywhere", phase 6) is NOT bound here. It is a screen of
# norte's own: it brings history, favourites, bookmarks, connections,
# commands and a typed path together into one list, and Krusader has
# nothing equivalent to copy a shortcut from. `ctrl+g` is free in all seven
# presets and is the one orthodox, cua and vim carry; inventing it here
# would be exactly what this file exists not to do. It is first in the Go
# menu (F9), which is preset-independent, so it is not a missing
# capability: it is a shortcut not attributed to a source that does not
# state it.
#
# `task.pause` (ADR 0147), `task.retry` (ADR 0148) and the three queue ones
# (`task.queue`, `task.up`, `task.down`, ADR 0149) are left UNBOUND here,
# just like `task.cancel`:
# Krusader pauses from its JobMan (the toolbar button), not from a key its
# documentation names. Both are reached from the palette.

dialog_from = "orthodox"

[global]
keymap = [
    { on = ["tab"], run = "pane.switch" },
    { on = ["f1"], run = "app.help" },
    { on = ["f9"], run = "app.terminal" },
    { on = ["f10"], run = "app.quit" },
    { on = ["ctrl+q"], run = "app.quit" },
    # Surfaces of norte's OWN, which this manager did not have and so there
    # is nothing to transcribe: settings, extensions and the palette.
    # Without them, configuration cannot be reached from the keyboard,
    # which is what happened in this preset until now. F11/F12 are free
    # here and are what orthodox/vim/cua use; for the palette, `alt+p`.
    #
    # It used to be `ctrl+P`, on the reasoning that the uppercase letter IS
    # the shift. It is, in the chord grammar, and NOT on the wire: a
    # terminal sends the same byte (0x10) for Ctrl+P and for Ctrl+Shift+P,
    # and telling them apart requires Kitty's keyboard protocol, which norte
    # does not enable. So the palette was unreachable from the keyboard in
    # this preset, and whoever looked for it found the split-file dialog
    # instead — lowercase `ctrl+p`, which is indeed `pane.split-file` in
    # Krusader. There is a test.
    { on = ["f11"], run = "app.settings" },
    { on = ["f12"], run = "app.extensions" },
    # The theme. `alt+9` and not `f9` because F9 here opens a terminal, which
    # is what F9 does in Krusader; in FAR and in Norton it is the program's
    # menu. The three native presets have it on F9, so the 9 echoes them
    # without stealing a key that already means something from anyone. It
    # was UNBOUND in the four imported presets —the only one of norte's own
    # surfaces left out— and there is a test.
    { on = ["alt+9"], run = "app.theme" },
    { on = ["alt+p"], run = "app.palette" },
    { on = ["alt+m"], run = "app.menu" },
    { on = ["alt+b"], run = "layout.places" },
    { on = ["alt+q"], run = "layout.preview" },
    # The pane ring and the process panel. See the long note in
    # orthodox.toml: these are surfaces of norte's own and there is nothing
    # to transcribe from Krusader about them.
    #
    # `layout.focus-prev` is left UNBOUND here, and only here: its key in
    # the other six is `alt+O`, which in Krusader is "Sync panels" (the
    # Equals Button) and is bound to `pane.mirror`. A `[global]` with that
    # chord would end up shadowed inside the listings and active outside
    # them, which is worse than not being there: the same key would do two
    # things depending on where the keyboard focus was. The ring wraps
    # around, so forward still reaches the same place.
    { on = ["alt+o"], run = "layout.focus-next" },
    { on = ["alt+j"], run = "layout.processes" },
    # The log (#323): Krusader does NOT attest it —it has no panel like
    # this—, it is bound anyway because it is norte's own and `alt+l` is
    # free. See the header's divergences block.
    { on = ["alt+l"], run = "layout.log" },
    # The disk map (phase 4). Krusader attests NO chord for this —it has no
    # panel like this—, so nothing is transcribed: `alt+z` is bound, the one
    # letter free across all seven presets. See orthodox.toml.
    { on = ["alt+z"], run = "layout.disk-map" },
    # The terminal panel (#362). **Krusader DOES have this panel** —it is
    # the docked terminal emulator, and a good part of why norte adds it—,
    # so here its chord should be transcribed rather than invented.
    #
    # It is not transcribed, and the reason is written down instead of left
    # silent: the chord Krusader attests could not be checked against its
    # documentation from where this change was made, and transcribing from
    # memory is exactly how a chord the reference manager never had sneaks
    # in. norte's common chord (`ctrl+alt+s`, see orthodox.toml) goes here,
    # and it is noted: if Krusader's documentation says another one, this
    # binding changes and the change is one line.
    { on = ["ctrl+alt+s"], run = "layout.terminal" },
    # The rest of the `layout.*` family, with the same chords as in the
    # other six presets: see the long note in `orthodox.toml`. Krusader has
    # its own for panel layout (`Ctrl+Alt+R` orientation, `Ctrl+Alt+=`
    # equalize), but it is among what was knowingly omitted for belonging to
    # its window and not to an orthodox manager, and a family that changes
    # key depending on the preset is exactly what these five exist to
    # avoid.
    { on = ["alt+x"], run = "layout.close-slot" },
    { on = ["alt+["], run = "layout.shrink" },
    { on = ["alt+]"], run = "layout.grow" },
    { on = ["alt+="], run = "layout.equalize" },
    { on = ["alt+g"], run = "layout.set-target" },
]

[pane]
keymap = [
    # Krusader HAS this ("Synchron Browse"), but as a toolbar button: its
    # documentation assigns it no chord, so there is nothing to transcribe
    # here and ours is used, the same in all seven (see `orthodox`).
    { on = ["ctrl+e"], run = "pane.sync-nav" },
    { on = ["up"], run = "cursor.up" },
    { on = ["down"], run = "cursor.down" },
    { on = ["pgup"], run = "cursor.page-up" },
    { on = ["pgdn"], run = "cursor.page-down" },
    { on = ["home"], run = "cursor.top" },
    { on = ["end"], run = "cursor.bottom" },
    { on = ["enter"], run = "nav.enter" },
    { on = ["backspace"], run = "nav.parent" },
    { on = ["ctrl+pgup"], run = "nav.parent" },
    { on = ["ctrl+="], run = "pane.pull" },
    { on = ["f2"], run = "pane.rename" },
    # `Shift+F2` is Krename, the source's batch rename. It was among the
    # omissions ("the Multi-Rename tool (Shift+F2, Krename…)") because norte
    # had nothing to bind it to; with #310 it does, and the attested key
    # comes back.
    { on = ["shift+f2"], run = "pane.rename-batch" },
    { on = ["f3"], run = "pane.view" },
    { on = ["f4"], run = "pane.edit" },
    { on = ["f5"], run = "pane.copy" },
    { on = ["f6"], run = "pane.move" },
    { on = ["f7"], run = "pane.mkdir" },
    { on = ["f8"], run = "pane.delete" },
    { on = ["delete"], run = "pane.delete" },
    { on = ["ctrl+delete"], run = "pane.delete-permanent" },
    { on = ["ctrl+r"], run = "pane.refresh" },
    { on = ["ctrl+s"], run = "pane.search" },
    { on = ["ctrl+f"], run = "pane.quick-search" },
    # History (spec 2026-09-15), transcribed from Krusader's CODE
    # (`listpanelactions.cpp`, `kractions.cpp`) and not from the
    # docs.kde.org table. That table says Alt+←/→ open each panel's
    # bookmarks, and this header used to copy that: in the code those two
    # actions have no key, and Alt+←/→ are `KStandardAction::Back/Forward`.
    # Ctrl+Alt+←/→ are the left/right pane's history, Ctrl+J goes back to the
    # jump point and Ctrl+Z opens the "Popular URLs".
    { on = ["alt+left"], run = "nav.back" },
    { on = ["alt+right"], run = "nav.forward" },
    { on = ["ctrl+alt+left"], run = "pane.history-left" },
    { on = ["ctrl+alt+right"], run = "pane.history-right" },
    { on = ["ctrl+j"], run = "nav.jump-back" },
    { on = ["ctrl+z"], run = "pane.popular" },
    { on = ["ctrl+h"], run = "pane.history" },
    { on = ["ctrl+d"], run = "pane.hotlist" },
    # `alt+d`: `ctrl+D` does not arrive (same byte as `ctrl+d`, which is the hotlist).
    { on = ["alt+d"], run = "pane.disconnect" },
    { on = ["ctrl+n"], run = "pane.connect" },
    { on = ["ctrl+p"], run = "pane.split-file" },
    { on = ["ctrl+u"], run = "pane.swap" },
    { on = ["ctrl+w"], run = "pane.tab-close" },
    { on = ["ctrl+alt+n"], run = "pane.tab-new" },
    { on = ["shift+left"], run = "pane.tab-prev" },
    { on = ["shift+right"], run = "pane.tab-next" },
    { on = ["alt+."], run = "pane.toggle-hidden" },
    { on = ["alt+enter"], run = "pane.properties" },
    { on = ["alt+C"], run = "pane.compare-dirs" },
    { on = ["alt+E"], run = "pane.test-archive" },
    # Alt+Shift+O is "Sync panels aka “Equals Button (=)”" — the toolbar
    # button that sends the OTHER panel to this one's path (mirror), a
    # DIFFERENT feature from the Synchronizer tool bound at Ctrl+Y below
    # ("Synchronize Folders"). Mapping both to pane.sync-dirs would say
    # the Equals Button opens a folder-tree diff, which it does not.
    { on = ["alt+O"], run = "pane.mirror" },
    # Ctrl+Left/Right: "on a folder: refreshes the [other] panel with the
    # contents of the folder; on a file: the [other] panel gets the same path".
    # BOTH arrows run the same verb because norte's gesture names the OTHER
    # pane, never a side — the source's own row covers the two together, and
    # from the left panel the only pane that can receive is the right one.
    #
    # This was omitted at transcription time ("adopting the other panel's
    # cursor target") because norte had no command for it: `pane.mirror` sends
    # this LOCATION and knows nothing about the cursor. Now it has one, and
    # `pane.mirror` keeps its meaning for the four presets that bind it.
    { on = ["ctrl+left"], run = "pane.mirror-target" },
    { on = ["ctrl+right"], run = "pane.mirror-target" },
    # Ctrl+Shift+Left/Right: "Open left/right media list". Omitted at
    # transcription time as part of MountMan, reasoning that Linux has no drive
    # letters — but the media list is not MountMan, it is the per-side volume
    # picker, and norte grew exactly that in #131 (the same command the other
    # three imported presets bind at Alt+F1/F2).
    { on = ["ctrl+shift+left"], run = "pane.select-drive-left" },
    { on = ["ctrl+shift+right"], run = "pane.select-drive-right" },
    { on = ["ctrl+y"], run = "pane.sync-dirs" },
    { on = ["alt+P"], run = "pane.pack" },
    { on = ["alt+S"], run = "pane.dir-size" },
    { on = ["alt+U"], run = "pane.unpack" },
    { on = ["shift+f4"], run = "pane.edit-new" },
    { on = ["ctrl+down"], run = "pane.command-line" },
    { on = ["insert"], run = "mark.toggle" },
    { on = ["space"], run = "mark.toggle" },
    { on = ["ctrl+a"], run = "mark.all" },
    { on = ["alt+plus"], run = "mark.all" },
    { on = ["alt+-"], run = "mark.clear" },
    { on = ["alt+*"], run = "mark.invert" },
    { on = ["ctrl+plus"], run = "mark.pattern-add" },
    { on = ["ctrl+-"], run = "mark.pattern-remove" },
    # Marking WHILE MOVING. `Shift+Home`/`Shift+End` are literal from the
    # source ("Selecting", basic-functions): "selects everything above the
    # cursor (and deselects everything below the cursor, if selected)" and
    # its mirror — hence why `mark.to-top`/`mark.to-bottom` clear the other
    # side instead of only adding a range. `Shift`+arrows and `Shift`+page
    # are NOT itemised in the source, same as the pane cursor's movement
    # (see the header's divergences): they are bound the way orthodox binds
    # them, the same rule already applied to the arrows and to PgUp/PgDn.
    { on = ["shift+down"], run = "mark.toggle" },
    { on = ["shift+up"], run = "mark.toggle-up" },
    { on = ["shift+pgdn"], run = "mark.toggle-page-down" },
    { on = ["shift+pgup"], run = "mark.toggle-page-up" },
    { on = ["shift+home"], run = "mark.to-top" },
    { on = ["shift+end"], run = "mark.to-bottom" },
    # Checksums (#311). Krusader has them in its File menu and none of the
    # four imported managers gives them a chord, so the key is CHOSEN:
    # `alt+k` computes and `alt+K` verifies — free in all seven, and the
    # uppercase letter for the variant, as with `alt+o`/`alt+O` in the pane
    # ring.
    { on = ["alt+k"], run = "pane.checksum" },
    { on = ["alt+K"], run = "pane.checksum-verify" },
    { on = ["alt+h"], run = "layout.split-h" },
    { on = ["alt+v"], run = "layout.split-v" },
]

[viewer]
keymap = [
    { on = ["esc"], run = "viewer.close" },
    { on = ["f3"], run = "viewer.close" },
    { on = ["up"], run = "viewer.up" },
    { on = ["down"], run = "viewer.down" },
    { on = ["pgup"], run = "viewer.page-up" },
    { on = ["pgdn"], run = "viewer.page-down" },
    { on = ["home"], run = "viewer.top" },
    { on = ["end"], run = "viewer.bottom" },
    { on = ["left"], run = "viewer.left" },
    { on = ["right"], run = "viewer.right" },
    # A surface of norte's own: Krusader attests no zoom in its viewer, so
    # these three are our own choice and are the same across all seven
    # presets (see `orthodox.toml`).
    { on = ["f5"], run = "viewer.zoom-out" },
    { on = ["f6"], run = "viewer.zoom-in" },
    { on = ["f7"], run = "viewer.zoom-fit" },
    { on = ["f8"], run = "viewer.prev" },
    { on = ["f9"], run = "viewer.next" },
]
