# Norton Commander — transcribed 2026-08-09. No first-hand source: NC.HLP is
# internally compressed and no plaintext extraction of it exists, so unlike
# the other three presets there is no `far-*.txt`-style document to check a
# binding against. This file transcribes only the uncontroversial core: the
# F-key row, panel swap/refresh, drive change, Ctrl+PgUp/PgDn navigation, and
# Insert/Gray selection are common knowledge — TC and Krusader are widely
# known as NC's successors, and the same F5/F6/F7/F8/Ctrl+U bindings recur
# unchanged in `total-commander.toml`/`krusader.toml`, both transcribed from
# real sources — but neither source document actually names Norton
# Commander, so that recurrence is corroborating, not first-hand attestation.
# If you know a binding here is wrong, or one is missing that belongs, open
# an issue rather than silently changing it — nobody has checked this preset
# against a running copy of NC.
#
# Divergences from the original: panel cursor movement (arrows, PgUp/PgDn,
# Home/End, Enter) follows the same well-known convention TC and Krusader
# themselves bind it by, for the same reason — it predates any of the three
# programs' own written documentation. The viewer's HORIZONTAL pair
# (`left`/`right` -> viewer.left/right, added 2026-09-09) is in the same
# class and worse attested: NC's own viewer did have horizontal scrolling on
# the arrows, but with no plaintext NC.HLP nothing here can attest it. It is
# bound because a viewer that does not wrap needs both axes; treat it as
# convention, not transcription. No bare letter is ever bound, matching
# the other three presets' convention (NC's own quicksearch-by-typing is the
# feature that makes it necessary here too).
#
# `pane.compare-dirs` is deliberately UNBOUND here, for this file's own
# stated rule: NC's "Compare directories" was a Commands-menu entry and no
# first-hand source survives to say whether it had a chord. Borrowing
# Shift+F2 from Total Commander would be a guess dressed as a transcription.
# `pane.sync-dirs` is unbound for the same rule, with nothing to weigh: NC
# had no directory synchroniser, so there is not even a menu entry to hang a
# guess on.
#
# Three more core commands are unbound here ON PURPOSE, and #228 is why they
# are written down rather than left to be rediscovered as a gap:
# `pane.rename`, because NC's F6 ("RenMov") renames and moves with ONE key and
# that key is bound — to `pane.move`, whose dialog carries an editable
# destination name, which is how an NC user renames; and `pane.mirror` and
# `pane.pull`, which are norte's own panel gestures and which no source, first
# or second hand, attributes to NC. The reference sheet prints `—` for each,
# so what the reader is told is the truth.
#
# Omitted families (norte has no concept): the pull-down menu bar (F9) and
# the user menu (F2); Ctrl+Q and Ctrl+L — no first-hand description survives
# to say what either did in NC, so both are left unbound rather than guessed
# at; jumping to the filesystem root (Ctrl+\\, matching TC/Krusader's own
# omission); secure wipe (NC predates the feature — DOS had no equivalent to
# Far's Alt+Del); select-all/deselect-all and pattern-scoped selection
# variants beyond the plain Gray +/-/* already bound (undocumented at this
# level of certainty).
#
# `layout.flip` (ADR 0138) is unbound in all seven presets on purpose: NC
# has no such action, and it lives on the `[/]` layout button, the Panels
# menu and the palette.

# `pane.compare-files` (#312) is left UNBOUND here, by the same rule that
# leaves out `pane.compare-dirs`: this preset's source does not attribute a
# chord to it, and a preset whose goal is fidelity does not invent one. The
# three native presets carry it on `alt+C`.

# History (spec 2026-09-15): NOTHING bound, neither back/forward nor the
# list. There is no primary source for this preset, and what is said about a
# directory history in NC/Volkov is not attested by any; binding a key on
# rumour is worse than the reference sheet's `—`. Everything still lives in
# the Go menu and the palette.
#
# And the same goes for `app.goto` ("go anywhere", phase 6), for the same
# reason and with more cause: it is a screen of norte's own that brings
# together history, favourites, bookmarks, connections, commands and a typed
# path, and the 1986 Norton Commander had nowhere to put something like
# that. `ctrl+g` is free in all seven and orthodox, cua and vim carry it;
# here it is reached through the Go menu (F9), where it is first.
#
# `task.pause` (ADR 0147), `task.retry` (ADR 0148) and the three queue ones
# (`task.queue`, `task.up`, `task.down`, ADR 0149) are left UNBOUND here,
# just like `task.cancel`:
# Norton Commander has no background operations: there is no key to
# transcribe. Both are reached from the palette.

dialog_from = "orthodox"

[global]
keymap = [
    { on = ["tab"], run = "pane.switch" },
    { on = ["f1"], run = "app.help" },
    { on = ["f10"], run = "app.quit" },
    { on = ["ctrl+o"], run = "app.toggle-panels" },
    # Surfaces of norte's OWN, which this manager did not have and so there
    # is nothing to transcribe: settings, extensions and the palette.
    # Without them, configuration cannot be reached from the keyboard,
    # which is what happened in this preset until now. F11/F12 are free
    # here and are what orthodox/vim/cua use; for the palette, ctrl+p
    # (free in Norton).
    { on = ["f11"], run = "app.settings" },
    { on = ["f12"], run = "app.extensions" },
    # The theme, on `alt+9`. F9 is the pull-down menu in Norton Commander,
    # and since spec 2026-09-10 it is here too; `alt+m` stays as the shared
    # chord all seven presets carry. See the long note in krusader.toml.
    { on = ["alt+9"], run = "app.theme" },
    { on = ["ctrl+p"], run = "app.palette" },
    { on = ["f9"], run = "app.menu" },
    { on = ["alt+m"], run = "app.menu" },
    { on = ["alt+b"], run = "layout.places" },
    { on = ["alt+q"], run = "layout.preview" },
    # The pane ring and the process panel. See the long note in
    # orthodox.toml: these are surfaces of norte's own and there is nothing
    # to transcribe from NC about them —neither first-hand nor second-hand—.
    { on = ["alt+o"], run = "layout.focus-next" },
    { on = ["alt+O"], run = "layout.focus-prev" },
    { on = ["alt+j"], run = "layout.processes" },
    # The log (#323): NC does not attest it, it is bound anyway because it
    # is norte's own and `alt+l` is free. See the header's divergences block.
    { on = ["alt+l"], run = "layout.log" },
    # The disk map (phase 4). Norton Commander has no panel like this: there
    # is nothing to transcribe, and `alt+z` is the one letter free across
    # all seven presets. See orthodox.toml.
    { on = ["alt+z"], run = "layout.disk-map" },
    # The terminal panel (#362). Norton Commander had no panel like this:
    # its thing was clearing the panels and leaving DOS underneath
    # (`ctrl+o`), which in norte is `app.toggle-panels`. This is not a
    # transcription, and norte's common chord goes here. See orthodox.toml.
    { on = ["ctrl+alt+s"], run = "layout.terminal" },
    # The rest of the `layout.*` family, with the same chords as in the
    # other six presets: see the long note in `orthodox.toml`.
    { on = ["alt+x"], run = "layout.close-slot" },
    { on = ["alt+["], run = "layout.shrink" },
    { on = ["alt+]"], run = "layout.grow" },
    { on = ["alt+="], run = "layout.equalize" },
    { on = ["alt+g"], run = "layout.set-target" },
]

[pane]
keymap = [
    # Norton Commander has no synchronized navigation: there is no chord to
    # transcribe and ours goes here, the same in all seven (see `orthodox`).
    { on = ["ctrl+e"], run = "pane.sync-nav" },
    { on = ["up"], run = "cursor.up" },
    { on = ["down"], run = "cursor.down" },
    { on = ["pgup"], run = "cursor.page-up" },
    { on = ["pgdn"], run = "cursor.page-down" },
    { on = ["home"], run = "cursor.top" },
    { on = ["end"], run = "cursor.bottom" },
    { on = ["enter"], run = "nav.enter" },
    { on = ["ctrl+pgdn"], run = "nav.enter" },
    { on = ["ctrl+pgup"], run = "nav.parent" },
    { on = ["f3"], run = "pane.view" },
    { on = ["f4"], run = "pane.edit" },
    { on = ["f5"], run = "pane.copy" },
    { on = ["f6"], run = "pane.move" },
    { on = ["f7"], run = "pane.mkdir" },
    { on = ["f8"], run = "pane.delete" },
    { on = ["alt+f1"], run = "pane.select-drive-left" },
    { on = ["alt+f2"], run = "pane.select-drive-right" },
    # Alt+F7 ("Find file") enters by the SAME corroboration rule this header
    # already uses for F5/F6/F7/F8 and Ctrl+U: there is no first-hand source
    # for NC, but the chord recurs unchanged in the two presets that WERE
    # transcribed from a source —`far.toml` and `total-commander.toml`—, and
    # both programs are documented as NC's successors. Without this, search
    # had no key in the one preset where nothing similar has one either
    # (#228).
    { on = ["alt+f7"], run = "pane.search" },
    { on = ["ctrl+u"], run = "pane.swap" },
    { on = ["ctrl+r"], run = "pane.refresh" },
    { on = ["insert"], run = "mark.toggle" },
    { on = ["plus"], run = "mark.pattern-add" },
    { on = ["-"], run = "mark.pattern-remove" },
    # Marking WHILE MOVING. The original Norton Commander does not have it
    # —it predates the extended-selection list— but it does not itemise the
    # pane cursor's movement either, which this preset already takes from
    # orthodox by the same rule. Leaving it unbound here, and only here,
    # would be a preset missing six commands for no better reason than its
    # date.
    { on = ["shift+down"], run = "mark.toggle" },
    { on = ["shift+up"], run = "mark.toggle-up" },
    { on = ["shift+pgdn"], run = "mark.toggle-page-down" },
    { on = ["shift+pgup"], run = "mark.toggle-page-up" },
    { on = ["shift+home"], run = "mark.to-top" },
    { on = ["shift+end"], run = "mark.to-bottom" },
    { on = ["*"], run = "mark.invert" },
    { on = ["ctrl+t"], run = "pane.tab-new" },
    { on = ["ctrl+w"], run = "pane.tab-close" },
    { on = ["alt+n"], run = "pane.tab-next" },
    { on = ["alt+p"], run = "pane.tab-prev" },
    # Checksums (#311). Krusader has them in its File menu and none of the
    # four imported managers gives them a chord, so the key is CHOSEN:
    # `alt+k` computes and `alt+K` verifies — free in all seven, and the
    # uppercase letter for the variant, as with `alt+o`/`alt+O` in the pane
    # ring.
    { on = ["alt+k"], run = "pane.checksum" },
    { on = ["alt+K"], run = "pane.checksum-verify" },
    { on = ["alt+h"], run = "layout.split-h" },
    { on = ["alt+v"], run = "layout.split-v" },
]

[viewer]
keymap = [
    { on = ["esc"], run = "viewer.close" },
    { on = ["f3"], run = "viewer.close" },
    { on = ["up"], run = "viewer.up" },
    { on = ["down"], run = "viewer.down" },
    { on = ["pgup"], run = "viewer.page-up" },
    { on = ["pgdn"], run = "viewer.page-down" },
    { on = ["home"], run = "viewer.top" },
    { on = ["end"], run = "viewer.bottom" },
    { on = ["left"], run = "viewer.left" },
    { on = ["right"], run = "viewer.right" },
    # A surface of norte's own: Norton Commander attests no zoom in its
    # viewer —it did not even have images—, so these three are our own
    # choice and are the same across all seven presets (see
    # `orthodox.toml`).
    { on = ["f5"], run = "viewer.zoom-out" },
    { on = ["f6"], run = "viewer.zoom-in" },
    { on = ["f7"], run = "viewer.zoom-fit" },
    { on = ["f8"], run = "viewer.prev" },
    { on = ["f9"], run = "viewer.next" },
]
