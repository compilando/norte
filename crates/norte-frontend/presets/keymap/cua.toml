# CUA preset (arrows + desktop conventions).
#
# Decision #23: Ctrl+C stays as QUIT (universal emergency), NOT as copy.
# norte's `pane.copy` is "copy to the other pane" (the orthodox two-pane
# model), not a copy-to-clipboard: binding it to Ctrl+C would surprise and,
# above all, would DIVERGE from the hardcoded Ctrl-C that aborts cd /
# refresh_panes (those transient loops do not consult the keymap). Copy stays
# on F5. Ctrl+Q and F10 also quit.
#
# `layout.flip` (ADR 0138) deliberately ships with no key, as in all seven: it
# lives on the `[/]` button of the layout bar, the Panes menu and the palette.

[global]
keymap = [
    { on = ["f10"], run = "app.quit" },
    { on = ["ctrl+q"], run = "app.quit" },
    { on = ["ctrl+c"], run = "app.quit" },
    { on = ["tab"], run = "pane.switch" },
    { on = ["f1"], run = "app.help" },
    # F9 opens the MENU (spec 2026-09-10), as in orthodox; the theme, on alt+9.
    { on = ["f9"], run = "app.menu" },
    { on = ["alt+9"], run = "app.theme" },
    { on = ["f11"], run = "app.settings" },
    { on = ["f12"], run = "app.extensions" },
    { on = ["ctrl+p"], run = "app.palette" },
    # `ctrl+g` is "go to" in nearly every CUA editor (goto line); here the
    # place it goes to is a directory, a connection or a command.
    { on = ["ctrl+g"], run = "app.goto" },
    { on = ["alt+m"], run = "app.menu" },
    { on = ["alt+b"], run = "layout.places" },
    { on = ["alt+q"], run = "layout.preview" },
    # The pane ring and the process panel. See the long note in
    # orthodox.toml: these are surfaces of norte's own and no reference
    # manager has anything to say about them.
    { on = ["alt+o"], run = "layout.focus-next" },
    { on = ["alt+O"], run = "layout.focus-prev" },
    { on = ["alt+j"], run = "layout.processes" },
    # The log (#323). `alt+l` for "log", free in all seven presets.
    { on = ["alt+l"], run = "layout.log" },
    # The disk map (phase 4), `alt+z`: the one letter free in all seven.
    # See the note in orthodox.toml.
    { on = ["alt+z"], run = "layout.disk-map" },
    # The terminal panel (#362), with norte's common chord. See
    # orthodox.toml for why `ctrl+alt+s` and not `ctrl+alt+t`.
    { on = ["ctrl+alt+s"], run = "layout.terminal" },
    # The rest of the `layout.*` family, with the same chords as in the
    # other six presets: see the long note in `orthodox.toml`.
    { on = ["alt+x"], run = "layout.close-slot" },
    { on = ["alt+["], run = "layout.shrink" },
    { on = ["alt+]"], run = "layout.grow" },
    { on = ["alt+="], run = "layout.equalize" },
    { on = ["alt+g"], run = "layout.set-target" },
]

[pane]
keymap = [
    # See `orthodox`'s header: this chord is ours and is the same in all seven.
    { on = ["ctrl+e"], run = "pane.sync-nav" },
    { on = ["up"], run = "cursor.up" },
    { on = ["down"], run = "cursor.down" },
    { on = ["pgup"], run = "cursor.page-up" },
    { on = ["pgdn"], run = "cursor.page-down" },
    { on = ["home"], run = "cursor.top" },
    { on = ["end"], run = "cursor.bottom" },
    { on = ["enter"], run = "nav.enter" },
    { on = ["backspace"], run = "nav.parent" },
    { on = ["alt+left"], run = "nav.back" },
    { on = ["alt+right"], run = "nav.forward" },
    # The desktop convention for history is only back/forward (and the
    # mouse's side buttons, which the window handles on its own). The jump
    # point, the favourites and one side's history have no desktop key: they
    # go through the Go menu and the palette.
    { on = ["alt+i"], run = "pane.mirror" },
    { on = ["alt+u"], run = "pane.pull" },
    { on = ["ctrl+u"], run = "pane.swap" },
    { on = ["f5"], run = "pane.copy" },
    { on = ["f6"], run = "pane.move" },
    { on = ["f7"], run = "pane.mkdir" },
    { on = ["shift+f6"], run = "pane.rename" },
    # Template batch rename (#310). No attested key here —TC puts it on
    # `ctrl+m` and Krusader on `shift+f2`, and both presets carry it—, so
    # one is chosen: `alt+r` for "rename", free in all seven.
    { on = ["alt+r"], run = "pane.rename-batch" },
    { on = ["f8"], run = "pane.delete" },
    { on = ["shift+f8"], run = "pane.delete-permanent" },
    { on = ["ctrl+k"], run = "task.cancel" },
    { on = ["ctrl+alt+k"], run = "task.pause" },
    { on = ["ctrl+alt+r"], run = "task.retry" },
    { on = ["ctrl+alt+q"], run = "task.queue" },
    { on = ["ctrl+alt+up"], run = "task.up" },
    { on = ["ctrl+alt+down"], run = "task.down" },
    { on = ["f3"], run = "pane.view" },
    { on = ["f4"], run = "pane.open" },
    { on = ["/"], run = "pane.quick-search" },
    { on = ["alt+down"], run = "pane.history" },
    { on = ["alt+f7"], run = "pane.search" },
    { on = ["shift+f2"], run = "pane.compare-dirs" },
    # #312: comparing TWO FILES, which is a different question than
    # comparing two trees. `alt+C` because `alt+c` is already the columns
    # dialog and the uppercase letter is the variant, as with the checksums.
    # NOT a function key with a modifier, for the same reason as `ctrl+y`:
    # they do not arrive under tmux (#159).
    { on = ["alt+C"], run = "pane.compare-files" },
    { on = ["ctrl+y"], run = "pane.sync-dirs" },
    { on = ["alt+e"], run = "pane.names-encoding" },
    { on = ["ctrl+r"], run = "pane.refresh" },
    { on = ["ctrl+h"], run = "pane.toggle-hidden" },
    { on = ["alt+."], run = "pane.toggle-hidden" },
    { on = ["alt+c"], run = "pane.columns" },
    { on = ["ctrl+d"], run = "pane.hotlist" },
    { on = ["insert"], run = "mark.toggle" },
    { on = ["space"], run = "mark.toggle" },
    { on = ["ctrl+a"], run = "mark.all" },
    # #314: change POSIX permissions. `alt+A` because `ctrl+a` is mark-all
    # in this preset and the uppercase letter is left for the variant, as
    # with the checksums; FAR does have an attested chord and there it is
    # its own.
    { on = ["alt+A"], run = "pane.chmod" },
    # `alt+a`: `ctrl+A` does not arrive (same byte as `ctrl+a`). See orthodox.
    { on = ["alt+a"], run = "mark.clear" },
    { on = ["*"], run = "mark.invert" },
    # #313: the three gaps in Total Commander's Gray family, which norte did
    # not have. `alt+plus`/`alt+-` are the chords TC attests for selecting
    # by EXTENSION; files/dirs and restore are the uppercase of their
    # initial, because TC's (`Shift+Gray+`, `NUM/`) cannot be written in
    # this grammar or already mean something else here.
    { on = ["alt+plus"], run = "mark.extension-add" },
    { on = ["alt+-"], run = "mark.extension-remove" },
    # Lowercase: `alt+f` was free (see the note in orthodox.toml).
    { on = ["alt+f"], run = "mark.files" },
    { on = ["alt+D"], run = "mark.dirs" },
    { on = ["alt+R"], run = "mark.restore" },
    { on = ["plus"], run = "mark.pattern-add" },
    { on = ["-"], run = "mark.pattern-remove" },
    # Marking WHILE MOVING. In a CUA environment this is the NATIVE
    # behaviour: `Shift`+arrows extends the selection in any desktop list,
    # so here it is not an import from an orthodox manager but what the
    # reader already expects.
    { on = ["shift+down"], run = "mark.toggle" },
    { on = ["shift+up"], run = "mark.toggle-up" },
    { on = ["shift+pgdn"], run = "mark.toggle-page-down" },
    { on = ["shift+pgup"], run = "mark.toggle-page-up" },
    { on = ["shift+home"], run = "mark.to-top" },
    { on = ["shift+end"], run = "mark.to-bottom" },
    { on = ["ctrl+t"], run = "pane.tab-new" },
    { on = ["ctrl+w"], run = "pane.tab-close" },
    { on = ["alt+n"], run = "pane.tab-next" },
    { on = ["alt+p"], run = "pane.tab-prev" },
    # Checksums (#311). Krusader has them in its File menu and none of the
    # four imported managers gives them a chord, so the key is CHOSEN:
    # `alt+k` computes and `alt+K` verifies — free in all seven, and the
    # uppercase letter for the variant, as with `alt+o`/`alt+O` in the pane
    # ring.
    { on = ["alt+k"], run = "pane.checksum" },
    { on = ["alt+K"], run = "pane.checksum-verify" },
    { on = ["alt+h"], run = "layout.split-h" },
    { on = ["alt+v"], run = "layout.split-v" },
]

[viewer]
keymap = [
    { on = ["q"], run = "viewer.close" },
    { on = ["esc"], run = "viewer.close" },
    { on = ["f3"], run = "viewer.close" },
    { on = ["f10"], run = "viewer.close" },
    { on = ["up"], run = "viewer.up" },
    { on = ["down"], run = "viewer.down" },
    { on = ["pgup"], run = "viewer.page-up" },
    { on = ["pgdn"], run = "viewer.page-down" },
    { on = ["home"], run = "viewer.top" },
    { on = ["end"], run = "viewer.bottom" },
    { on = ["left"], run = "viewer.left" },
    { on = ["right"], run = "viewer.right" },
    { on = ["e"], run = "viewer.encoding" },
    { on = ["E"], run = "viewer.encoding-auto" },
    { on = ["x"], run = "viewer.hex" },
    # A surface of our own: same three keys in all seven presets (see
    # `orthodox.toml`).
    { on = ["f5"], run = "viewer.zoom-out" },
    { on = ["f6"], run = "viewer.zoom-in" },
    { on = ["f7"], run = "viewer.zoom-fit" },
    { on = ["f8"], run = "viewer.prev" },
    { on = ["f9"], run = "viewer.next" },
]

[dialog]
keymap = [
    { on = ["enter"], run = "dialog.confirm" },
    { on = ["y"], run = "dialog.approve" },
    { on = ["n"], run = "dialog.deny" },
    { on = ["esc"], run = "dialog.cancel" },
    { on = ["o"], run = "dialog.overwrite" },
    { on = ["s"], run = "dialog.skip" },
    { on = ["r"], run = "dialog.rename" },
    { on = ["w"], run = "dialog.newer" },
    { on = ["up"], run = "dialog.up" },
    { on = ["down"], run = "dialog.down" },
    { on = ["pgup"], run = "dialog.page-up" },
    { on = ["pgdn"], run = "dialog.page-down" },
    { on = ["home"], run = "dialog.top" },
    { on = ["end"], run = "dialog.bottom" },
    { on = ["["], run = "dialog.section-prev" },
    { on = ["]"], run = "dialog.section-next" },
    { on = ["a"], run = "dialog.add" },
    { on = ["e"], run = "dialog.toggle-enabled" },
    { on = ["space"], run = "dialog.toggle-enabled" },
    { on = ["d"], run = "dialog.remove" },
    { on = ["shift+up"], run = "dialog.move-up" },
    { on = ["shift+down"], run = "dialog.move-down" },
    { on = ["K"], run = "dialog.move-up" },
    { on = ["J"], run = "dialog.move-down" },
    { on = ["ctrl+s"], run = "dialog.sort" },
    { on = ["f"], run = "dialog.cycle-format" },
    { on = ["tab"], run = "dialog.pane" },
    { on = ["backspace"], run = "dialog.back" },
    { on = ["/"], run = "dialog.filter" },
    # The history lists (spec 2026-09-15 D2): the same as orthodox, which
    # explains where they come from. `Delete` and `Shift+Delete` are also
    # what a desktop expects for removing.
    { on = ["delete"], run = "dialog.remove" },
    { on = ["shift+delete"], run = "dialog.clear" },
    { on = ["alt+enter"], run = "dialog.confirm-other" },
]
