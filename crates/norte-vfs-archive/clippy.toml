# ADR 0127: `spawn_blocking` doesn't inherit the span, and whatever parsers
# log inside the closure comes out without its `task`. The door is
# `crate::blocking::spawn_blocking`, which preserves it.
#
# Clippy does NOT merge configs: it uses the first clippy.toml it finds
# walking up from the crate. If one ever exists at the root, its rules have
# to be copied here and into crates/norte-core/clippy.toml, or they don't apply.
disallowed-methods = [
    { path = "tokio::task::spawn_blocking", reason = "loses the span; use crate::blocking::spawn_blocking (ADR 0127)" },
    { path = "tokio::runtime::Handle::spawn_blocking", reason = "loses the span; use crate::blocking::spawn_blocking (ADR 0127)" },
]
