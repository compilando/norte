[package]
name = "norte-vfs-archive"
description = "Provider VFS read-only: zip/tar como directorios virtuales (ADR 0018)"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
# Parsers SYNC de formato (regla 2: corren en spawn_blocking sobre un
# adaptador Read+Seek que puentea al Provider interior con block_on).
tar.workspace = true
zip.workspace = true
# tar.gz/tgz (#55, ADR 0028): `MultiGzDecoder` sobre el `ProviderReader` para
# el índice secuencial de `tar+gz` (gz no es seekable). Backend zlib-rs
# (calca el que ya activa `zip`/deflate — sin duplicar backends de compresión).
flate2.workspace = true
# `rt`: Handle::current().block_on en los hilos blocking del índice/lectura.
# `sync`: canal acotado que puentea la descompresión zip → ByteStream (el
# drop del receptor corta el hilo: cancelación de la regla 3).
tokio = { workspace = true, features = ["rt", "sync"] }
# warn! de entradas hostiles omitidas (ADR 0018 C2: omitir CON señal).
tracing.workspace = true

[dev-dependencies]
norte-testkit.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
