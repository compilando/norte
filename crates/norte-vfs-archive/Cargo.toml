[package]
name = "norte-vfs-archive"
description = "Read-only VFS provider: zip/tar as virtual directories (ADR 0018)"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
# SYNC format parsers (rule 2: they run in spawn_blocking over a Read+Seek
# adapter that bridges to the inner Provider with block_on). zip's central
# directory is parsed by our own `zip_cd` module (#59): the `zip` crate was
# left out (lossy collapse H1 / 0x7075 substitution H3).
tar.workspace = true
# flate2 (zlib-rs backend, no C): deflate for zip entries (#59, with
# crc32fast's `Crc` re-exported to verify complete reads) and tar.gz's
# sequential index's `MultiGzDecoder` (#55, ADR 0028).
flate2.workspace = true
# `rt`: Handle::current().block_on in the index/read blocking threads.
# `sync`: bounded channel bridging zip decompression → ByteStream (the
# receiver's drop cuts the thread: rule 3's cancellation).
tokio = { workspace = true, features = ["rt", "sync"] }
# ANONYMOUS file (already unlinked, no pathname) for hot tar.gz's
# decompressed spool (#95.1); already centralized in the workspace.
tempfile.workspace = true
# Typed errors for the writer (#132), hard rule 6: a library uses
# `thiserror`, never `anyhow`.
thiserror.workspace = true
# warn! for omitted hostile entries (ADR 0018 C2: omit WITH a signal).
tracing.workspace = true

[dev-dependencies]
norte-testkit.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
# A real subscriber so spans have an id: `blocking::spawn_blocking`'s test
# compares the outer span against the inner one (ADR 0127). Already in the
# workspace; the core uses it the same way.
tracing-subscriber.workspace = true

[lints]
workspace = true
