[package]
name = "norte-ai"
description = "Model provider abstraction (AiProvider): streaming chat, embeddings and capabilities — Anthropic, Ollama and OpenAI-compatible (ADR 0031)"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Shared test utilities (FakeEmbed). Only other crates' dev-deps.
testutil = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "time"] }
bytes.workspace = true
async-trait.workspace = true
bitflags = { workspace = true }
# HTTP client (ADR 0031, rule 8): reqwest already lives in the tree
# transitively via opendal with the SAME rustls/aws-lc-rs stack; here it
# becomes a direct dep (the providers' SSE/NDJSON streaming).
# default-features=false: only json+stream+rustls — no cookies, no system
# proxies, no gzip.
reqwest = { workspace = true }
# The zeroizing Secret is INJECTED from the core (spec §9: credentials never
# live in config nor are read by this crate; env→keyring→age resolution
# lives in norte-connect, which is already AGPL like this crate).
norte-connect.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
