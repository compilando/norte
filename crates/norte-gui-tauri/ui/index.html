<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>norte</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="screen" role="application" aria-label="norte"></main>
    <!-- The menu bar goes AFTER the screen, and it isn't aesthetic: there is
         no `z-index` anywhere here, so among positioned elements document
         order wins. Declared before it, its dropdown used to end up BELOW
         the panels — which are absolute and come later — and the menu
         opened invisible. The bar itself is `fixed` at the top and
         `#screen` steps aside with a margin, so the row stays reserved: the
         layout the host computes counts on it. Everything declared further
         down covers it, which is correct — a dialog or help outrank a
         menu. -->
    <!-- The panel bar (#324) goes BEFORE the menu by the same rule: the
         menu's dropdown has to paint above it. -->
    <div id="panelbar"></div>
    <div id="menu" data-open="false"></div>
    <div id="palette" data-open="false"></div>
    <div id="goto" data-open="false"></div>
    <div id="whichkey" data-open="false"></div>
    <div id="viewer" data-open="false"></div>
    <!-- An extension command's output goes RIGHT BELOW the dialogs, and the
         order matters twice: it paints with a full-screen veil and there's
         no `z-index` anywhere, so whoever comes later in the DOM covers
         whoever came before. Declared after `#dialogs` it used to cover a
         confirmation that still held the keyboard — and the plugin chooses
         the moment, since it decides when it answers its command. -->
    <div id="plugin-output" data-open="false"></div>
    <div id="program-output" data-open="false"></div>
    <!-- Help comes LAST on purpose: it opens over whatever was there —
         including over the viewer and a dialog — and document order is what
         decides who covers whom without inventing a `z-index`. With help
         before the viewer, `F1` in the viewer used to paint help under an
         opaque background. -->
    <div id="settings" data-open="false"></div>
    <!-- Agent sessions go BETWEEN settings and extensions, and it isn't
         aesthetic: the extensions manager keeps the keyboard ahead of this
         panel, and this one ahead of settings, so DOM order — which is
         paint order, because there is no `z-index` anywhere — has to say
         the same thing. Declared before `#settings`, settings used to cover
         a panel that still held the keys. -->
    <div id="agents" data-open="false"></div>
    <div id="extensions" data-open="false"></div>
    <div id="theme" data-open="false"></div>
    <div id="picker" data-open="false"></div>
    <div id="profiles" data-open="false"></div>
    <div id="layouts" data-open="false"></div>
    <div id="columns" data-open="false"></div>
    <div id="search" data-open="false"></div>
    <div id="compare" data-open="false"></div>
    <div id="sync" data-open="false"></div>
    <!-- A rename plan's review goes here, almost at the end: it keeps the
         keyboard above the selectors (columns, themes, settings,
         search…), and all of them paint an opaque full-screen background.
         Placed earlier, the review used to receive the keys while a
         selector covered it entirely — meaning a rename could be approved
         from a screen the approver couldn't see. Only help and dialogs go
         above it, and those DO hold on to the keys. -->
    <div id="ai-rename" data-open="false"></div>
    <div id="organize" data-open="false"></div>
    <!-- Dialogs go AFTER every selector and panel, and before only help: a
         dialog keeps the keyboard over whatever was there, so it has to
         paint above it. Declared before `#settings`, the prompt asking for
         a setting's value (bridge 60) used to open BELOW settings: you'd see
         the veil darken and no field — a dialog holding the keyboard that
         nobody could see. A plugin's output still comes before them, which
         is what that comment up there asks for. -->
    <div id="dialogs"></div>
    <div id="help" data-open="false"></div>
    <div id="splash" data-open="false"></div>
    <div id="fatal" role="alert"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
