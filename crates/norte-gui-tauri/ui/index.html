<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>norte</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="screen" role="application" aria-label="norte"></main>
    <div id="palette" data-open="false"></div>
    <div id="whichkey" data-open="false"></div>
    <div id="viewer" data-open="false"></div>
    <div id="dialogs"></div>
    <!-- La ayuda va la ÚLTIMA a propósito: se abre encima de lo que
         hubiera —también encima del visor y de un diálogo— y el orden del
         documento es lo que decide quién tapa a quién sin inventarse un
         `z-index`. Con la ayuda antes del visor, `F1` en el visor pintaba una
         ayuda debajo de un fondo opaco. -->
    <div id="settings" data-open="false"></div>
    <div id="extensions" data-open="false"></div>
    <div id="theme" data-open="false"></div>
    <div id="picker" data-open="false"></div>
    <div id="layouts" data-open="false"></div>
    <div id="columns" data-open="false"></div>
    <div id="search" data-open="false"></div>
    <div id="compare" data-open="false"></div>
    <!-- La revisión de un plan de renombrado va aquí, casi al final: se
         queda el teclado por encima de los selectores (columnas, temas,
         ajustes, búsqueda…), y todos ellos pintan un fondo opaco a pantalla
         completa. Colocada antes, la revisión recibía las teclas mientras un
         selector la tapaba del todo — o sea que se podía aprobar un
         renombrado desde una pantalla que el que aprueba no ve. Solo la
         ayuda y los diálogos van por encima, y esos SÍ se quedan las
         teclas. -->
    <div id="ai-rename" data-open="false"></div>
    <div id="help" data-open="false"></div>
    <div id="fatal" role="alert"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
