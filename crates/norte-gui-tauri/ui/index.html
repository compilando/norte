<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>norte</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="screen" role="application" aria-label="norte"></main>
    <!-- La barra de menús va DESPUÉS de la pantalla, y no es estética: aquí
         no hay `z-index` en ninguna parte, así que entre elementos
         posicionados manda el orden del documento. Declarada antes, su
         desplegable quedaba por DEBAJO de los paneles —que son absolutos y
         vienen después— y el menú se abría invisible. La barra en sí es
         `fixed` arriba y `#screen` se aparta con un margen, así que la fila
         sigue reservada: el reparto que el host calcula cuenta con ella.
         Todo lo que se declara más abajo la tapa, que es lo correcto — un
         diálogo o la ayuda mandan sobre un menú. -->
    <!-- La barra de paneles (#324) va ANTES del menú por la misma regla: el
         desplegable del menú tiene que pintarse por encima de ella. -->
    <div id="panelbar"></div>
    <!-- La barra de teclas (spec 2026-09-10): fija ABAJO, así que el orden
         del documento no le importa; va aquí por vecindad con la de paneles. -->
    <div id="keybar"></div>
    <div id="menu" data-open="false"></div>
    <div id="palette" data-open="false"></div>
    <div id="goto" data-open="false"></div>
    <div id="whichkey" data-open="false"></div>
    <div id="viewer" data-open="false"></div>
    <!-- La salida de un comando de extensión va JUSTO DEBAJO de los
         diálogos, y el orden importa dos veces: pinta con un velo a pantalla
         completa y sin `z-index` en ninguna parte, así que quien va después
         en el DOM tapa al anterior. Declarada tras `#dialogs` cubría una
         confirmación que seguía teniendo el teclado —y el momento lo elegía
         el plugin, que decide cuándo contesta su comando—. -->
    <div id="plugin-output" data-open="false"></div>
    <div id="program-output" data-open="false"></div>
    <!-- La ayuda va la ÚLTIMA a propósito: se abre encima de lo que
         hubiera —también encima del visor y de un diálogo— y el orden del
         documento es lo que decide quién tapa a quién sin inventarse un
         `z-index`. Con la ayuda antes del visor, `F1` en el visor pintaba una
         ayuda debajo de un fondo opaco. -->
    <div id="settings" data-open="false"></div>
    <!-- Las sesiones de agente van ENTRE los ajustes y las extensiones, y no
         es estética: el teclado se lo queda el gestor de extensiones antes
         que este panel, y este antes que los ajustes, así que el orden del
         DOM —que es el de pintado, porque no hay `z-index` en ninguna
         parte— tiene que decir lo mismo. Declarado antes que `#settings`,
         los ajustes tapaban un panel que seguía teniendo las teclas. -->
    <div id="agents" data-open="false"></div>
    <div id="extensions" data-open="false"></div>
    <div id="theme" data-open="false"></div>
    <div id="picker" data-open="false"></div>
    <div id="profiles" data-open="false"></div>
    <div id="layouts" data-open="false"></div>
    <div id="columns" data-open="false"></div>
    <div id="search" data-open="false"></div>
    <div id="compare" data-open="false"></div>
    <div id="sync" data-open="false"></div>
    <!-- La revisión de un plan de renombrado va aquí, casi al final: se
         queda el teclado por encima de los selectores (columnas, temas,
         ajustes, búsqueda…), y todos ellos pintan un fondo opaco a pantalla
         completa. Colocada antes, la revisión recibía las teclas mientras un
         selector la tapaba del todo — o sea que se podía aprobar un
         renombrado desde una pantalla que el que aprueba no ve. Solo la
         ayuda y los diálogos van por encima, y esos SÍ se quedan las
         teclas. -->
    <div id="ai-rename" data-open="false"></div>
    <div id="organize" data-open="false"></div>
    <!-- Los diálogos van DESPUÉS de todos los selectores y paneles, y antes
         solo de la ayuda: un diálogo se queda el teclado por encima de lo que
         hubiera, así que tiene que pintarse encima. Declarados antes que
         `#settings`, el prompt que pide el valor de un ajuste (puente 60)
         abría DEBAJO de los ajustes: se veía el velo oscurecerse y ningún
         campo — un diálogo con el teclado que nadie podía ver. La salida de
         un plugin sigue antes que ellos, que es lo que aquel comentario pide.
         -->
    <div id="dialogs"></div>
    <div id="help" data-open="false"></div>
    <div id="splash" data-open="false"></div>
    <div id="fatal" role="alert"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
