[package]
name = "norte-gui-tauri"
description = "norte's reference renderer: a Tauri webview over norte-ui-host"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
# Not published to crates.io: it is an application, and it is distributed as a
# package (deb, RPM, AppImage) with its sibling binaries inside, not as a
# library.
publish = false

# The ONLY workspace crate allowed to name Tauri, WRY or a JavaScript runtime
# (ADR 0066, decision D2). `norte-client`, `norte-frontend` and `norte-ui-host`
# build and pass their tests without Tauri and without Node installed, and
# their boundary tests watch that.
#
# Outside the PORTABLE gate (`core_pkgs` in the justfile excludes it), and not
# because it is provisional — it is a supported frontend (ADR 0087) — but
# because it drags in the system's WebKitGTK, GTK3 and libsoup3, which no other
# part of the tree needs to build. Its gate is `just gui-ci`, with its own
# workflow.

[features]
# Task 3.6's instrumentation: adds the `metrics` command, through which the
# renderer returns what it measured. NOT in the default binary — the
# production command surface is what `tests/webview_boundary.rs` pins.
metrics = []

[lib]
name = "norte_gui_tauri"
path = "src/lib.rs"

[[bin]]
name = "norte-gui"
path = "src/main.rs"

[dependencies]
norte-client.workspace = true
# The terminal-hazard predicate: the SAME one that masks names.
norte-encoding.workspace = true
norte-config = { workspace = true, features = ["logging"] }
norte-frontend.workspace = true
norte-i18n.workspace = true
norte-proto.workspace = true
norte-theme.workspace = true
norte-ui-host.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
# The file log is set up HERE, not with `norte-core`'s helper: this binary
# talks to the daemon over a socket and cannot drag in the engine, the
# providers and the plugin host to write one line (ADR 0066). Both are already
# workspace dependencies; nothing new enters the tree.
tracing-appender.workspace = true
tracing-subscriber.workspace = true
# `vpath_from_native`: the ONLY function that converts a system path into a
# `VPath`. Re-deriving the local scheme's rules here would be exactly the
# duplication that function exists to avoid (rule 1). It lives in `norte-vfs`
# — the trait's crate, which does not touch disk — and not in the local
# provider: this binary talks to the daemon over a socket, and dragging in the
# one crate with `unsafe`, `openat2` and `ConfinedRoot` to convert a string is
# the opposite of what ADR 0066 promises (#254).
norte-vfs.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
norte-core.workspace = true
norte-testkit.workspace = true
# TEST-ONLY: `celdas_locales` mounts a real `LocalProvider` against a temp
# directory. Dev-dependencies do not travel in the binary, and
# `tests/dependency_boundary.rs` deliberately excludes them (#254).
norte-vfs-local.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
