[package]
name = "norte-vfs-sftp"
description = "VFS provider over SFTP/SSH (russh)"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
# SHA-256 of the staging for VerifyPolicy::Hash (#35).
sha2.workspace = true
# The lib only speaks sftp over an already-established stream; russh-sftp is
# agnostic of the transport and does NOT pull in russh/rsa. The SSH transport
# (`russh`) is used only by the nightly test `openssh` → it stays a
# dev-dependency until phase 6 wires up connect() for real; this way
# rsa/aws-lc-rs (RUSTSEC-2023-0071) does NOT enter the gate's build.
russh-sftp.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
norte-testkit.workspace = true
russh.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[features]
# NIGHTLY integration test against a real OpenSSH server (atmoz/sftp) via
# testcontainers (ADR 0013 C2). Outside the PR gate: it requires Docker and is
# slow; the nightly workflow runs it, not `just ci`. `testcontainers` is an
# optional dep so its tree (bollard, …) does not compile in the normal build.
it-openssh = ["dep:testcontainers"]

[dependencies.testcontainers]
version = "0.27"
optional = true

# The `openssh` test only compiles with the `it-openssh` feature (nightly).
[[test]]
name = "openssh"
required-features = ["it-openssh"]

[lints]
workspace = true
