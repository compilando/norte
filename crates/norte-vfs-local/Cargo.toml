[package]
name = "norte-vfs-local"
description = "Provider VFS del filesystem local (unix/windows/macos)"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
# Nombre ESTABLE del `.norte-partial` de resume (ADR 0012): SHA-256 truncado
# a 128 bits — estable entre versiones de Rust (a diferencia de DefaultHasher)
# y sin colisión accidental/adversarial (hallazgo H1/H3 del encoding-auditor).
# También servirá para verify=Hash/ETags en la fase 7 (object storage).
sha2.workspace = true
unicode-normalization.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-stream.workspace = true
trash.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Errores tipados de la capacidad `location` (regla 6: librerías con thiserror).
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # `DRIVE_FIXED`/`DRIVE_REMOVABLE`/… (2026-08-10-volumes.md task V4,
    # `mounts_windows::drive_type`) live here, not in
    # `Win32_Storage_FileSystem` alongside the functions that use them.
    "Win32_System_WindowsProgramming",
    # `FILE_READ_ONLY_VOLUME` (`mounts_windows::volume_info`), same story.
    "Win32_System_SystemServices",
] }

[dev-dependencies]
criterion.workspace = true
futures.workspace = true
norte-testkit.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

# El benchmark que la ADR 0002 aplazó (#12): mide el suelo del sistema contra
# el camino del provider, que es lo que decide si `tokio-uring` tiene algo que
# ganar aquí.
[[bench]]
name = "local_io"
harness = false

[lints]
workspace = true
