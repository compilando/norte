[package]
name = "norte-vfs-local"
description = "Provider VFS del filesystem local (unix/windows/macos)"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
# Nombre ESTABLE del `.norte-partial` de resume (ADR 0012): SHA-256 truncado
# a 128 bits — estable entre versiones de Rust (a diferencia de DefaultHasher)
# y sin colisión accidental/adversarial (hallazgo H1/H3 del encoding-auditor).
# También servirá para verify=Hash/ETags en la fase 7 (object storage).
sha2.workspace = true
unicode-normalization.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-stream.workspace = true
trash.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
norte-testkit.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
