[package]
name = "norte-vfs-local"
description = "VFS provider for the local filesystem (unix/windows/macos)"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
# STABLE name of the resume `.norte-partial` (ADR 0012): SHA-256 truncated
# to 128 bits — stable across Rust versions (unlike DefaultHasher) and
# without accidental/adversarial collision (encoding-auditor finding H1/H3).
# Will also serve for verify=Hash/ETags in phase 7 (object storage).
sha2.workspace = true
unicode-normalization.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-stream.workspace = true
trash.workspace = true
# Typed errors for the `location` capability (rule 6: libraries use thiserror).
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # `DRIVE_FIXED`/`DRIVE_REMOVABLE`/… (2026-08-10-volumes.md task V4,
    # `mounts_windows::drive_type`) live here, not in
    # `Win32_Storage_FileSystem` alongside the functions that use them.
    "Win32_System_WindowsProgramming",
    # `FILE_READ_ONLY_VOLUME` (`mounts_windows::volume_info`), same story.
    "Win32_System_SystemServices",
    # `NtCreateFile` relative to a directory handle: the confined `location`
    # root has no Win32 equivalent (ADR 0158). `OBJECT_ATTRIBUTES` is gated
    # behind `Win32_Security`, `IO_STATUS_BLOCK` behind `Win32_System_IO`.
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
] }

[dev-dependencies]
criterion.workspace = true
futures.workspace = true
norte-testkit.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

# The benchmark ADR 0002 deferred (#12): measures the system's floor against
# the provider's path, which is what decides whether `tokio-uring` has
# anything to gain here.
[[bench]]
name = "local_io"
harness = false

[lints]
workspace = true
