[package]
name = "norte-sync"
description = "One-way synchronisation planner for norte: comparison rows in, plan steps out"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# `Stream` + `StreamExt`: the planner CONSUMES norte-compare's row flow and
# PRODUCES a step flow. Already a dependency of norte-compare and norte-vfs.
futures.workspace = true
# The input flow and its `CompareError`. This crate's whole reason to exist.
norte-compare.workspace = true
# The plan's vocabulary (`SyncStep`, `RelPath`, `SyncBlocker`…) lives on the
# wire: NOT a single protocol type is defined here.
norte-proto.workspace = true
# `SyncOptions` is serialized for norte-core's SPOOL (ADR 0049): the approved
# plan is retained in a file and the executor needs both roots, because
# `sync.apply` carries nothing more than the hash. Not a wire type — the same
# binary writes and reads it — but the derive has to be where the struct is,
# not in a parallel copy in norte-core that would drift the moment someone
# added a field. Already a dependency of almost the whole workspace via
# norte-proto.
serde.workspace = true
# The `plan_hash`: sha256 over the plan's conclusions, the SAME algorithm and
# the same length-prefixed framing as the rename batch's `plan_hash` and the
# journal's chain (ADR 0023). Already a dependency of four crates.
sha2.workspace = true
# Typed library errors (hard rule 6).
thiserror.workspace = true
# `CancellationToken`: the SAME type norte-core's scheduler arms for every
# Task (hard rule 3) and the one norte-compare already uses.
tokio-util.workspace = true

[dev-dependencies]
# Seeding the `MemProvider` for the end-to-end test (compare → plan): a file's
# content travels as `Bytes`. Already a dependency of a dozen crates.
bytes.workspace = true
# The canonical hostile corpus: the 47 names against which deriving a `rel`
# is checked not to lose a byte (hard rule 1). And the `MemProvider` for the
# test that pushes REAL rows through the transducer: the 17 table tests build
# their rows by hand, and the "every path hangs off its root" contract crosses
# two crates, so none of them touch it.
norte-testkit.workspace = true
# The transducer's properties — an identical tree plans nothing, `Update`
# never deletes, no `rel` escapes its root — over trees nobody wrote by hand.
# Already a dev-dependency of norte-core.
proptest.workspace = true
# The `Provider` trait (and its `ByteSink`), to be able to seed that tree. At
# run time this crate does NOT talk to any provider — that is its whole
# reason to exist — so it is a dev-dependency and not a dependency.
norte-vfs.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
