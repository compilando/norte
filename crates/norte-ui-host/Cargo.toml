[package]
name = "norte-ui-host"
description = "El estado semántico de un frontend gráfico, independiente del toolkit que lo pinte"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

# Este crate NO conoce renderer alguno: ni Tauri, ni web, ni GPUI, ni ratatui
# (ADR 0066, decisión D2). Su test de frontera lo vigila igual que el del SDK.
[dependencies]
futures.workspace = true
norte-client.workspace = true
norte-encoding.workspace = true
norte-frontend.workspace = true
# La configuración YA cargada entra en el host para la vista de ajustes en
# solo lectura (tarea 4.5). El host no la LEE de disco —quien lo arranca se la
# pasa—, pero sí necesita nombrar su tipo. Ya estaba en el grafo vía
# `norte-frontend`, y era dev-dependency de este crate: no compila nada nuevo.
norte-config.workspace = true
# La ayuda (tarea 4.4): el corpus y su modelo de bloques. La dependencia va
# host → help y nunca al revés (`norte_help::resolve` explica por qué): un
# `norte-help` que conociera un frontend solo podría servir a uno. Ya está en
# el grafo vía `norte-frontend`, no entra nada nuevo a compilar.
norte-help.workspace = true
norte-i18n.workspace = true
norte-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
# El e2e levanta un daemon REAL y conecta el SDK contra él. Son
# dev-dependencies: el test de frontera solo mira el árbol de release, que es
# donde el core no puede estar.
bytes.workspace = true
norte-core.workspace = true
norte-testkit.workspace = true
norte-vfs.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
