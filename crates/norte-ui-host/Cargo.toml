[package]
name = "norte-ui-host"
description = "The semantic state of a graphical frontend, independent of the toolkit that paints it"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

# This crate knows NO renderer at all: not Tauri, not web, not GPUI, not
# ratatui (ADR 0066, decision D2). Its boundary test watches this the same
# way the SDK's does.
[dependencies]
futures.workspace = true
norte-client.workspace = true
norte-encoding.workspace = true
norte-vfs.workspace = true
norte-frontend.workspace = true
# The terminal panel's grid (#362), the SAME one that paints the terminal:
# it is what makes the two frontends show the same thing by construction
# instead of by comparing two emulators. It is in-house and its only
# external dependency is `vte`, justified in its own Cargo.toml.
norte-term = { workspace = true, features = ["pty"] }
# The ALREADY loaded configuration enters the host for the read-only settings
# view (task 4.5). The host does not READ it from disk — whoever starts it
# passes it in — but it does need to name its type. It was already in the
# graph via `norte-frontend`, and was a dev-dependency of this crate: nothing
# new compiles.
#
# `logging` since #326: the log panel READS the ring
# (`norte_config::logring::LogRing`), which lives behind that feature because
# the module also carries the subscriber layer. The binary that hosts this
# host (`norte-gui-tauri`) already turns it on to mount that layer, so
# nothing new compiles here either — it is the same graph, declared where it
# is actually used.
norte-config = { workspace = true, features = ["logging"] }
# Help (task 4.4): the corpus and its block model. The dependency runs
# host → help and never the other way (`norte_help::resolve` explains why): a
# `norte-help` that knew a frontend could only serve one. It is already in
# the graph via `norte-frontend`, nothing new compiles.
norte-help.workspace = true
norte-i18n.workspace = true
norte-proto.workspace = true
# The THEME. The host already modeled one (`pickers::HostTheme`) with the
# colors passed to it at startup; now that its picker CHOOSES, it has to
# resolve by name the one the reader points to, and that is this crate. It
# is a data sheet — colors and roles, no toolkit and no core — that was
# already in the graph via the TUI and the window: nothing new compiles, and
# the boundary ADR 0066 draws (neither core nor toolkit) stays where it was.
norte-theme.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
# The parity harness compares the TWO frontends (ADR 0097, D1). Until now it
# compared this host against the shared primitives with a harness whose
# steps encoded the HOST's own response, so it could never fail; the
# 2026-09-05 audit found seventeen decisions already diverged that had
# slipped through underneath. Comparing needs seeing the other side.
#
# DEV-dependency and only that: this crate's release tree cannot contain a
# frontend, and `tests/dependency_boundary.rs` checks exactly that. Nothing
# new compiles — the gate already builds the whole workspace.
norte-tui.workspace = true
# The e2e test brings up a REAL daemon and connects the SDK against it. They
# are dev-dependencies: the boundary test only looks at the release tree,
# which is where the core must never be.
bytes.workspace = true
norte-core.workspace = true
norte-testkit.workspace = true
norte-vfs.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# The log panel (#326) is tested by filling the ring through its path of
# TRUTH — the `tracing` layer that feeds it — and not with a public `push`.
# A public `push` would skip the filter that carries the `suppaftp` guard
# (which logs `PASS <password>` at TRACE level), and that guard is not
# negotiable.
tracing-subscriber.workspace = true
# A layout of THREE listings, which no factory preset ships: the destination
# can only be guessed wrong when there is more than one candidate.
toml.workspace = true
# test-util: `start_paused` for the task board's TTL — the test skips the
# ten seconds instead of waiting them out, which is the difference between a
# deterministic test and one that takes as long as the deadline. Same reason
# it is already in norte-tui, norte-core and norte-frontend.
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "test-util",
] }

[lints]
workspace = true
