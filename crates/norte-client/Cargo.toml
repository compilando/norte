[package]
name = "norte-client"
description = "norte daemon client SDK: transport, framed JSON-RPC and remote backend"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

# This crate's boundary IS its dependency list, and a test fails if it grows
# toward the core (`tests/dependency_boundary.rs`, ADR 0066): a frontend that
# only talks over a socket has no reason to drag in the engine, the
# providers, the index or the plugin host just to send a JSON-RPC.
[dependencies]
base64.workspace = true
futures.workspace = true
norte-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing.workspace = true

# The named pipe's DACL and peer SID: the only `unsafe` the transport needs,
# kept out of this `forbid(unsafe_code)` crate (ADR 0159).
[target.'cfg(windows)'.dependencies]
norte-winpipe.workspace = true

[dev-dependencies]
# The boundary test reads cargo's graph and walks it.
serde_json.workspace = true
# The remote backend's tests bring up sockets in temporary directories.
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
