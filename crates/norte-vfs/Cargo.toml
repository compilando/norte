[package]
name = "norte-vfs"
description = "Contrato central del VFS: trait Provider, streams, capabilities"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
norte-proto.workspace = true
norte-encoding.workspace = true
# `deadline::blocking_with_deadline` (#213): un plazo sobre una syscall que no
# se puede cancelar, compartido por el core y por los providers. Vive aquí
# porque el motivo por el que existe —un montaje de red muerto— no es de nadie
# en particular, y dos copias que puedan divergir en si el hilo es DESACOPLADO
# es exactamente el fallo del que protege. `rt`/`sync`/`time` y nada más: este
# crate no impone runtime a quien no llame a esa función.
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
# `wtf8::encode_from_wide`'s corpus round-trip test (2026-08-10-volumes.md
# task V4, encoding-auditor finding). `norte-testkit` depends on `norte-vfs`
# normally, so this is a dev-deps cycle — the pattern
# `norte-encoding`/`norte-testkit` already use, which cargo supports (dev
# dependencies are not part of the graph cargo checks for cycles when THIS
# crate is built as someone else's dependency, only when its own tests run).
norte-testkit.workspace = true

[lints]
workspace = true
