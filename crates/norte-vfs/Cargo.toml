[package]
name = "norte-vfs"
description = "VFS central contract: Provider trait, streams, capabilities"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
norte-proto.workspace = true
norte-encoding.workspace = true
# `deadline::blocking_with_deadline` (#213): a deadline over a syscall that
# can't be cancelled, shared by the core and by the providers. Lives here
# because the reason it exists — a dead network mount — doesn't belong to
# anyone in particular, and two copies that could diverge on whether the
# thread is DETACHED is exactly the failure it protects against.
# `rt`/`sync`/`time` and nothing else: this crate imposes no runtime on
# whoever doesn't call that function.
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
# `wtf8::encode_from_wide`'s corpus round-trip test (2026-08-10-volumes.md
# task V4, encoding-auditor finding). `norte-testkit` depends on `norte-vfs`
# normally, so this is a dev-deps cycle — the pattern
# `norte-encoding`/`norte-testkit` already use, which cargo supports (dev
# dependencies are not part of the graph cargo checks for cycles when THIS
# crate is built as someone else's dependency, only when its own tests run).
norte-testkit.workspace = true

[lints]
workspace = true
