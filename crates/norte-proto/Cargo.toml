[package]
name = "norte-proto"
description = "norte protocol types (serde): wire format, versioning, no logic"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
bitflags.workspace = true
# `AttrValue::Bytes` owns its decode (ADR 0039): the wire carries base64 and
# the type hands consumers real bytes, so there is exactly ONE decode path and
# a corrupt cell degrades in one place. Already a vetted workspace dependency
# (`norte-core` uses it for `fs.read`); MIT OR Apache-2.0, no transitive deps.
base64.workspace = true
serde.workspace = true
# The protocol digests' framing (ADR 0051, #174): `hashing::feed` is the
# primitive `norte-sync` uses for `plan_hash` and the one `norte-core` pins its
# own copy against — frozen by the journal's format — with an equality test.
# It lived duplicated across two crates; this is the place both see. RustCrypto,
# MIT OR Apache-2.0, no transitive dependencies outside its family, and it was
# already in the tree (norte-core, norte-sync, norte-index).
sha2.workspace = true
# The protocol's JSON encoding (envelope ADR 0011): Value in params/result and
# the NDJSON framing. Already in the tree as a dev-dep of the whole workspace.
serde_json.workspace = true
thiserror.workspace = true
# JSON Schema generation for docs/schema/proto.schema.json (ADR 0038, spec §11).
# Off by default: the shipped crate gains no dependency at runtime — the derives
# and the schema golden compile only under the `schema` feature.
schemars = { workspace = true, features = ["derive"], optional = true }

[features]
# Generate the protocol JSON Schema from the same serde types that speak the
# wire (ADR 0038). Enabled by the golden test and the `just ci` schema step.
schema = ["dep:schemars"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
