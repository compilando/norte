[package]
name = "norte-connect"
description = "Management of remote connections and secrets (connections.toml, keyring, age)"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Binary format (no armor): secrets.age is not meant for manual editing.
age.workspace = true
# macOS/Windows: native backends, NO C dep. Linux's Secret Service
# (sync-secret-service → libdbus C, requires libdbus-1-dev to build) is
# opt-in via the `linux-keyring` feature (below): so CI/headless build
# without C and use env/age; a Linux desktop with libdbus enables it.
keyring = { workspace = true, features = ["apple-native", "windows-native"] }
norte-proto.workspace = true
# connect's object storage (phase 7d, ADR 0016 B): builds opendal's
# `Operator` (bucket/region/endpoint/credentials) that `ObjectProvider::new`
# receives injected — same pattern as SftpSession/FtpStream. The provider
# never sees the secret-access-key.
opendal.workspace = true
# connect's SSH transport (ADR 0015 A): russh lives HERE (AGPL), not in the
# provider (MIT/Apache, which receives the injected session). Was already in
# the workspace (norte-vfs-sftp nightly); just promoted to a normal dep.
russh.workspace = true
# connect returns the `SftpSession` that `SftpProvider::new` accepts — it is
# the provider's public interface, not an auth type (ADR 0015 A boundary).
russh-sftp.workspace = true
# Parses the extra CA (`extra_root_ca`) in PEM for FTPS (the `pem` module, in
# the default `alloc` feature).
rustls-pki-types.workspace = true
serde = { workspace = true, features = ["derive"] }
# connect's FTP/FTPS transport (ADR 0015 A/F): the TLS policy lives here; the
# provider receives the already-negotiated stream. aws-lc-rs = same stack as
# russh.
suppaftp = { workspace = true, features = ["tokio", "tokio-rustls-aws-lc-rs"] }
thiserror.workspace = true
# spawn_blocking only (rt feature); no tokio::sync.
tokio = { workspace = true, features = ["rt"] }
# Builds FTPS's TlsConnector (re-exports rustls; suppaftp's version).
tokio-rustls.workspace = true
# Mozilla CA roots to validate the FTPS server's cert.
webpki-roots.workspace = true
toml.workspace = true
tracing.workspace = true
zeroize.workspace = true

# Journal anchor key (M3-5, ADR 0025): 32 OS bytes.
getrandom.workspace = true

[features]
# Linux keyring (Secret Service) via libdbus C: opt-in — requires
# `libdbus-1-dev` + `pkg-config` to build. Off by default (CI/headless build
# without C; Linux falls back to env/age). macOS/Windows do not need it.
linux-keyring = ["keyring/sync-secret-service", "keyring/crypto-rust"]

[dev-dependencies]
# In-process SSH server + agent for connect's tests (no Docker).
futures.workspace = true
# In-process FTP/FTPS server (same harness as norte-vfs-ftp).
libunftp.workspace = true
# Ephemeral test ed25519 keys (host/client keys).
rand.workspace = true
# Ephemeral self-signed certificate for the test FTPS server.
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
# UnixListenerStream to serve the in-process SSH agent.
tokio-stream = { workspace = true, features = ["net"] }
unftp-sbe-fs.workspace = true
# In-process S3 server for the S3Connector test (same pattern as
# norte-vfs-object): validates the probe against a real server without
# Docker.
hyper-util.workspace = true
s3s.workspace = true
s3s-fs.workspace = true

[lints]
workspace = true
