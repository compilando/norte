[package]
name = "norte-connect"
description = "Gestión de conexiones remotas y secretos (connections.toml, keyring, age)"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Formato binario (no armor): el secrets.age no es de edición manual.
age.workspace = true
# macOS/Windows: backends nativos, SIN dep C. El Secret Service de Linux
# (sync-secret-service → libdbus C, exige libdbus-1-dev al construir) es opt-in
# por la feature `linux-keyring` (abajo): así CI/headless compilan sin C y usan
# env/age; un escritorio Linux con libdbus lo habilita.
keyring = { workspace = true, features = ["apple-native", "windows-native"] }
norte-proto.workspace = true
# Transporte SSH del connect (ADR 0015 A): russh vive AQUÍ (AGPL), no en el
# provider (MIT/Apache, que recibe la sesión inyectada). Ya estaba en el
# workspace (norte-vfs-sftp nightly); solo se promociona a dep normal.
russh.workspace = true
# El connect devuelve la `SftpSession` que `SftpProvider::new` acepta — es la
# interfaz pública del provider, no un tipo de auth (frontera ADR 0015 A).
russh-sftp.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
# Solo spawn_blocking (feature rt); nada de tokio::sync.
tokio = { workspace = true, features = ["rt"] }
toml.workspace = true
tracing.workspace = true
zeroize.workspace = true

[features]
# Keyring de Linux (Secret Service) vía libdbus C: opt-in — exige
# `libdbus-1-dev` + `pkg-config` al construir. Off por defecto (CI/headless
# compilan sin C; Linux cae a env/age). macOS/Windows no lo necesitan.
linux-keyring = ["keyring/sync-secret-service", "keyring/crypto-rust"]

[dev-dependencies]
# Servidor SSH + agente in-process para los tests de connect (sin Docker).
futures.workspace = true
# Claves ed25519 efímeras de test (host/client keys).
rand.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread"] }
# UnixListenerStream para servir el agente SSH in-process.
tokio-stream = { workspace = true, features = ["net"] }

[lints]
workspace = true
