[package]
name = "norte-testkit"
description = "MemProvider determinista, corpus de fixtures hostiles y estrategias proptest"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
# Predicado `is_terminal_hazard` que documenta por qué cada chord del corpus
# `hostile_chords()` es hostil (encoding audit H1): dependencia de doctest y
# de la doc, no del runtime del crate — norte-encoding ya dev-depende de este
# crate (patrón de ciclo-en-dev-deps que cargo soporta).
norte-encoding.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
# SHA-256 del staging para VerifyPolicy::Hash (#35), hermana de la del core.
sha2.workspace = true
unicode-normalization.workspace = true
# proptest es dependencia normal: este crate PUBLICA las estrategias canónicas.
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }

[lints]
workspace = true
