[package]
name = "norte-testkit"
description = "Deterministic MemProvider, hostile fixture corpus and proptest strategies"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
# `is_terminal_hazard` predicate that documents why each chord in the
# `hostile_chords()` corpus is hostile (encoding audit H1): a doctest and doc
# dependency, not a runtime one for this crate — norte-encoding already
# dev-depends on this crate (a cycle-in-dev-deps pattern cargo supports).
norte-encoding.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
# SHA-256 for staging, for VerifyPolicy::Hash (#35), sibling of the core's.
sha2.workspace = true
unicode-normalization.workspace = true
# proptest is a normal dependency: this crate PUBLISHES the canonical strategies.
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
# `CancellationToken` for the `cancel_after_renames` control (#274): cancelling
# BETWEEN two renames is the only way to pin that a spelling change does not
# leave the file under the bypass name. Already in the graph (norte-core,
# norte-vfs and others use it); nothing new enters the build (rule 8).
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }

[lints]
workspace = true
