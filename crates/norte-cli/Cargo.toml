[package]
name = "norte-cli"
description = "CLI de norte: daemon, conexiones, política, undo, índice, IA y diagnóstico"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "norte"
path = "src/main.rs"

# El CLI SÍ entra en el release. `dist = false` venía de M0, cuando `norte` era
# un banco de pruebas del core embebido; hoy es la mitad no interactiva del
# producto — `daemon`, `connect`, `mcp`, `policy`, `undo`, `index`, `ai`,
# `audit`, `doctor` — y `norte tui` es como el README enseña a arrancar la TUI.
# Un artefacto con `ntc` y sin `norte` deja al usuario sin daemon ni doctor;
# `scripts/dist-smoke.sh` lo comprueba sobre el archivo construido.
[package.metadata.dist]
dist = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
norte-config.workspace = true
norte-connect.workspace = true
norte-core.workspace = true
norte-encoding.workspace = true
norte-frontend.workspace = true
# H3e: `doctor` juzga un `help.md` con el MISMO tope y las MISMAS reglas de
# pertenencia de comandos que aplican en el host y en el frontend.
norte-help.workspace = true
norte-mcp.workspace = true
norte-i18n.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
norte-vfs-local.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true

[lints]
workspace = true
