[package]
name = "norte-cli"
description = "norte's CLI: daemon, connections, policy, undo, index, AI and diagnostics"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "norte"
path = "src/main.rs"

# The CLI DOES go into the release. `dist = false` dated from M0, when `norte`
# was a test bench for the embedded core; today it is the non-interactive
# half of the product — `daemon`, `connect`, `mcp`, `policy`, `undo`, `index`,
# `ai`, `audit`, `doctor` — and `norte tui` is how the README teaches you to
# start the TUI. An artifact with `ntc` and without `norte` leaves the user
# without a daemon or a doctor; `scripts/dist-smoke.sh` checks that against
# the built archive.
[package.metadata.dist]
dist = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
norte-config = { workspace = true, features = ["logging"] }
norte-connect.workspace = true
norte-core.workspace = true
norte-encoding.workspace = true
norte-frontend.workspace = true
# H3e: `doctor` judges a `help.md` with the SAME cap and the SAME
# command-ownership rules that apply in the host and in the frontend.
norte-help.workspace = true
norte-mcp.workspace = true
norte-i18n.workspace = true
norte-proto.workspace = true
# `norte theme import`: the VSCode theme parser and the TOML writer.
norte-theme.workspace = true
norte-vfs.workspace = true
norte-vfs-local.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
# `toml_edit::Value` is the type of `norte_config::persist_set` (`--use`).
toml_edit.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
norte-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
