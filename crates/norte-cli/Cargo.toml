[package]
name = "norte-cli"
description = "CLI de humo de norte: banco de pruebas manual del core embebido"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "norte"
path = "src/main.rs"

# El CLI es un banco de pruebas de M0 (spec): NO entra en el release
# distribuido (un solo instalador para el TUI, el producto). Se compila desde
# fuente o con `cargo install --path crates/norte-cli`.
[package.metadata.dist]
dist = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
norte-config.workspace = true
norte-connect.workspace = true
norte-core.workspace = true
norte-encoding.workspace = true
norte-frontend.workspace = true
# H3e: `doctor` juzga un `help.md` con el MISMO tope y las MISMAS reglas de
# pertenencia de comandos que aplican en el host y en el frontend.
norte-help.workspace = true
norte-mcp.workspace = true
norte-i18n.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
norte-vfs-local.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true

[lints]
workspace = true
