[package]
name = "norte-plugin-host"
description = "Host de plugins WASM: manifiesto, capabilities y catálogo (el runtime wasmtime llega en M4-P2)"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# El alfabeto de un id de plugin vive junto al tipo del wire que lo transporta
# (`norte_proto::methods::is_valid_plugin_id`): la pregunta la hacen este crate
# al parsear un manifiesto y CUALQUIERA que reciba un `PluginInfo`, y dos
# implementaciones acabarían divergiendo. `norte-proto` es la base del
# workspace y no depende de nada nuestro, así que no hay inversión de capas.
norte-proto.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
toml.workspace = true
# Escritor de settings PERSISTIDAS del usuario (S2, `persist_plugin_setting`
# junto a `config_values.rs`): igual que `norte-config::persist_set`, hace
# falta preservar comentarios/formato al reescribir `config.toml` — `toml`
# (arriba) solo DESERIALIZA, no tiene edición comment-preserving. Ya es dep
# de workspace (`norte-config` la usa con el mismo fin) — cero coste nuevo de
# build, solo activa la feature para este crate.
toml_edit.workspace = true
# Digest de las capabilities aprobadas (issue #69, defensa confused-deputy): un
# sha256 de la forma canónica del bloque `[capabilities]` que se guarda JUNTO a
# la aprobación; si el manifiesto cambia en disco tras aprobar, el digest deja de
# casar y el host re-pide consentimiento. Misma dep de hashing que el journal.
sha2.workspace = true
# Runtime WASM de plugins (M4-P2, ADR 0022 D1): wasmtime es la dep GRANDE y
# estructural de esta fase — ejecuta los componentes WASM del modelo de M4-P1.
# default-features=false + runtime/component-model/cranelift/std: solo el motor
# de ejecución, el component-model (WIT), el compilador cranelift y el std;
# fuera quedan wat/wasm parsing, gc, etc. wasmtime-wasi 46 comparte release
# train con wasmtime 46 (el major va sincronizado): preview2 (p2) por defecto.
# anyhow lo exige la API de wasmtime (sus Result son anyhow::Error).
wasmtime = { version = "46", default-features = false, features = ["runtime", "component-model", "cranelift", "std"] }
wasmtime-wasi = "46"
anyhow.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Servidor FTP in-process para el E2E del stack de red (#30 stage 3b): mismo
# harness que norte-vfs-ftp, sin Docker. Solo dev.
libunftp.workspace = true
unftp-sbe-fs.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
