# Guest WASM (#30 stage 3b, PROOF): cliente FTP REAL con suppaftp SYNC sobre
# wasi:sockets. Conecta al servidor del `arg`, lista `/`, devuelve el nº de
# entradas — prueba el stack entero (net gateada → FTP sync en wasm → servidor
# real). El port COMPLETO del provider FTP es milestone aparte. NO es miembro
# del workspace. suppaftp sin TLS (aws-lc-rs no compila a wasm; FTPS = deuda).
[workspace]

[package]
name = "ftp-probe"
edition = "2021"
version = "0.0.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"
suppaftp = { version = "10", default-features = false }

[profile.release]
panic = "abort"
opt-level = "s"
