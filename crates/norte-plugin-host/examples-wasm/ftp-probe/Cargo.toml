# WASM guest (#30 stage 3b, PROOF): REAL FTP client with SYNC suppaftp over
# wasi:sockets. Connects to `arg`'s server, lists `/`, returns the entry
# count — proves the whole stack (gated net → sync FTP in wasm → real
# server). The FULL FTP provider port is a separate milestone. NOT a
# workspace member. suppaftp without TLS (aws-lc-rs does not compile to
# wasm; FTPS = debt).
[workspace]

[package]
name = "ftp-probe"
edition = "2021"
version = "0.0.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"
suppaftp = { version = "10", default-features = false }

[profile.release]
panic = "abort"
opt-level = "s"
