# WASM guest (#30 stage 2): a WRITABLE provider-mem over an in-memory tree
# — dogfooding the WIT `provider` interface (ADR 0032). Tests the async→sync
# projection (paginated list, ranged read) WITHOUT network. NOT a workspace
# member. STANDALONE manifest: empty `[workspace]`.
[workspace]

[package]
name = "provider-mem-rw"
edition = "2021"
version = "0.0.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
