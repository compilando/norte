# WASM guest (#30 stage 3c): the COMPLETE FTP provider in a guest. SYNC
# suppaftp over wasi:sockets, ALL the Provider trait's ops projected onto the
# WIT `provider` interface, with the native provider's CR/LF anti-injection
# defenses. No TLS (aws-lc-rs does not compile to wasm; FTPS = debt).
# Replaces norte-vfs-ftp.
# NOT a workspace member (separate wasm32-wasip2 target).
[workspace]

[package]
name = "ftp-provider"
edition = "2021"
version = "0.0.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"
# sync FtpStream, no TLS: default-features=false leaves out async and the
# whole crypto stack (aws-lc-rs/native-tls do not compile to wasm32-wasip2).
# Version 10 = the SAME as the native provider (norte-vfs-ftp), to port its
# API 1:1 (ListParser, FtpError variants).
suppaftp = { version = "10", default-features = false }

[profile.release]
panic = "abort"
opt-level = "s"
