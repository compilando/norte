# WASM guest (#30 stage 3a): NETWORK probe — connects over TCP to the
# command's `arg`, sends "ping", returns the response. Tests the `net`
# capability's gating (with network granted it connects; without it, connect
# fails). NOT a workspace member. STANDALONE manifest: empty `[workspace]`.
[workspace]

[package]
name = "net-probe"
edition = "2021"
version = "0.0.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
