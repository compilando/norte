# WASM guest (#29): a REAL previewer with syntect — highlights syntax
# INSIDE the pane. NOT a workspace member (see `exclude` in the root
# Cargo.toml): compiles to wasm32-wasip2 with its own lockfile and profile.
#
# syntect with fancy-regex (PURE Rust regex — no `onig`/C, which does not
# compile to WASM) and the embedded default sets (dump-load). The output is
# 24-bit ANSI (`as_24_bit_terminal_escaped`); the host sanitizes it
# (`ansi` frontend).
# STANDALONE manifest: empty `[workspace]` so as not to inherit the host's.
[workspace]

[package]
name = "previewer-syntect"
edition = "2021"
version = "0.0.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# wit-bindgen GUEST-side: same WIT as the host (symlink wit -> ../../wit).
wit-bindgen = "0.46"
# syntect without onig (C, non-WASM): pure fancy-regex + embedded defaults.
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
    "dump-load",
] }

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
