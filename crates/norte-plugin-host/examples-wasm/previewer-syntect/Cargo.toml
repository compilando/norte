# Guest WASM (#29): un previewer REAL con syntect — resalta la sintaxis DENTRO
# del pane. NO es miembro del workspace (ver `exclude` en el Cargo.toml raíz):
# compila a wasm32-wasip2 con su propio lockfile y perfil.
#
# syntect con fancy-regex (regex PURO Rust — sin `onig`/C, que no compila a
# WASM) y los conjuntos por defecto embebidos (dump-load). La salida es ANSI de
# 24 bits (`as_24_bit_terminal_escaped`); el host la sanea (frontend `ansi`).
# Manifiesto AUTÓNOMO: empty `[workspace]` para no heredar el del host.
[workspace]

[package]
name = "previewer-syntect"
edition = "2021"
version = "0.0.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# wit-bindgen GUEST-side: mismo WIT que el host (symlink wit -> ../../wit).
wit-bindgen = "0.46"
# syntect sin onig (C, no-WASM): fancy-regex puro + defaults embebidos.
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
    "dump-load",
] }

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
