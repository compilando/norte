# This plugin's REAL manifest, and the one its tests read.
#
# It used to live as a literal inside `plugins_preview_syntect_e2e.rs`, which
# left the plugin without its own manifest: there was nothing to install, only
# a fixture describing what a manifest would have said. Now the file is the
# source and the test reads it — testing a copy of what gets distributed does
# not test what gets distributed.

[plugin]
id = "org.norte.syntect"
name = "Syntect Highlighter"
publisher = "norte"
version = "0.1.0"
category = "previewer"
description = "Syntax highlighting in the viewer, with syntect's default sets."

[contributions]
previewer = [{ mimetypes = ["text/*", "application/json"] }]

# `fs-read = "scoped"`: the guest does NOT open files. It reads the bytes the
# host already read and hands over under a token (rule 9). The capability
# exists because the host checks that it is declared before serving that
# token, not because the plugin has access to anything.
[capabilities]
fs-read = "scoped"
