# Example WASM guest (M4-P2 T6): a minimal command that demonstrates the
# `command::run` interface end-to-end + `fs-read`'s host-side enforcement
# (the guest calls `read-scoped` and the HOST decides based on the declared
# capability).
# NOT a workspace member (see `exclude` in the root Cargo.toml): compiles to
# wasm32-wasip2 with its own lockfile and profile.
# STANDALONE manifest: empty `[workspace]` so it does not inherit the host's
# workspace (compiles to wasm32-wasip2 with its own lockfile and profile).
[workspace]

[package]
name = "command-demo"
edition = "2021"
version = "0.0.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# wit-bindgen GUEST-side: generates bindings from the SAME WIT as the host
# (symlink `wit` -> ../../wit). Shares Component Model release train with wasmtime 46.
wit-bindgen = "0.46"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
