# Guest WASM de ejemplo (M4-P2 T4/T5): un previewer mínimo que demuestra la
# interfaz end-to-end (host-log + previewer::render). NO es miembro del
# workspace (ver `exclude` en el Cargo.toml raíz): compila a wasm32-wasip2 con
# su propio lockfile y perfil.
# Manifiesto AUTÓNOMO: empty `[workspace]` para que no herede el workspace del
# host (compila a wasm32-wasip2 con su propio lockfile y perfil).
[workspace]

[package]
name = "previewer-demo"
edition = "2021"
version = "0.0.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# wit-bindgen GUEST-side: genera los bindings desde el MISMO WIT que el host
# (symlink `wit` -> ../../wit). Comparte tren de Component Model con wasmtime 46.
wit-bindgen = "0.46"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
