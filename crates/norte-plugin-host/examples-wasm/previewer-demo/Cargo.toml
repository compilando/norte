# Example WASM guest (M4-P2 T4/T5): a minimal previewer that demonstrates
# the interface end-to-end (host-log + previewer::render). NOT a workspace
# member (see `exclude` in the root Cargo.toml): compiles to wasm32-wasip2
# with its own lockfile and profile.
# STANDALONE manifest: empty `[workspace]` so it does not inherit the host's
# workspace (compiles to wasm32-wasip2 with its own lockfile and profile).
[workspace]

[package]
name = "previewer-demo"
edition = "2021"
version = "0.0.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# wit-bindgen GUEST-side: generates bindings from the SAME WIT as the host
# (symlink `wit` -> ../../wit). Shares Component Model release train with wasmtime 46.
wit-bindgen = "0.46"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
