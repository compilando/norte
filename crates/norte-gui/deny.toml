# Política de licencias y advisories de `norte-gui` (M5).
#
# Separada del `deny.toml` del workspace a propósito. Aquel gobierna también
# `norte-proto`, `norte-vfs` y `norte-testkit`, que son MIT/Apache y existen
# para que los consuma un tercero: meter ahí lo que GPUI necesita relajaría la
# auditoría de lo que publicamos por un binario que no publicamos. La GUI queda
# excluida de aquel grafo (`[graph] exclude`) y auditada por este, que corre en
# `just gui-ci`.
#
# El binario es AGPL-3.0-only, así que aquí SÍ caben licencias copyleft y
# recíprocas por fichero que en una librería permisiva no cabrían.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "AGPL-3.0-only",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",
    # --- Lo que añade el árbol de GPUI, y por qué cabe en un binario AGPL ---
    # Recíproca POR FICHERO: obliga a publicar los cambios de esos ficheros, no
    # del programa que los enlaza. Compatible con AGPL en el binario.
    "MPL-2.0",
    # Permisiva de dos cláusulas, subconjunto de la BSD-3 que ya se permite.
    "BSD-2-Clause",
    # Copyleft fuerte. AGPL-3.0 y GPL-3.0 son explícitamente compatibles
    # (GPLv3 §13), y este binario YA es AGPL: no hay nada que relajar.
    "GPL-3.0-or-later",
]

exceptions = [
    # Dominio público. Acotado por-crate y jamás en el `allow` global, mismo
    # criterio que el `deny.toml` del workspace aplica a `notify`.
    { name = "hexf-parse", allow = ["CC0-1.0"] },
    # Keccak puro-Rust, dominio público. El `deny.toml` del workspace ya lo
    # acota igual por su propia rama (opendal → reqsign); aquí llega por otra.
    { name = "tiny-keccak", allow = ["CC0-1.0"] },
    # Licencia propia de bzip2, permisiva de estilo BSD. Es el bzip2 puro-Rust
    # que arrastra el árbol de tipografía.
    { name = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
]

[advisories]
ignore = [
    # Sin mantener, NO vulnerables — la distinción importa: un `unmaintained`
    # dice que nadie lo arregla si aparece algo, no que haya algo.
    #
    # Entran por el árbol de tipografía y SVG de GPUI (usvg →
    # rustybuzz/ttf-parser) y por macros de terceros (`paste`). No se pueden
    # cambiar sin cambiar GPUI, así que lo honesto es anotarlos con su motivo
    # y revisarlos cuando GPUI mueva su propio árbol.
    #
    # Revisar: 2026-11-07.
    "RUSTSEC-2026-0206", # rustybuzz, sin mantener
    "RUSTSEC-2026-0192", # ttf-parser, sin mantener
    "RUSTSEC-2024-0436", # paste, sin mantener
    # Los dos siguientes NO son de la GUI: entran por el mismo árbol que el
    # core ya audita y están aceptados con su motivo en el `deny.toml` del
    # workspace. Se repiten aquí porque este grafo tiene su propia raíz y
    # tendría que volver a decidirlos; duplicar el ID con un puntero al sitio
    # donde vive el razonamiento es mejor que dos razonamientos que se separan.
    "RUSTSEC-2023-0071", # rsa (Marvin) — ver deny.toml del workspace
    "RUSTSEC-2026-0173", # proc-macro-error2 — ver deny.toml del workspace, issue #41
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# GPUI no se publica en crates.io: el único origen es el repositorio de Zed, y
# la revisión está PINEADA en `Cargo.toml`. Permitir el repo entero y no una
# rev concreta es lo que cargo-deny sabe expresar; el pin lo hace el manifiesto.
allow-git = [
    "https://github.com/zed-industries/zed",
    # El fork de font-kit y el cliente XIM que GPUI usa en Linux. Como el
    # propio GPUI: no se publican en crates.io y la rev va PINEADA en el
    # manifiesto, que es donde vive la garantía — cargo-deny solo sabe
    # expresar el repositorio.
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/xim-rs",
]
