# norte-gui — SPIKE M5 (hito 1). Binario GPUI EXCLUIDO del workspace (ver el
# `exclude` del Cargo.toml raíz). NO comparte el lockfile ni el gate del core:
# se verifica a mano con `cargo build` DENTRO de este directorio. Regla 7: solo
# habla `norte-proto` (vía el `RemoteBackend` de `norte-core`); read-only.
#
# El crate NO hereda del workspace (está excluido) → edition/version standalone,
# sin `*.workspace = true` ni `rust-version` heredado.
[package]
name = "norte-gui"
# Sigue a la versión del workspace A MANO (el crate está excluido, no puede
# heredarla): `norte-gui --version` mentía con un 0.0.0 mientras se instala
# junto a `norte`/`norte-tui`.
version = "0.3.0-alpha.2"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[[bin]]
name = "norte-gui"
path = "src/main.rs"

[dependencies]
# Crates internos por PATH (no por el alias del workspace, que este crate no ve).
norte-core = { path = "../norte-core" }
norte-proto = { path = "../norte-proto" }
norte-theme = { path = "../norte-theme" }
# `mask_terminal_hazards` = fuente ÚNICA de saneado de nombres para display
# (regla 1: bytes no-UTF8 no rompen). `vpath_from_native` = cwd → VPath `file://`
# igual que la TUI. Ambos por path (crates internos, no vía el alias del workspace).
norte-encoding = { path = "../norte-encoding" }
norte-vfs-local = { path = "../norte-vfs-local" }
# Lógica de presentación compartida (GUI-a T1-T3): PaneState (cursor + quick
# search), display_name/sort_entries. Por path (crate del workspace, pero este
# binario está excluido → no puede usar el alias `.workspace`).
norte-frontend = { path = "../norte-frontend" }
# Descubrimiento de capas de config compartido (Task 9): reemplaza el fork
# `env_user_dir`/`layer_dirs` a mano por `norte_config::standard_layers`.
norte-config = { path = "../norte-config", version = "0.3.0-alpha.2" }
# Strings de UI por Fluent (GUI-e T1): mismos bundles es/en que la TUI
# (`crates/norte-i18n/i18n/*.ftl`), por path como el resto de los internos.
norte-i18n = { path = "../norte-i18n" }
# S4 (#135): un emulador de terminal que arranca y se rinde (un flag de cwd
# que su versión no acepta, un `xdg-terminal-exec` sin entrada de escritorio)
# es la única forma de que `app.terminal` acabe en un no-op mudo, y el hilo
# que entierra al hijo es el único sitio donde se ve. No añade nada al árbol:
# `tracing` ya entra por `norte-core`, esto solo la enlaza también aquí.
tracing.workspace = true
# Vocabulario de disponibilidad (`Availability`/`Reason`) del menú contextual
# (plan de ratón, tarea 4). QUÉ aporta: el corpus de ayuda YA define cómo se
# dice «esta operación no puede correr ahora, y por esto» — reusarlo evita un
# segundo vocabulario paralelo que la ayuda y el menú tendrían que mantener
# sincronizado a mano. TAMAÑO: crate INTERNO del workspace, sin dependencias
# externas nuevas (norte-encoding/norte-i18n/serde/thiserror/toml ya están
# todas en este grafo). Por path como el resto de los internos.
norte-help = { path = "../norte-help" }
# `norte-theme` keeps `Theme.effects` as an opaque `toml::Value` (ADR 0020
# D4); the GUI-only `EffectsV1` interpreter (ADR 0036, `src/effects.rs`)
# reads it directly, so this crate needs the same `toml` crate `norte-theme`
# uses to talk about the same `Value`/`Table` types. Version pinned to match
# `norte-theme`'s `toml.workspace = true` (0.9, per the root Cargo.toml) so
# the type resolves to the identical crate across the graph.
toml = "0.9"

# Runtime async para el backend remoto (el render de GPUI corre en su propio
# executor; el I/O del daemon va en un runtime tokio aparte — T4).
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"

# Preview de imágenes en el viewer F3 (PNG/JPEG/GIF/BMP/WebP). QUÉ aporta:
# decodifica los bytes ya leídos por la sesión a un frame RGBA que se convierte
# a `gpui::RenderImage`. TAMAÑO: sin coste extra — `image` ya entra transitiva
# por GPUI (misma 0.25.x resuelta en el lockfile); la declaramos DIRECTA con las
# features de los 5 codecs que detectamos, para no depender de un detalle
# interno de GPUI. OJO: cargo UNIFICA features en el grafo — como GPUI también
# depende de `image`, la superficie real de codecs la fija la UNIÓN (GPUI +
# nosotros), no solo estos 5; `default-features = false` aquí es por estabilidad
# de API de la dep DIRECTA, no reduce la superficie que ya trae GPUI.
# ALTERNATIVA descartada: escribir a fichero
# temporal y renderizar por path (más frágil, deja basura, y aquí el render
# in-memory de GPUI —`img(Arc<RenderImage>)`— es limpio).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
] }

# GPUI de Zed. NO está en crates.io como `gpui` estable → dep git pineada por
# SHA completo (criterio 4 del ADR: registrar rev + fecha). Licencia: Apache-2.0
# (el crate excluido no pasa por `cargo deny`; el ADR 0027 lo registra).
#
# rev f14fea9bf3c93797d5161f7440ed418655bc6c57 — commit de zed-industries/zed
# del 2026-07-19 (rama main). El `rust-toolchain.toml` de Zed en ese rev pinea
# stable 1.95.0 + edition 2024, así que debería compilar con nuestra 1.96.1.
gpui = { git = "https://github.com/zed-industries/zed", rev = "f14fea9bf3c93797d5161f7440ed418655bc6c57" }

# En este rev GPUI se partió en dos: `gpui` (núcleo: App/Window/Element) y
# `gpui_platform` (capa de plataforma que provee `application()` = selección de
# backend nativo por OS). Los ejemplos de GPUI (`crates/gpui/examples/*.rs`)
# arrancan con `gpui_platform::application().run(...)`, no con un `gpui::App::new`
# que en este rev NO existe (solo `Application::with_platform`). En Linux el
# backend real vive en `gpui_linux`, gateado por las features `wayland`/`x11` —
# por eso las pedimos aquí (sin ellas no habría ningún backend que compilar/abrir).
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f14fea9bf3c93797d5161f7440ed418655bc6c57", features = ["wayland", "x11"] }

[dev-dependencies]
# Corpus canónico de fixtures hostiles (`row_label` contra los 25 nombres,
# review encoding GAP). Por path como el resto — este crate excluido no ve el
# alias `.workspace`. Apache/MIT, sin GPU.
norte-testkit = { path = "../norte-testkit" }
