name = "gruvbox-light"

# Light Gruvbox: cream background and the palette's warm YELLOWS/oranges.

[roles]
background       = { bg = "#fbf1c7" }
regular          = { fg = "#3c3836" }
selection           = { fg = "#fbf1c7", bg = "#b57614" }
selection-unfocused = { fg = "#3c3836", bg = "#ebdbb2" }
button              = { fg = "#fbf1c7", bg = "#8f3f71" }
border-focus     = { fg = "#b57614", bold = true }
border-unfocused = { fg = "#a89984", dim = true }
modal-border     = { fg = "#8f3f71" }
status-bar       = { fg = "#fbf1c7", bg = "#b57614" }
title            = { fg = "#af3a03", bold = true }
hostile-badge    = { fg = "#9d0006", bold = true }
error            = { fg = "#9d0006" }
warning          = { fg = "#976311" } # AA over light0: the faded_yellow #b57614 gives 3.33:1
info             = { fg = "#076678" }
match            = { fg = "#fbf1c7", bg = "#b57614" }
pane-background       = { bg = "#f2e5bc" } # light0_soft
pane-focus-background = { bg = "#ebdbb2" } # light1
mark                  = { bg = "#ead9a0" } # gold tint, visibly distinct from light0_soft/light1
stripe                = { bg = "#ece0b6" } # a notch below light0_soft

[files.kind]
dir          = { fg = "#076678", bold = true }
symlink      = { fg = "#427b58" }
executable   = { fg = "#79740e", bold = true }
fifo         = { fg = "#b57614" }
socket       = { fg = "#8f3f71" }
block-device = { fg = "#af3a03" }
char-device  = { fg = "#af3a03" }

[files.ext]
zip  = { fg = "#9d0006" }
tar  = { fg = "#9d0006" }
gz   = { fg = "#9d0006" }
rs   = { fg = "#af3a03" }
toml = { fg = "#b57614" }
md   = { fg = "#3c3836" }
png  = { fg = "#8f3f71" }
jpg  = { fg = "#8f3f71" }
