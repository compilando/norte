name = "vscode-light"

# Light Modern, Visual Studio Code's default light theme since 1.75.
#
# TRANSCRIPTION, with the same sources and the same order as `vscode-dark`:
#
#   1. extensions/theme-defaults/themes/light_modern.json
#   2. its `include`: light_plus.json, and that one's: light_vs.json
#   3. what none of them defines: the editor's color REGISTRY
#      (src/vs/platform/theme/common/colors/)
#
# Light Modern does declare `list.activeSelection*` and `list.hoverBackground` on
# its own; the one that comes from the registry is `list.inactiveSelectionBackground`.
#
# --- Divergences, and here there are THREE, not one ------------------------
#
# All three are the same problem: over a white background, VSCode's signal
# colors do not reach the 4.5:1 that norte's suite requires of `error`, `warning` and
# `hostile-badge` (`semantic_signals_reach_wcag_aa_in_every_preset`).
# They are exactly the colors that must be readable when something has gone wrong, so
# they are darkened and it is noted. Measured against `background` = #ffffff:
#
#   error    #f85149 (light_modern's errorForeground)   gave 3.35:1  → #e51400
#            #e51400 is the registry's light editorError.foreground: 4.75:1,
#            so it is not an invention, it is the other value VSCode already
#            has for the same thing.
#   warning  #bf8803 (light editorWarning.foreground)   gave 3.12:1  → #9a6d00
#            This one is our own darkening of the same hue: 4.60:1.
#   hostile  no id to transcribe                        → #a83a00 (6.4:1)
#
# `muted` is the fourth annotation, and it is not about contrast. Light Modern sets
# `descriptionForeground` to #3b3b3b, which is EXACTLY its `foreground`: a
# "dimmed" text identical to the normal one dims nothing. #616161 is used, which
# light_modern itself attests for inactive foregrounds
# (`activityBar.inactiveForeground`, `tab.inactiveForeground`).
#
# `scrollbar-slider` flattened: the registry gives #646464 at 40 %, which composited
# over the white background is #c1c1c1. The model has no alpha (ADR 0020).
#
# `widget-shadow` is not defined, for the same reason as in `vscode-dark`: a
# shadow is alpha, and without alpha the stylesheet does a better job with its
# own fallback.
#
# `hostile-badge`, `mark`, `[files.kind]` and `[files.ext]`: DERIVED. VSCode does not
# color a file list by node type.
#
# --- Typography -------------------------------------------------------------
#
#   [ui]
#   font_size = 13

[roles]
background            = { bg = "#ffffff" }
regular               = { fg = "#3b3b3b" }
pane-background       = { bg = "#f8f8f8" }
pane-focus-background = { bg = "#ffffff" }
selection             = { fg = "#000000", bg = "#e8e8e8" }
selection-unfocused   = { fg = "#3b3b3b", bg = "#e4e6f1" }
border-focus          = { fg = "#005fb8" }
border-unfocused      = { fg = "#e5e5e5" }
modal-border          = { fg = "#e5e5e5" }
status-bar            = { fg = "#3b3b3b", bg = "#f8f8f8" }
title                 = { fg = "#3b3b3b", bold = true }
button                = { fg = "#ffffff", bg = "#005fb8" }
match                 = { fg = "#000000", bg = "#a8ac94" }
# Darkened relative to the original: see the divergences block.
error                 = { fg = "#e51400" }
warning               = { fg = "#9a6d00" }
hostile-badge         = { fg = "#a83a00", bold = true }
info                  = { fg = "#0063d3" }
mark                  = { bg = "#fff4ce" }
# A notch below `pane-background` and distinct from `hover` (#f2f2f2):
# if equal, the stripe swallowed the "the mouse is here" cue.
stripe                = { bg = "#ececec" }

# Window chrome (spec 2026-09-11, F2).
hover                 = { bg = "#f2f2f2" }
input-background      = { bg = "#ffffff" }
input-border          = { fg = "#cecece" }
widget-background     = { bg = "#f8f8f8" }
badge                 = { fg = "#3b3b3b", bg = "#cccccc" }
scrollbar-slider      = { bg = "#c1c1c1" }
separator             = { fg = "#e5e5e5" }
focus-border          = { fg = "#005fb8" }
muted                 = { fg = "#616161" }

# Derived, all of them.
[files.kind]
dir          = { fg = "#005fb8", bold = true }  # textLink.foreground
symlink      = { fg = "#0598bc" }
executable   = { fg = "#1a7f37", bold = true }
fifo         = { fg = "#9a6d00" }
socket       = { fg = "#8250df" }
block-device = { fg = "#895503" }               # chat.editedFileForeground
char-device  = { fg = "#895503" }

[files.ext]
zip  = { fg = "#e51400" }
tar  = { fg = "#e51400" }
gz   = { fg = "#e51400" }
rs   = { fg = "#895503" }
toml = { fg = "#9a6d00" }
md   = { fg = "#3b3b3b" }
png  = { fg = "#8250df" }
jpg  = { fg = "#8250df" }
