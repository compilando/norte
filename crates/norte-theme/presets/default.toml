name = "default"

# Tema neutro (no ligado a ninguna marca): color discreto sobre fondo oscuro.
# Es el que se aplica cuando `[ui].theme` está ausente.

# Efectos de la ventana (ADR 0036: bloque libre, el terminal lo ignora).
# `backdrop = "blur"` desenfoca lo que hay detrás de un diálogo.
[effects]
backdrop = "blur"

[roles]
background       = { bg = "#1c1c1c" }
regular          = { fg = "#d0d0d0" }
# El cursor con foco lleva el color de acento con texto oscuro: gris sobre gris
# (#3a3a3a sobre #1c1c1c) se perdía. El del panel sin foco conserva ese gris.
selection            = { fg = "#1c1c1c", bg = "#5fafd7" }
selection-unfocused  = { fg = "#ffffff", bg = "#3a3a3a" }
button               = { fg = "#1c1c1c", bg = "#af87d7" }
border-focus     = { fg = "#5fafd7", bold = true }
border-unfocused = { fg = "#6c6c6c", dim = true }
modal-border     = { fg = "#af87d7" }
status-bar       = { fg = "#1c1c1c", bg = "#5fafd7" }
title            = { fg = "#5fafd7", bold = true }
hostile-badge    = { fg = "#d75f5f", bold = true }
error            = { fg = "#d75f5f" }
warning          = { fg = "#d7af5f" }
info             = { fg = "#5fafd7" }
match            = { fg = "#1c1c1c", bg = "#d7af5f" }
pane-background       = { bg = "#1e1e1e" }
pane-focus-background = { bg = "#252526" }
mark                  = { bg = "#3d3315" }

[files.kind]
dir          = { fg = "#5fafd7", bold = true }
symlink      = { fg = "#5fafaf" }
executable   = { fg = "#87af5f", bold = true }
fifo         = { fg = "#d7af5f" }
socket       = { fg = "#af87d7" }
block-device = { fg = "#d7875f" }
char-device  = { fg = "#d7875f" }

[files.ext]
zip  = { fg = "#d75f5f" }
tar  = { fg = "#d75f5f" }
gz   = { fg = "#d75f5f" }
rs   = { fg = "#d7875f" }
toml = { fg = "#d7af5f" }
md   = { fg = "#d0d0d0" }
png  = { fg = "#af87d7" }
jpg  = { fg = "#af87d7" }
