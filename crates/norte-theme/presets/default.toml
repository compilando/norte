name = "default"

# Neutral theme (not tied to any brand): understated color over a dark background.
# It is the one applied when `[ui].theme` is absent.

# Window effects (ADR 0036: free-form block, the terminal ignores it).
# `backdrop = "blur"` blurs what is behind a dialog.
[effects]
backdrop = "blur"

[roles]
background       = { bg = "#1c1c1c" }
regular          = { fg = "#d0d0d0" }
# The focused cursor carries the accent color with dark text: gray on gray
# (#3a3a3a on #1c1c1c) got lost. The unfocused pane's cursor keeps that gray.
selection            = { fg = "#1c1c1c", bg = "#5fafd7" }
selection-unfocused  = { fg = "#ffffff", bg = "#3a3a3a" }
button               = { fg = "#1c1c1c", bg = "#af87d7" }
border-focus     = { fg = "#5fafd7", bold = true }
border-unfocused = { fg = "#6c6c6c", dim = true }
modal-border     = { fg = "#af87d7" }
status-bar       = { fg = "#1c1c1c", bg = "#5fafd7" }
title            = { fg = "#5fafd7", bold = true }
hostile-badge    = { fg = "#d75f5f", bold = true }
error            = { fg = "#d75f5f" }
warning          = { fg = "#d7af5f" }
info             = { fg = "#5fafd7" }
match            = { fg = "#1c1c1c", bg = "#d7af5f" }
pane-background       = { bg = "#1e1e1e" }
pane-focus-background = { bg = "#252526" }
mark                  = { bg = "#3d3315" }
stripe                = { bg = "#232323" }

[files.kind]
dir          = { fg = "#5fafd7", bold = true }
symlink      = { fg = "#5fafaf" }
executable   = { fg = "#87af5f", bold = true }
fifo         = { fg = "#d7af5f" }
socket       = { fg = "#af87d7" }
block-device = { fg = "#d7875f" }
char-device  = { fg = "#d7875f" }

[files.ext]
zip  = { fg = "#d75f5f" }
tar  = { fg = "#d75f5f" }
gz   = { fg = "#d75f5f" }
rs   = { fg = "#d7875f" }
toml = { fg = "#d7af5f" }
md   = { fg = "#d0d0d0" }
png  = { fg = "#af87d7" }
jpg  = { fg = "#af87d7" }
