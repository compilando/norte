name = "vscode-dark"

# Dark Modern, Visual Studio Code's default theme since 1.75.
#
# It is a TRANSCRIPTION, not an imitation by eye. The sources, in the order in
# which each color id is resolved:
#
#   1. extensions/theme-defaults/themes/dark_modern.json
#   2. its `include`: dark_plus.json, and that one's: dark_vs.json
#   3. what none of the three defines: the default values of the editor's color
#      REGISTRY (src/vs/platform/theme/common/colors/), which is
#      where `list.*`, `scrollbarSlider.*` and friends really live.
#
# Point 3 is not a detail: a VSCode theme is NOT a complete palette.
# None of the three files in the chain defines the background of the selected
# row. Whoever copies only the JSON is left without half the window.
#
# --- Where each role comes from ---------------------------------------------
#
#   background            editor.background            (dark_modern)
#   regular               foreground                   (dark_modern)
#   pane-background       sideBar.background           (dark_modern)
#   pane-focus-background editor.background            (dark_modern)
#   selection             list.activeSelection*        (REGISTRY)
#   selection-unfocused   list.inactiveSelectionBackground (REGISTRY)
#   hover                 list.hoverBackground         (REGISTRY)
#   border-focus          focusBorder                  (dark_modern)
#   border-unfocused      panel.border                 (dark_modern)
#   separator             panel.border                 (dark_modern)
#   modal-border          widget.border                (dark_modern)
#   status-bar            statusBar.background/.foreground (dark_modern)
#   title                 sideBarTitle.foreground      (dark_modern)
#   button                button.background/.foreground (dark_modern)
#   badge                 badge.background/.foreground (dark_modern)
#   muted                 descriptionForeground        (dark_modern)
#   input-background      input.background             (dark_modern)
#   input-border          input.border                 (dark_modern)
#   widget-background     editorWidget.background      (dark_modern)
#   focus-border          focusBorder                  (dark_modern)
#   match                 editor.findMatchBackground   (dark_modern)
#   error                 errorForeground              (dark_modern)
#   warning               editorWarning.foreground     (REGISTRY)
#   info                  editorInfo.foreground        (REGISTRY)
#   scrollbar-slider      scrollbarSlider.background   (REGISTRY, flattened)
#
# --- Divergences and omissions, which is what a reader comes looking for ----
#
# `scrollbar-slider` is FLATTENED. The registry gives it as #797979 at 40 %
# opacity, and norte's theme model is 24-bit RGB with no alpha channel
# (ADR 0020). #434343 is that 40 % composited over #1F1F1F, which is the actual
# background it is seen against.
#
# `widget-shadow` is NOT defined, and it is the only one of the twenty-eight missing.
# A shadow is alpha by nature and there is no alpha here: a solid #000000 with
# 16 px of blur weighs much more than the original's rgba(0,0,0,.36). With it
# undefined, the window's stylesheet uses its own translucent
# fallback, which is exactly what is wanted.
#
# `hostile-badge`, `mark`, `[files.kind]` and `[files.ext]` are DERIVED. VSCode
# does not color a file list by node type, so there is no id to
# transcribe. They are derived from colors this theme does attest (textLink,
# editorGutter.*, chat.editedFileForeground) and that is said here instead of
# presenting them as if they came from the original.
#
# --- Typography -------------------------------------------------------------
#
# A theme does NOT carry fonts, on purpose: they are two independent choices.
# VSCode's typographic set is requested from `[ui]` in norte.toml:
#
#   [ui]
#   font_size = 13
#
# `font` and `mono_font` override the bundled ones if you want your own.

[roles]
background            = { bg = "#1f1f1f" }
regular               = { fg = "#cccccc" }
pane-background       = { bg = "#181818" }
pane-focus-background = { bg = "#1f1f1f" }
selection             = { fg = "#ffffff", bg = "#04395e" }
selection-unfocused   = { fg = "#cccccc", bg = "#37373d" }
border-focus          = { fg = "#0078d4" }
border-unfocused      = { fg = "#2b2b2b" }
modal-border          = { fg = "#313131" }
status-bar            = { fg = "#cccccc", bg = "#181818" }
title                 = { fg = "#cccccc", bold = true }
button                = { fg = "#ffffff", bg = "#0078d4" }
match                 = { fg = "#ffffff", bg = "#9e6a03" }
error                 = { fg = "#f85149" }
warning               = { fg = "#cca700" }
info                  = { fg = "#59a4f9" }
# Derived: no VSCode id names a masked file. Strong orange,
# apart from `error`'s red so they are not confused, and at 8.5:1 over the
# background — this is the mark that must be readable when something goes wrong.
hostile-badge         = { fg = "#ffa657", bold = true }
# Derived: the warning amber toned down into a background.
mark                  = { bg = "#4a3b14" }
# ABOVE both pane backgrounds (#181818 and #1f1f1f). Between them the
# stripe read lighter in the unfocused pane and darker in the focused
# one: it flipped when pressing Tab.
stripe                = { bg = "#252525" }

# Window chrome (spec 2026-09-11, F2). The usual eight presets leave them
# unsaid and the stylesheet derives them; this one states them, because for it they are the point.
hover                 = { bg = "#2a2d2e" }
input-background      = { bg = "#313131" }
input-border          = { fg = "#3c3c3c" }
widget-background     = { bg = "#202020" }
badge                 = { fg = "#f8f8f8", bg = "#616161" }
scrollbar-slider      = { bg = "#434343" }
separator             = { fg = "#2b2b2b" }
focus-border          = { fg = "#0078d4" }
muted                 = { fg = "#9d9d9d" }

# Derived, all of them: see the divergences block above.
[files.kind]
dir          = { fg = "#4daafc", bold = true }  # textLink.foreground
symlink      = { fg = "#56b6c2" }
executable   = { fg = "#2ea043", bold = true }  # editorGutter.addedBackground
fifo         = { fg = "#cca700" }               # editorWarning.foreground
socket       = { fg = "#c586c0" }
block-device = { fg = "#e2c08d" }               # chat.editedFileForeground
char-device  = { fg = "#e2c08d" }

[files.ext]
zip  = { fg = "#f85149" }
tar  = { fg = "#f85149" }
gz   = { fg = "#f85149" }
rs   = { fg = "#e2c08d" }
toml = { fg = "#cca700" }
md   = { fg = "#cccccc" }
png  = { fg = "#c586c0" }
jpg  = { fg = "#c586c0" }
