[package]
name = "norte-theme"
description = "Shared theming model: semantic roles, palette and truecolor Color with 256/16 degradation, embedded presets"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
schemars = { workspace = true, optional = true }

[features]
# Derives JsonSchema for the theme model (consumed by the TUI's schema dump).
schema = ["dep:schemars"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
