[package]
name = "norte-vfs-rar"
description = "Read-only VFS provider: RAR delegating to an installed unrar/7z (ADR 0018, product decision 5)"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
thiserror.workspace = true
# `process`: the delegate IS a child process (kill_on_drop, stdin to null).
# `sync`: semaphore bounding concurrent children plus the channel into the ByteStream.
# `time`: the wall deadline that kills a delegate that does not finish.
tokio = { workspace = true, features = ["process", "rt", "sync", "time", "io-util"] }
tokio-util.workspace = true
# Already in the graph (norte-vfs-local, norte-connect): wraps the child's
# receiver as a Stream without writing an `unfold` by hand.
tokio-stream.workspace = true
# warn! for skipped entries (same skip-WITH-a-signal contract as ADR 0018).
tracing.workspace = true
# The child's working directory, created EXCLUSIVELY (ADR 0082 review):
# `create_dir_all` on a pid-derived name succeeds if the directory already
# exists, without checking owner or mode, and `/tmp` is writable by anyone —
# meaning the delegate's cwd could be someone else's directory. `tempfile`
# creates with a random name, `O_EXCL` and 0700, which is exactly what is
# needed. It was already here as a dev-dependency and has been in the graph
# for a while (norte-config, norte-core and others): nothing new enters the
# build (rule 8).
tempfile.workspace = true

[dev-dependencies]
futures.workspace = true
norte-testkit.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
