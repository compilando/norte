[package]
name = "norte-vfs-rar"
description = "Provider VFS read-only: RAR delegando en un unrar/7z instalado (ADR 0018, decisión de producto 5)"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
thiserror.workspace = true
# `process`: el delegado ES un proceso hijo (kill_on_drop, stdin a null).
# `sync`: semáforo que acota hijos concurrentes y canal hacia el ByteStream.
# `time`: el plazo de pared que mata a un delegado que no termina.
tokio = { workspace = true, features = ["process", "rt", "sync", "time", "io-util"] }
tokio-util.workspace = true
# Ya en el grafo (norte-vfs-local, norte-connect): envuelve el receptor del
# hijo como Stream sin escribir un `unfold` a mano.
tokio-stream.workspace = true
# warn! de entradas omitidas (mismo contrato de omitir-CON-señal que ADR 0018).
tracing.workspace = true
# El directorio de trabajo del hijo, creado en EXCLUSIVA (revisión del ADR
# 0082): `create_dir_all` sobre un nombre derivado del pid tiene éxito si el
# directorio ya existe, sin mirar dueño ni modo, y `/tmp` lo escribe cualquiera
# — o sea que el cwd del delegado podía ser un directorio de otro. `tempfile`
# crea con nombre aleatorio, `O_EXCL` y 0700, que es exactamente lo que hace
# falta. Ya estaba aquí como dev-dependency y está en el grafo desde hace
# tiempo (norte-config, norte-core y otros): no entra nada nuevo a compilar
# (regla 8).
tempfile.workspace = true

[dev-dependencies]
futures.workspace = true
norte-testkit.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
