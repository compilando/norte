[package]
name = "norte-config"
description = "Layered configuration for norte (ADR 0007/0035): shared dir resolution, strict norte.toml schema, scalar merge, watch"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
norte-proto.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
schemars = { workspace = true, features = ["derive"], optional = true }
notify = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"], optional = true }
tokio-util = { workspace = true, optional = true }
# The log setup (feature `logging`, #255): the three binaries install it the
# same way and this crate already owns `state_dir()` and the `[log]` keys.
# Behind the feature so a library that only reads `norte.toml` does not
# compile the subscriber. All three are already workspace dependencies.
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# To read back the lines of `[log] format = "json"` (ADR 0127). Already in
# the tree: the format itself brings it in.
serde_json.workspace = true
# To test the secrets gate the REAL WAY. `suppaftp` does not emit `tracing`
# events: it emits `log::trace!`, and the `tracing-log` bridge changes the
# dispatched event's `target` to `"log"`, leaving the real one as a field.
# Tests that used `tracing::trace!(target: "suppaftp", …)` were not exercising
# that path, so a guard placed on `meta.target()` in the sink would have
# looked correct and done nothing. Both are already in the tree (`suppaftp`
# uses `log`; `tracing-log` is a default feature of `tracing-subscriber`), so
# this adds no new dependency to the binary.
log = "0.4"
tracing-log = "0.2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[[test]]
name = "watch"
required-features = ["watch"]

[features]
# JSON Schema generation for docs/schema goldens (ADR 0007).
schema = ["dep:schemars"]
# Live config watching (notify + polling fallback). Frontends enable it;
# core/CLI do not need it.
watch = ["dep:notify", "dep:tokio", "dep:tokio-util"]
# Tracing setup for the binaries (#255). Enabled by the CLI, the daemon, the
# terminal and the window; nobody else.
logging = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender"]

[lints]
workspace = true
