[package]
name = "norte-config"
description = "Layered configuration for norte (ADR 0007/0035): shared dir resolution, strict norte.toml schema, scalar merge, watch"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
norte-proto.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
schemars = { workspace = true, features = ["derive"], optional = true }
notify = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"], optional = true }
tokio-util = { workspace = true, optional = true }
# El montaje del log (feature `logging`, #255): los tres binarios lo instalan
# igual y este crate ya es dueño de `state_dir()` y de las claves `[log]`.
# Tras la feature para que una biblioteca que solo lee `norte.toml` no
# compile el subscriber. Las tres ya son dependencias del workspace.
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# Para leer de vuelta las líneas de `[log] format = "json"` (ADR 0127). Ya está
# en el árbol: lo trae el propio formato.
serde_json.workspace = true
# Para probar la cota de secretos POR EL CAMINO REAL. `suppaftp` no emite
# eventos de `tracing`: emite `log::trace!`, y el puente `tracing-log` cambia el
# `target` del evento despachado a `"log"`, dejando el verdadero como campo. Los
# tests que usaban `tracing::trace!(target: "suppaftp", …)` no probaban ese
# camino, así que una defensa puesta sobre `meta.target()` en el sumidero
# habría parecido correcta y no habría hecho nada. Las dos ya están en el árbol
# (`suppaftp` usa `log`; `tracing-log` es feature por defecto de
# `tracing-subscriber`), así que esto no añade dependencia nueva al binario.
log = "0.4"
tracing-log = "0.2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[[test]]
name = "watch"
required-features = ["watch"]

[features]
# JSON Schema generation for docs/schema goldens (ADR 0007).
schema = ["dep:schemars"]
# Live config watching (notify + polling fallback). Frontends enable it;
# core/CLI do not need it.
watch = ["dep:notify", "dep:tokio", "dep:tokio-util"]
# Montaje de tracing para los binarios (#255). Lo activan la CLI, el daemon,
# el terminal y la ventana; nadie más.
logging = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender"]

[lints]
workspace = true
