[package]
name = "norte-compare"
description = "Directory comparison engine for norte: pairing, the criterion cascade, and streamed rows"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# `Stream` + `StreamExt`: the walk PRODUCES a stream of rows and CONSUMES the
# two providers' `EntryStream`s. Already a dependency of norte-vfs.
futures.workspace = true
# The pairing key (ADR 0051, #151): shared with `norte-core::rename::plan`,
# relicensed MIT/Apache because it is a pure-text primitive and both
# consumers already depended on this crate.
norte-encoding.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
# The expensive rung: streaming sha256. ALREADY in the workspace (norte-core,
# norte-index, norte-plugin-host), so hard rule 8 needs no justification.
sha2.workspace = true
# Typed library errors (hard rule 6).
thiserror.workspace = true
# `CancellationToken`: the SAME type norte-core's scheduler assembles for
# every Task (hard rule 3). Bringing it in here keeps the engine from
# inventing a second cancellation mechanism C6 would have to bridge.
tokio-util.workspace = true
# ALREADY in the workspace (norte-frontend, norte-core, norte-vfs-local,
# norte-testkit): not a new dependency, so hard rule 8 needs no
# justification.
unicode-normalization.workspace = true

[dev-dependencies]
# The boundary test's LYING provider: implements `Provider`, which is an
# `#[async_trait]` trait. Tests only — the engine does not need it.
async-trait.workspace = true
bytes.workspace = true
norte-testkit.workspace = true
# The test that demands `Unknown` from a provider that TRULY cannot answer: a
# real tar indexed by the archive provider, not a mock told what to answer.
norte-vfs-archive.workspace = true
# THE provider people use, and the only one in this tree that does NOT fill
# in `size`/`mtime_ms` in its listing (#52, lazy stat). Without it in the
# suite, on-demand hydration is only tested against providers that already
# bring the fields — which is exactly how C7b's bug passed C2-C5 green.
norte-vfs-local.workspace = true
# The two real directories that test compares against. Already a
# dev-dependency of twelve workspace crates (hard rule 8 needs no
# justification).
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
