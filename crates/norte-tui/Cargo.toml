[package]
name = "norte-tui"
description = "Frontend TUI de norte: dual-pane ortodoxo sobre el core embebido"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

# El binario se llama `ntc` (norte commander): es lo que se teclea a diario y
# nadie escribe `norte-tui` dos veces al día. El CRATE conserva su nombre —
# renombrarlo arrastraría los manifiestos de sus dependientes y la identidad en
# crates.io sin comprar nada, porque un nombre de crate no se teclea.
[[bin]]
name = "ntc"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
futures.workspace = true
mlua.workspace = true
norte-config = { workspace = true, features = ["watch"] }
norte-core.workspace = true
norte-encoding.workspace = true
norte-frontend.workspace = true
# H3b: the binary now links the corpus — F1 paints it.
norte-help.workspace = true
norte-i18n.workspace = true
norte-proto.workspace = true
norte-theme.workspace = true
norte-vfs-local.workspace = true
notify.workspace = true
schemars = { workspace = true, features = ["derive"], optional = true }
serde.workspace = true
thiserror.workspace = true
ratatui.workspace = true
sha2.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util.workspace = true
# Revisión S I1: `tracing::error!` para el brazo de defensa en profundidad
# de `persist_setting` (la tarea de fondo de una escritura de ajustes se
# canceló/panicó — nunca observado, la única causa de panic conocida ya se
# arregló en `persist_set`). Ya es dependencia de workspace (`norte-core` y
# otros la usan); extenderla a este binario no añade una dependencia NUEVA
# al árbol, solo la enlaza aquí también.
tracing.workspace = true
# `toml_edit::Value` es el tipo de `norte_config::persist_set` (S2, escritor
# GENÉRICO detrás del overlay de ajustes, S3): el TUI construye el valor
# tipado (bool/int/string nativos) antes de llamarlo.
toml_edit.workspace = true
# Ancho de CELDA de terminal para la elipsis media (#79): CJK/emoji ocupan 2
# columnas y presupuestar por chars desborda el ancho → ratatui recorta por la
# derecha comiéndose la cola. `unicode-width` es la herramienta estándar (la
# usa la propia ratatui, misma versión ya en el árbol), MIT/Apache, mantenida.
unicode-width = "0.2"

[dev-dependencies]
bytes.workspace = true
criterion.workspace = true
insta.workspace = true
norte-i18n.workspace = true
norte-testkit.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
norte-vfs.workspace = true
# test-util: `start_paused` en los tests con timers (deterministas, sin
# carreras de wall-clock). Solo dev — no entra en el binario.
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "presupuestos"
harness = false

[features]
# Generación de los JSON Schema publicados (golden test de docs/schema);
# fuera del binario final (ADR 0007). `KeymapFile` vive en `norte-frontend`
# desde GUI-c T2 — su derive `JsonSchema` está tras la MISMA feature ahí, así
# que hay que reenviarla o `schema_for!` no compila.
schema = ["dep:schemars", "norte-config/schema", "norte-frontend/schema"]

[[test]]
name = "schema"
required-features = ["schema"]

[lints]
workspace = true
