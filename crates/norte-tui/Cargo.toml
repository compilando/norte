[package]
name = "norte-tui"
description = "Frontend TUI de norte: dual-pane ortodoxo sobre el core embebido"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

# El binario se llama `ntc` (norte commander): es lo que se teclea a diario y
# nadie escribe `norte-tui` dos veces al día. El CRATE conserva su nombre —
# renombrarlo arrastraría los manifiestos de sus dependientes y la identidad en
# crates.io sin comprar nada, porque un nombre de crate no se teclea.
[[bin]]
name = "ntc"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# El cuerpo OPACO de la sesión de UI (L2) cruza el wire como
# `serde_json::Value`: este crate lo captura y lo aplica, así que necesita el
# tipo. Ya estaba aquí como dev-dependency y en el grafo vía norte-proto —
# nada nuevo entra a compilar (regla 8).
serde_json.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
futures.workspace = true
mlua.workspace = true
norte-config = { workspace = true, features = ["watch", "logging"] }
norte-core.workspace = true
norte-encoding.workspace = true
norte-frontend.workspace = true
# H3b: the binary now links the corpus — F1 paints it.
norte-help.workspace = true
norte-i18n.workspace = true
norte-proto.workspace = true
norte-theme.workspace = true
norte-vfs-local.workspace = true
schemars = { workspace = true, features = ["derive"], optional = true }
serde.workspace = true
thiserror.workspace = true
ratatui.workspace = true
sha2.workspace = true
toml.workspace = true
# `signal` (S4, #135): al suspender la TUI se apaga el raw mode, lo que
# devuelve `ISIG` a la terminal — y el hijo se queda en el grupo de procesos
# de norte, que es el del primer plano. Sin un manejador registrado, el Ctrl+C
# con el que cualquiera aborta un `make` mataría también a norte (paneles,
# tablero de tasks y el write del `--cd-file` incluidos). Registrar el
# manejador hace que norte sobreviva mientras el hijo, cuyas disposiciones
# `exec` devolvió a `SIG_DFL`, sí muere: exactamente lo que el usuario espera.
# No es una dependencia nueva, es una feature de una que ya estaba.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-util.workspace = true
# Revisión S I1: `tracing::error!` para el brazo de defensa en profundidad
# de `persist_setting` (la tarea de fondo de una escritura de ajustes se
# canceló/panicó — nunca observado, la única causa de panic conocida ya se
# arregló en `persist_set`). Ya es dependencia de workspace (`norte-core` y
# otros la usan); extenderla a este binario no añade una dependencia NUEVA
# al árbol, solo la enlaza aquí también.
tracing.workspace = true
# `toml_edit::Value` es el tipo de `norte_config::persist_set` (S2, escritor
# GENÉRICO detrás del overlay de ajustes, S3): el TUI construye el valor
# tipado (bool/int/string nativos) antes de llamarlo.
toml_edit.workspace = true
# Ancho de CELDA de terminal para la elipsis media (#79): CJK/emoji ocupan 2
# columnas y presupuestar por chars desborda el ancho → ratatui recorta por la
# derecha comiéndose la cola. `unicode-width` es la herramienta estándar (la
# usa la propia ratatui, misma versión ya en el árbol), MIT/Apache, mantenida.
unicode-width = "0.2"
# El SUBSHELL persistente de #142 necesita un pty de verdad: un shell
# interactivo detrás de los paneles no puede vivir en una tubería —sin tty no
# hay job control, ni prompt, ni line editing, y `bash` se pone en modo no
# interactivo—. norte-tui no puede abrirlo a mano: `openpty`/`forkpty` son
# `unsafe`, y la regla 5 reserva el `unsafe` para `norte-vfs-local`.
#
# `portable-pty` (wezterm, MIT) es la envoltura segura estándar: la usa el
# propio wezterm, está mantenida, y `default-features = false` deja fuera
# serde. Alternativas descartadas: `pty-process` (menos usada, y su API async
# no compra nada aquí porque el bucle de adjuntar es de bloqueo por diseño) y
# `nix` a pelo (volvería a poner `unsafe` en un frontend).
#
# Lo que ARRASTRA, que es la mitad de la regla 8 y no estaba dicho: `nix 0.28`
# (un SEGUNDO `nix` en el árbol), `bitflags 1.3` (una segunda rama mayor),
# `cfg_aliases`, `downcast-rs`, `shell-words`, `winreg 0.10` (solo Windows) y
# `serial2` — sí, soporte de puerto serie en un gestor de ficheros:
# `default-features = false` NO lo quita, es incondicional en portable-pty.
# Siete cajas por un `openpty` seguro es caro y se acepta a sabiendas: la
# alternativa era `unsafe` en un frontend, que la regla 5 prohíbe. Si algún día
# el pty se comparte con la ventana, este es el sitio donde reconsiderarlo.
portable-pty = { version = "0.9.0", default-features = false }

[dev-dependencies]
bytes.workspace = true
criterion.workspace = true
insta.workspace = true
norte-i18n.workspace = true
norte-testkit.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
norte-vfs.workspace = true
# test-util: `start_paused` en los tests con timers (deterministas, sin
# carreras de wall-clock). Solo dev — no entra en el binario.
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "presupuestos"
harness = false

[features]
# Generación de los JSON Schema publicados (golden test de docs/schema);
# fuera del binario final (ADR 0007). `KeymapFile` vive en `norte-frontend`
# desde GUI-c T2 — su derive `JsonSchema` está tras la MISMA feature ahí, así
# que hay que reenviarla o `schema_for!` no compila.
schema = ["dep:schemars", "norte-config/schema", "norte-frontend/schema"]

[[test]]
name = "schema"
required-features = ["schema"]

[lints]
workspace = true
