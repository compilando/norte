[package]
name = "norte-tui"
description = "TUI frontend for norte: an orthodox dual-pane view over the embedded core"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

# The binary is called `ntc` (norte commander): that is what gets typed daily
# and nobody types `norte-tui` twice a day. The CRATE keeps its name —
# renaming it would drag along its dependents' manifests and its identity on
# crates.io without buying anything, because a crate name is not typed.
[[bin]]
name = "ntc"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# The OPAQUE body of the UI session (L2) crosses the wire as
# `serde_json::Value`: this crate captures and applies it, so it needs the
# type. It was already here as a dev-dependency and in the graph via
# norte-proto — nothing new enters the compile (rule 8).
serde_json.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
futures.workspace = true
mlua.workspace = true
norte-config = { workspace = true, features = ["watch", "logging"] }
norte-core.workspace = true
norte-encoding.workspace = true
norte-frontend.workspace = true
# H3b: the binary now links the corpus — F1 paints it.
norte-help.workspace = true
norte-i18n.workspace = true
norte-proto.workspace = true
# The terminal panel's grid (#362). It is homegrown and drags in nothing
# new: its only external dependency is `vte`, justified in its own Cargo.toml.
norte-term = { workspace = true, features = ["pty"] }
norte-theme.workspace = true
norte-vfs-local.workspace = true
schemars = { workspace = true, features = ["derive"], optional = true }
serde.workspace = true
thiserror.workspace = true
ratatui.workspace = true
sha2.workspace = true
toml.workspace = true
# `signal` (S4, #135): suspending the TUI turns off raw mode, which returns
# `ISIG` to the terminal — and the child stays in norte's process group,
# which is the foreground one. Without a registered handler, the Ctrl+C that
# aborts a `make` would also kill norte (panes, the tasks board and the
# `--cd-file` write included). Registering the handler makes norte survive
# while the child, whose `exec` dispositions were returned to `SIG_DFL`, does
# die: exactly what the user expects.
# Not a new dependency, it is a feature of one that was already there.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-util.workspace = true
# S I1 review: `tracing::error!` for the defense-in-depth arm of
# `persist_setting` (the background task of a settings write got
# cancelled/panicked — never observed, the only known panic cause was already
# fixed in `persist_set`). It is already a workspace dependency (`norte-core`
# and others use it); extending it to this binary does not add a NEW
# dependency to the tree, it just links it here too.
tracing.workspace = true
# `toml_edit::Value` is the type of `norte_config::persist_set` (S2, the
# GENERIC writer behind the settings overlay, S3): the TUI builds the typed
# value (native bool/int/string) before calling it.
toml_edit.workspace = true
# Terminal CELL width for the middle ellipsis (#79): CJK/emoji take up 2
# columns and budgeting by chars overflows the width → ratatui trims from
# the right, eating the tail. `unicode-width` is the standard tool (ratatui
# itself uses it, same version already in the tree), MIT/Apache, maintained.
unicode-width = "0.2"
# #325: what is typed in the password dialog is a secret, and a plain
# `String` leaves its content on the heap after the drop —where it ends up
# in a core dump or in swap. `Zeroizing<String>` erases it on release. Not a
# new dependency in the tree: `norte-connect` already uses it for the same
# type (`Secret`), and it is the ecosystem's standard tool (RustCrypto).
zeroize.workspace = true
# #142's persistent SUBSHELL needs a real pty: an interactive shell behind
# the panes cannot live in a pipe —without a tty there is no job control, no
# prompt, no line editing, and `bash` switches to non-interactive mode—.
# norte-tui cannot open it by hand: `openpty`/`forkpty` are `unsafe`, and
# rule 5 reserves `unsafe` for `norte-vfs-local`.
#
# `portable-pty` (wezterm, MIT) is the standard safe wrapper: wezterm itself
# uses it, it is maintained, and `default-features = false` leaves out
# serde. Alternatives discarded: `pty-process` (less used, and its async API
# buys nothing here because the attach loop is blocking by design) and bare
# `nix` (would put `unsafe` back in a frontend).
#
# What it DRAGS IN, which is half of rule 8 and was left unsaid: `nix 0.28`
# (a SECOND `nix` in the tree), `bitflags 1.3` (a second major branch),
# `cfg_aliases`, `downcast-rs`, `shell-words`, `winreg 0.10` (Windows only)
# and `serial2` — yes, serial port support in a file manager:
# `default-features = false` does NOT remove it, it is unconditional in
# portable-pty. Seven crates for a safe `openpty` is expensive and accepted
# knowingly: the alternative was `unsafe` in a frontend, which rule 5
# forbids. If the pty is ever shared with the window, this is the place to
# reconsider it.
portable-pty = { version = "0.9.0", default-features = false }
# The kitty graphics protocol (T4, phase 5 WOW) sends the thumbnail as
# base64 inside the APC (`kitty_graphics::escape_colocar`). Not a new
# dependency in the tree: `norte-proto` and `norte-frontend` (`osc52`)
# already use it for the same thing —arbitrary bytes, base64 on the
# channel—, it is just linked here too.
base64.workspace = true

[dev-dependencies]
# A test `Provider` that returns `SecretNeeded`: it is the answer a remote
# gives on reopening when the previous daemon took the secret with it, and
# there is no way to inject it with `norte-testkit`'s faults —which fail
# with `Io` and with `PermissionDenied`, not with this one—. Dev only, and
# already in the graph: the `Provider` being implemented belongs to
# `norte-vfs`, which uses it to declare it.
async-trait.workspace = true
bytes.workspace = true
criterion.workspace = true
insta.workspace = true
norte-i18n.workspace = true
norte-testkit.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
norte-vfs.workspace = true
# test-util: `start_paused` in the tests with timers (deterministic, no
# wall-clock races). Dev only — does not enter the binary.
tokio = { workspace = true, features = ["test-util"] }
# The log panel (#323, #328) is tested by filling the ring through its REAL
# path —the `tracing` layer that feeds it—, and not with a public `push`. A
# public `push` would bypass the filter where the `suppaftp` cap lives
# (which logs `PASS <password>` at TRACE level), and that cap is not
# negotiable. It is the same dependency, for the same reason, as in
# `norte-ui-host`.
tracing-subscriber.workspace = true

[[bench]]
name = "budgets"
harness = false

[features]
# Generation of the published JSON Schemas (docs/schema golden test);
# outside the final binary (ADR 0007). `KeymapFile` has lived in
# `norte-frontend` since GUI-c T2 — its `JsonSchema` derive is behind the
# SAME feature there, so it has to be forwarded or `schema_for!` will not
# compile.
schema = ["dep:schemars", "norte-config/schema", "norte-frontend/schema"]

[[test]]
name = "schema"
required-features = ["schema"]

[lints]
workspace = true
