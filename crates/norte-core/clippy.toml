# ADR 0127: `spawn_blocking` does not inherit the span, and whatever gets
# logged inside the closure comes out without its `task` or its `rpc`. The
# gate is `crate::blocking::spawn_blocking`, which preserves it.
#
# Clippy does NOT merge configs: it uses the first clippy.toml it finds
# walking up from the crate. If one ever exists at the root, its rules have to
# be copied here and into crates/norte-vfs-archive/clippy.toml, or they won't
# apply.
disallowed-methods = [
    { path = "tokio::task::spawn_blocking", reason = "loses the span; use crate::blocking::spawn_blocking (ADR 0127)" },
    { path = "tokio::runtime::Handle::spawn_blocking", reason = "loses the span; use crate::blocking::spawn_blocking (ADR 0127)" },
]
