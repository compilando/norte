[package]
name = "norte-core"
description = "Núcleo de norte: scheduler de tasks, copy engine, sesiones"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# fs.read del daemon devuelve bytes en base64 (JSON no lleva bytes crudos).
base64.workspace = true
futures.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
# El daemon (ADR 0011) serializa el dispatch JSON-RPC; mismo encoding que proto.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
bytes.workspace = true
norte-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
