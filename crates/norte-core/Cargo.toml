[package]
name = "norte-core"
description = "Núcleo de norte: scheduler de tasks, copy engine, sesiones"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Providers de la cadena de salida = crates core (ADR 0010): el connection
# manager de fase 6e (ADR 0015 A) resuelve connections.toml + secreto vía
# norte-connect y construye SftpProvider/FtpProvider con la sesión inyectada.
# El trait de conexión se implementa aquí; los providers jamás ven un secreto.
async-trait.workspace = true
# fs.read del daemon devuelve bytes en base64 (JSON no lleva bytes crudos).
base64.workspace = true
# Chunks del ByteStream que reensambla PluginProvider (#30).
bytes.workspace = true
futures.workspace = true
# El motor de `fs.compare` (plan 2026-08-11): función pura de dos providers,
# sin daemon ni scheduler. El core le pone la Task, el gate y el lote — la
# comparación en sí no conoce ninguna de las tres cosas.
norte-compare.workspace = true
# El PLANIFICADOR de sincronización (plan 2026-08-11, ADR 0049): transductor
# puro de filas de comparación a pasos de plan, sin daemon ni provider. El core
# le pone la Task, el spool que retiene el plan aprobado y el ejecutor — el
# plan en sí no conoce ninguna de las tres cosas. Mismo reparto que
# norte-compare.
norte-sync.workspace = true
norte-config.workspace = true
norte-connect.workspace = true
# Modelo de plugins (M4-P3): catálogo + manifiesto que el PluginRegistry expone.
norte-plugin-host.workspace = true
# H3e: el host ACOTA el `help.md` de un plugin con el MISMO tope y la misma
# detección de encoding que el parser hostil del frontend. La alternativa era
# repetir el corte aquí, y dos topes que empiezan iguales no siguen iguales.
norte-help.workspace = true
norte-proto.workspace = true
# Matchers de fs.search (M4 live search): detección/decodificación de encoding
# de la aguja (transcodificación multi-encoding) y NFC del nombre.
norte-encoding.workspace = true
norte-vfs.workspace = true
norte-vfs-archive.workspace = true
norte-ai.workspace = true
norte-index.workspace = true
norte-vfs-object.workspace = true
norte-vfs-sftp.workspace = true
# volumes (plan 2026-08-10): `vpath_from_native` is the ONE function that
# turns a native path into a `file://` VPath, and it already lives here (rule
# 1: a host service does not get to re-derive the local scheme's
# segment/authority rules a second time). Same precedent as norte-frontend's
# `shell.rs`/`openers.rs` (the reverse direction, `vpath_to_native`). Already
# in the workspace graph as norte-core's own dev-dependency until now;
# promoted here because `volumes::linux` needs it outside tests too.
norte-vfs-local.workspace = true
# El daemon (ADR 0011) serializa el dispatch JSON-RPC; mismo encoding que proto.
serde.workspace = true
serde_json.workspace = true
# Journal transaccional (M3-1, ADR 0023): storage + hash-chain.
sha2.workspace = true
hmac.workspace = true
sqlx.workspace = true
thiserror.workspace = true
# Matchers puros de fs.search (M4 live search, ver justificación en el
# Cargo.toml del workspace): glob/regex de nombre + aguja multi-encoding.
regex.workspace = true
globset.workspace = true
memchr.workspace = true
# NFC del fold de nombre (misma disciplina que el quick search del TUI).
unicode-normalization.workspace = true
# Reglas declarativas de policy.toml (M3-3, spec §10): parsing con deny_unknown_fields.
toml.workspace = true
# Persistencia de plugins-state.toml (M4-P3): re-emisión preservando el fichero.
toml_edit.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Appender rotatorio del log local (roadmap ítem 9). Es del proyecto tokio y es
# el appender alrededor del que `tracing-subscriber` está diseñado; la
# alternativa es escribir a mano la rotación, el nombrado de los ficheros, la
# poda por retención y el guard del writer no bloqueante — más código que la
# propia feature, y en el camino que tiene que funcionar cuando todo lo demás
# ya ha fallado (regla 8).
tracing-appender.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# volumes::linux (plan 2026-08-10): `statvfs`. See the workspace Cargo.toml
# for why rustix and not libc (rule 5 forbids `unsafe` outside
# norte-vfs-local; rustix wraps the syscall safely).
rustix.workspace = true

[dev-dependencies]
# FakeEmbed determinista para los tests de index.embed (M4-IA-2). La feature
# `testutil` solo se activa en tests: el build normal no la ve.
norte-ai = { workspace = true, features = ["testutil"] }
# Servidores SSH y FTP in-process para el test de integración del connection
# manager (mismo arnés que norte-connect; sin Docker).
libunftp.workspace = true
# El planificador de rename por lotes es puro: la propiedad «todo plan
# ejecutable aterriza exactamente los destinos pedidos» se comprueba generando
# permutaciones, no enumerándolas a mano. Ya es dep del workspace.
proptest.workspace = true
rand.workspace = true
russh.workspace = true
russh-sftp.workspace = true
tempfile.workspace = true
# Fixtures de connections.toml en los tests del connection manager.
toml.workspace = true
unftp-sbe-fs.workspace = true
bytes.workspace = true
norte-testkit.workspace = true
# E2E del criterio de salida M2 (fase 10b): object-fs como remoto S3 stand-in.
opendal = { workspace = true, features = ["services-fs"] }
# Benchmarks del copy engine cross-provider (fase 10c).
criterion.workspace = true
# gzip de fixtures .tar.gz para el E2E del engine (#55) — mismo backend
# (zlib-rs) que la dep directa de norte-vfs-archive, sin duplicar backend.
flate2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[[bench]]
name = "copy_remoto"
harness = false

[lints]
workspace = true
