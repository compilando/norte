[package]
name = "norte-core"
description = "norte's core: task scheduler, copy engine, sessions"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

# `testing`: exposes doors that an e2e needs and an embedder must NOT have
# (#241). `run_column_values_for_test` mints a location token with whatever
# `climb` it's given, and `climb` belongs only to the human actor — in the
# published library that would be a minting path with no policy. Integration
# tests are separate crates, so `cfg(test)` isn't enough: a feature is needed,
# and the gate turns it on (`features` in the justfile).
[features]
testing = []

[dependencies]
# Output-chain providers = core crates (ADR 0010): the phase-6e connection
# manager (ADR 0015 A) resolves connections.toml + secret via norte-connect
# and builds SftpProvider/FtpProvider with the session injected. The
# connection trait is implemented here; providers never see a secret.
async-trait.workspace = true
# The daemon's fs.read returns bytes as base64 (JSON carries no raw bytes).
base64.workspace = true
# Chunks of the ByteStream that PluginProvider reassembles (#30).
bytes.workspace = true
futures.workspace = true
# The `fs.compare` engine (plan 2026-08-11): a pure function of two
# providers, with no daemon or scheduler. The core wraps it with the Task,
# the gate and the batch — the comparison itself knows none of those three
# things.
# The daemon's CLIENT side (ADR 0066): the core USES it for its
# `Backend::Remote`, but the SDK must not see it — its boundary test watches
# for that.
norte-client.workspace = true
norte-compare.workspace = true
# The sync PLANNER (plan 2026-08-11, ADR 0049): a pure transducer from
# comparison rows to plan steps, with no daemon or provider. The core wraps
# it with the Task, the spool that holds the approved plan, and the
# executor — the plan itself knows none of those three things. Same split as
# norte-compare.
norte-sync.workspace = true
norte-config = { workspace = true, features = ["logging"] }
norte-connect.workspace = true
# Plugin model (M4-P3): the catalog + manifest that PluginRegistry exposes.
norte-plugin-host.workspace = true
# H3e: the host CAPS a plugin's `help.md` with the SAME limit and the same
# encoding detection as the frontend's hostile parser. The alternative was
# repeating the cutoff here, and two limits that start out equal don't stay
# equal.
norte-help.workspace = true
norte-proto.workspace = true
# fs.search matchers (M4 live search): needle encoding detection/decoding
# (multi-encoding transcoding) and name NFC.
norte-encoding.workspace = true
norte-vfs.workspace = true
norte-vfs-archive.workspace = true
norte-ai.workspace = true
norte-index.workspace = true
norte-vfs-object.workspace = true
norte-vfs-sftp.workspace = true
# volumes (plan 2026-08-10): `vpath_from_native` is the ONE function that
# turns a native path into a `file://` VPath, and it already lives here (rule
# 1: a host service does not get to re-derive the local scheme's
# segment/authority rules a second time). Same precedent as norte-frontend's
# `shell.rs`/`openers.rs` (the reverse direction, `vpath_to_native`). Already
# in the workspace graph as norte-core's own dev-dependency until now;
# promoted here because `volumes::linux` needs it outside tests too.
norte-vfs-local.workspace = true
# Location tokens (ADR 0057): 32 bytes from the system CSPRNG. Already a
# workspace dep (norte-connect uses it for `secrets.age` nonces).
getrandom.workspace = true
# Roadmap item 11: the RAR provider, which the dispatch composes ONLY over a
# local `file://` (the delegate needs a real path).
norte-vfs-rar.workspace = true
# The daemon (ADR 0011) serializes the JSON-RPC dispatch; same encoding as proto.
serde.workspace = true
serde_json.workspace = true
# Transactional journal (M3-1, ADR 0023): storage + hash chain.
sha2.workspace = true
hmac.workspace = true
sqlx.workspace = true
thiserror.workspace = true
# Pure fs.search matchers (M4 live search, see the justification in the
# workspace Cargo.toml): name glob/regex + multi-encoding needle.
regex.workspace = true
globset.workspace = true
memchr.workspace = true
# NFC of the name fold (same discipline as the TUI's quick search).
unicode-normalization.workspace = true
# Declarative policy.toml rules (M3-3, spec §10): parsing with deny_unknown_fields.
toml.workspace = true
# plugins-state.toml persistence (M4-P3): re-emission that preserves the file.
toml_edit.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Rotating appender for the local log (roadmap item 9). It's from the tokio
# project and is the appender `tracing-subscriber` is designed around; the
# alternative is hand-writing rotation, file naming, retention pruning, and
# the non-blocking writer's guard — more code than the feature itself, and on
# the path that has to work when everything else already failed (rule 8).
tracing-appender.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# volumes::linux (plan 2026-08-10): `statvfs`. See the workspace Cargo.toml
# for why rustix and not libc (rule 5 forbids `unsafe` outside
# norte-vfs-local; rustix wraps the syscall safely).
rustix.workspace = true

[dev-dependencies]
# Deterministic FakeEmbed for the index.embed tests (M4-IA-2). The `testutil`
# feature only activates in tests: the normal build never sees it.
norte-ai = { workspace = true, features = ["testutil"] }
# In-process SSH and FTP servers for the connection manager's integration
# test (same harness as norte-connect; no Docker).
libunftp.workspace = true
# The batch rename planner is pure: the property "every executable plan lands
# exactly the requested destinations" is checked by generating permutations,
# not enumerating them by hand. Already a workspace dep.
proptest.workspace = true
rand.workspace = true
russh.workspace = true
russh-sftp.workspace = true
tempfile.workspace = true
# connections.toml fixtures in the connection manager's tests.
toml.workspace = true
unftp-sbe-fs.workspace = true
bytes.workspace = true
norte-testkit.workspace = true
# E2E for the M2 exit criterion (phase 10b): object-fs as an S3 remote stand-in.
opendal = { workspace = true, features = ["services-fs"] }
# Cross-provider copy engine benchmarks (phase 10c).
criterion.workspace = true
# gzip for .tar.gz fixtures in the engine's E2E (#55) — same backend
# (zlib-rs) as norte-vfs-archive's direct dep, so the backend isn't duplicated.
flate2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[[bench]]
name = "copy_remote"
harness = false

[lints]
workspace = true
