[package]
name = "norte-core"
description = "Núcleo de norte: scheduler de tasks, copy engine, sesiones"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Providers de la cadena de salida = crates core (ADR 0010): el connection
# manager de fase 6e (ADR 0015 A) resuelve connections.toml + secreto vía
# norte-connect y construye SftpProvider/FtpProvider con la sesión inyectada.
# El trait de conexión se implementa aquí; los providers jamás ven un secreto.
async-trait.workspace = true
# fs.read del daemon devuelve bytes en base64 (JSON no lleva bytes crudos).
base64.workspace = true
futures.workspace = true
norte-connect.workspace = true
norte-proto.workspace = true
norte-vfs.workspace = true
norte-vfs-archive.workspace = true
norte-vfs-ftp.workspace = true
norte-vfs-object.workspace = true
norte-vfs-sftp.workspace = true
# El daemon (ADR 0011) serializa el dispatch JSON-RPC; mismo encoding que proto.
serde.workspace = true
serde_json.workspace = true
# Journal transaccional (M3-1, ADR 0020): storage + hash-chain.
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Servidores SSH y FTP in-process para el test de integración del connection
# manager (mismo arnés que norte-connect; sin Docker).
libunftp.workspace = true
rand.workspace = true
russh.workspace = true
russh-sftp.workspace = true
tempfile.workspace = true
# Fixtures de connections.toml en los tests del connection manager.
toml.workspace = true
unftp-sbe-fs.workspace = true
bytes.workspace = true
norte-testkit.workspace = true
# Provider local real para el test de despacho de Engine::gc_partials (#11).
norte-vfs-local.workspace = true
# E2E del criterio de salida M2 (fase 10b): object-fs como remoto S3 stand-in.
opendal = { workspace = true, features = ["services-fs"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
