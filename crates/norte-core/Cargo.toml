[package]
name = "norte-core"
description = "Núcleo de norte: scheduler de tasks, copy engine, sesiones"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Providers de la cadena de salida = crates core (ADR 0010): el connection
# manager de fase 6e (ADR 0015 A) resuelve connections.toml + secreto vía
# norte-connect y construye SftpProvider/FtpProvider con la sesión inyectada.
# El trait de conexión se implementa aquí; los providers jamás ven un secreto.
async-trait.workspace = true
# fs.read del daemon devuelve bytes en base64 (JSON no lleva bytes crudos).
base64.workspace = true
# Chunks del ByteStream que reensambla PluginProvider (#30).
bytes.workspace = true
futures.workspace = true
norte-connect.workspace = true
# Modelo de plugins (M4-P3): catálogo + manifiesto que el PluginRegistry expone.
norte-plugin-host.workspace = true
norte-proto.workspace = true
# Matchers de fs.search (M4 live search): detección/decodificación de encoding
# de la aguja (transcodificación multi-encoding) y NFC del nombre.
norte-encoding.workspace = true
norte-vfs.workspace = true
norte-vfs-archive.workspace = true
norte-ai.workspace = true
norte-vfs-ftp.workspace = true
norte-vfs-object.workspace = true
norte-vfs-sftp.workspace = true
# El daemon (ADR 0011) serializa el dispatch JSON-RPC; mismo encoding que proto.
serde.workspace = true
serde_json.workspace = true
# Journal transaccional (M3-1, ADR 0023): storage + hash-chain.
sha2.workspace = true
hmac.workspace = true
sqlx.workspace = true
thiserror.workspace = true
# Matchers puros de fs.search (M4 live search, ver justificación en el
# Cargo.toml del workspace): glob/regex de nombre + aguja multi-encoding.
regex.workspace = true
globset.workspace = true
memchr.workspace = true
# NFC del fold de nombre (misma disciplina que el quick search del TUI).
unicode-normalization.workspace = true
# Reglas declarativas de policy.toml (M3-3, spec §10): parsing con deny_unknown_fields.
toml.workspace = true
# Persistencia de plugins-state.toml (M4-P3): re-emisión preservando el fichero.
toml_edit.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Servidores SSH y FTP in-process para el test de integración del connection
# manager (mismo arnés que norte-connect; sin Docker).
libunftp.workspace = true
rand.workspace = true
russh.workspace = true
russh-sftp.workspace = true
tempfile.workspace = true
# Fixtures de connections.toml en los tests del connection manager.
toml.workspace = true
unftp-sbe-fs.workspace = true
bytes.workspace = true
norte-testkit.workspace = true
# Provider local real para el test de despacho de Engine::gc_partials (#11).
norte-vfs-local.workspace = true
# E2E del criterio de salida M2 (fase 10b): object-fs como remoto S3 stand-in.
opendal = { workspace = true, features = ["services-fs"] }
# Benchmarks del copy engine cross-provider (fase 10c).
criterion.workspace = true
# gzip de fixtures .tar.gz para el E2E del engine (#55) — mismo backend
# (zlib-rs) que la dep directa de norte-vfs-archive, sin duplicar backend.
flate2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[[bench]]
name = "copy_remoto"
harness = false

[lints]
workspace = true
