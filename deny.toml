# cargo-deny: licencias + advisories + sources. Ver docs/adr/0003.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    # Solo crates propios (core, cli); ninguna dependencia externa debería traerla.
    "AGPL-3.0-only",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
]
# notify (watcher de config, ADR 0007): CC0 = dominio público equivalente.
# Excepción ACOTADA: otra dep CC0 futura deberá justificarse aquí.
exceptions = [{ name = "notify", allow = ["CC0-1.0"] }]
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Las deps internas van por path sin versión (workspace privado, sin publish aún).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
