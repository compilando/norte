# cargo-deny: licencias + advisories + sources. Ver docs/adr/0003.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    # Solo crates propios (core, cli); ninguna dependencia externa debería traerla.
    "AGPL-3.0-only",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # M4-P2 (runtime wasmtime, ADR 0022): el árbol de wasmtime/cranelift y sus
    # utilidades cap-std (winx, wiggle, cranelift-*) llevan la licencia de LLVM
    # = Apache-2.0 con la LLVM-exception, que RELAJA Apache (elimina la cláusula
    # de patentes sobre binarios enlazados); estrictamente MÁS permisiva que la
    # Apache-2.0 pelada que ya permitimos. Permisiva, sin copyleft.
    "Apache-2.0 WITH LLVM-exception",
]
# notify (watcher de config, ADR 0007): CC0 = dominio público equivalente.
# webpki-roots (raíces CA de Mozilla para FTPS, fase 6d): CDLA-Permissive-2.0
# — licencia de DATOS (el bundle de certs), sin código; permisiva.
# Excepciones ACOTADAS: otra dep con estas licencias deberá justificarse aquí.
exceptions = [
    { name = "notify", allow = ["CC0-1.0"] },
    { name = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # Fase 7 (opendal, ADR 0016): datos de certificados raíz de Mozilla — el
    # MISMO contenido y licencia de DATOS que webpki-roots (arriba); entra
    # por reqwest → rustls-platform-verifier.
    { name = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    # Fase 7 (opendal, ADR 0016): keccak puro-Rust, CC0 (dominio público);
    # transitiva de reqsign (firma sigv4) vía const-random. Mismo criterio
    # que notify: CC0 acotado por-crate, jamás en el allow global.
    { name = "tiny-keccak", allow = ["CC0-1.0"] },
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack: sidechannel de temporización en las
    # operaciones de CLAVE PRIVADA RSA del crate `rsa`. Entra transitivamente
    # por `russh` → `ssh-key` → `rsa` (norte-vfs-sftp, ADR 0013). SIN fix
    # upstream (abierto desde 2023; lo arrastra todo el ecosistema SSH/TLS de
    # Rust). Exposición en norte: es CLIENTE sftp, no expone un oráculo RSA;
    # el único vector sería auth de cliente con clave RSA propia — fase 6, con
    # ed25519 por defecto. Riesgo aceptado y vigilado en issue #36 (migrar a
    # una pila SSH sin `rsa` en la ruta de firma, o esperar el fix upstream).
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0173 — `proc-macro-error2` SIN MANTENER (no es
    # vulnerabilidad). Es un proc-macro de BUILD-TIME que entra por
    # `age` → `i18n-embed-fl` (localización de los mensajes de error de age,
    # norte-connect fase 6). Sin impacto en runtime ni superficie de ataque.
    # Vigilado: se quita cuando age/i18n-embed-fl migren (issue #41).
    "RUSTSEC-2026-0173",
    # opendal 0.58.0 YANKEADO upstream (2026-07-18) sin sucesor publicado
    # (lo último no-yanked es 0.57; downgrade = riesgo de API en fase 7b).
    # El lockfile lo retiene y compila; el yank solo impide resoluciones
    # nuevas. Se quita con el 0.58.x/0.59 que lo reemplace (issue #76).
    { crate = "opendal@0.58.0", reason = "yanked sin sucesor; migración en #76" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Las deps internas van por path sin versión (workspace privado, sin publish aún).
allow-wildcard-paths = true
# NOTA pila criptográfica: el build ENVIADO usa una sola pila, aws-lc-rs
# (russh/suppaftp/rustls/opendal la seleccionan). `ring` solo aparece bajo
# `all-features=true` (que este [graph] activa) porque rustls enciende su
# feature `ring` — NO en el grafo real (verificado: `cargo tree -p
# norte-vfs-object -e features -i ring` = vacío). No se puede `ban` sin dar
# rojo permanente contra all-features; el invariante se revisa por-PR.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
