# `org.norte.rename-log`: a hook that tells the human how many files a rename
# touched, after the journal recorded it (demo of the `hook` category, H1 /
# ADR 0100). Not a workspace member, like every guest.
[workspace]

[package]
name = "rename-log"
edition = "2021"
version = "0.1.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Notify how many files each rename touched, as a norte hook plugin"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
