# The official PANEL plugin: the repository's status in a whole slot
# (phase 3 of the 2026-09-15 program, ADR 0116).
#
# It is NOT a workspace member, like the rest of `plugins/`: it compiles to
# `wasm32-wasip2` with its own lockfile and profile. Like `git-status`, it
# does have its own tests that run on the HOST — reading `.git/HEAD` and the
# last line of `.git/logs/HEAD` is pure code, and testing it inside a wasm
# would pay for a runtime for no gain.
[workspace]

[package]
name = "git-panel"
edition = "2021"
version = "0.1.0"
publish = false
license = "AGPL-3.0-only"
description = "Repository status panel for norte, as a WASM plugin"

[lib]
# `cdylib` is what makes a component; `rlib` is what makes the parser
# testable from the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
# wit-bindgen GUEST-side: the bindings come from the SAME WIT as the host
# (symlink `wit` -> ../../crates/norte-plugin-host/wit).
wit-bindgen = "0.46"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
