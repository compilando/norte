[plugin]
id = "org.norte.git-panel"
name = "Git panel"
publisher = "norte"
version = "0.1.0"
category = "panel"
description = "El estado del repositorio en un panel: rama, commit y los últimos movimientos."

# The slot will be called `plugin:org.norte.git-panel:status`. The minimum is
# declared by whoever knows it: under twenty-four columns a hash and a branch
# do not fit on the same line, and with fewer than six rows there is no room
# for a single reflog move under the header.
[[contributions.panel]]
kind = "status"
title = "Git"
min-cols = 24
min-rows = 6

[capabilities]
# Read under the location, with the location being the repository's root:
# without the marker, the token confines to the visible directory and `.git`
# is above it, out of reach (ADR 0057). Same declaration as `git-status`, for
# the same reason.
location = "read"
location-root-marker = ".git"

# How many reflog moves are shown. Zero turns them off: in a narrow panel the
# branch and the commit are already all that fits.
[config.moves]
type = "int"
default = 5
description = "Cuántos movimientos recientes del reflog enseñar."
