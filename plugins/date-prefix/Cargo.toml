# `org.norte.date-prefix`: a renamer that prefixes names with the file's
# modification date (demo of the `renamer` category, C3 / ADR 0095). Not a
# workspace member, like every guest.
[workspace]

[package]
name = "date-prefix"
edition = "2021"
version = "0.1.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Rename files to YYYY-MM-DD_name from their modification time, as a norte renamer plugin"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
