[plugin]
id = "org.norte.media-info"
name = "Media info"
publisher = "norte"
version = "0.1.0"
category = "columns"
description = "Two columns from file headers: image dimensions and audio duration."

# Add them to a listing as `plugin:org.norte.media-info/dims` and
# `plugin:org.norte.media-info/duration` (the columns picker offers both).
[[contributions.columns]]
id = "dims"
header = "Dims"

[[contributions.columns]]
id = "duration"
header = "Length"

# Read under the directory being listed, through an opaque token. No root
# marker: this plugin has no project to find, only the files in front of it.
# It reads at most 64 KiB of any file (`read-prefix`), and only files whose
# extension claims an image or audio format.
[capabilities]
location = "read"
