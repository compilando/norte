[plugin]
id = "org.norte.git-status"
name = "Git status"
publisher = "norte"
version = "0.2.0"
category = "columns"
description = "Marca en el panel qué ficheros cambiaron respecto al índice de git."

[[contributions.columns]]
id = "git-status"
header = "S"

[capabilities]
# Leer bajo la ubicación, y que la ubicación sea la raíz del repositorio: sin
# el marcador, el token confina al directorio visible y `.git` queda arriba,
# fuera de alcance (ADR 0057).
location = "read"
location-root-marker = ".git"

# Las letras de `git status --short` (`M`, `D`, `?`, `!`) o símbolos de una
# celda (`●`, `✖`, `+`, `·`), que se leen de un vistazo.
[config.glyphs]
type = "enum"
values = ["letters", "symbols"]
default = "letters"
description = "Cómo se marca cada estado: letras de git, o símbolos."

# Con `.gitignore` grandes la marca de ignorado se repite en media pantalla
# y deja de decir nada: apágala y un ignorado se pinta como limpio.
[config.ignored]
type = "bool"
default = true
description = "Marcar también los ficheros ignorados."
