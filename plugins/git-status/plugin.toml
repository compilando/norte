[plugin]
id = "org.norte.git-status"
name = "Git status"
publisher = "norte"
version = "0.2.0"
category = "columns"
description = "Marca en el panel qué ficheros cambiaron respecto al índice de git."

[[contributions.columns]]
id = "git-status"
header = "S"

[capabilities]
# Read under the location, with the location being the repository's root:
# without the marker, the token confines to the visible directory and `.git`
# is above it, out of reach (ADR 0057).
location = "read"
location-root-marker = ".git"

# The letters from `git status --short` (`M`, `D`, `?`, `!`) or one-cell
# symbols (`●`, `✖`, `+`, `·`), read at a glance.
[config.glyphs]
type = "enum"
values = ["letters", "symbols"]
default = "letters"
description = "Cómo se marca cada estado: letras de git, o símbolos."

# With large `.gitignore` files the ignored mark repeats across half the
# screen and stops saying anything: turn it off and an ignored file paints
# as clean.
[config.ignored]
type = "bool"
default = true
description = "Marcar también los ficheros ignorados."
