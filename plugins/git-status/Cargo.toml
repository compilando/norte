# The official columns plugin: git status (roadmap item 6, ADR 0057).
#
# It is NOT a workspace member, like the `examples-wasm/` guests: it
# compiles to `wasm32-wasip2` with its own lockfile and profile. Unlike
# them, it DOES have its own tests that run on the host — the index parser
# and the ignore matcher are pure code, and testing them inside a wasm would
# pay for a runtime for no gain.
[workspace]

[package]
name = "git-status"
edition = "2021"
version = "0.1.0"
publish = false
license = "AGPL-3.0-only"
description = "Git status column for norte, as a WASM plugin"

[lib]
# `cdylib` is what makes a component; `rlib` is what makes the parser
# testable from the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
# wit-bindgen GUEST-side: the bindings come from the SAME WIT as the host
# (symlink `wit` -> ../../crates/norte-plugin-host/wit).
wit-bindgen = "0.46"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
