name = "compat-dusk"

[roles]
background       = { bg = "#1d2021" }
regular          = { fg = "#ebdbb2" }
selection           = { fg = "#1d2021", bg = "#83a598" }
selection-unfocused = { fg = "#ebdbb2", bg = "#3c3836" }
button              = { fg = "#1d2021", bg = "#d3869b" }
border-focus     = { fg = "#83a598", bold = true }
border-unfocused = { fg = "#665c54", dim = true }
modal-border     = { fg = "#d3869b" }
status-bar       = { fg = "#1d2021", bg = "#83a598" }
title            = { fg = "#fabd2f", bold = true }
hostile-badge    = { fg = "#fb4934", bold = true }
error            = { fg = "#fb4934" }
warning          = { fg = "#fabd2f" }
info             = { fg = "#83a598" }
match            = { fg = "#1d2021", bg = "#fabd2f" }
pane-background       = { bg = "#282828" }
pane-focus-background = { bg = "#32302f" }
mark                  = { bg = "#3c3836" }
stripe                = { bg = "#252525" }

[files.kind]
dir          = { fg = "#83a598", bold = true }
symlink      = { fg = "#8ec07c" }
executable   = { fg = "#b8bb26", bold = true }
fifo         = { fg = "#fabd2f" }
socket       = { fg = "#d3869b" }
block-device = { fg = "#fe8019" }
char-device  = { fg = "#fe8019" }

[files.ext]
zip = { fg = "#fb4934" }
rs  = { fg = "#fe8019" }
md  = { fg = "#ebdbb2" }
